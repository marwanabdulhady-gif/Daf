<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title><!--PAGE_TITLE--></title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link

      rel="stylesheet"

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- GUARDRAIL 13 · Babel 8's preset-react defaults to the AUTOMATIC jsx runtime,
         which emits `import {jsx} from "react/jsx-runtime"` and blanks the whole deck
         with "Cannot use import statement outside a module". Register a classic-runtime
         preset and reference it from data-presets. -->
    <script>
      if (window.Babel && Babel.availablePresets && Babel.availablePresets["react"]) {
        Babel.registerPreset("daf-react", {
          presets: [[Babel.availablePresets["react"], { runtime: "classic" }]]
        });
      }
    </script>

    <style>
      :root {
        --daf-teal: #12857c;
        --daf-teal-2: #1aa79b;
        --daf-deep: #0a5f58;
        --daf-gold: #c9a227;
        --daf-gold-2: #e3c05a;
        --daf-ink: #10242b;
        --daf-ink-2: #47616a;
        --daf-mint: #e8f6f4;
        --daf-paper: #f7fbfa;
        --daf-line: #cde7e3;
        --daf-grad: linear-gradient(135deg, var(--daf-teal), var(--daf-teal-2));
        --daf-gold-grad: linear-gradient(135deg, var(--daf-gold), var(--daf-gold-2));

        --c: #6042a6;
        --c-2: #8b6fd4;
        --c-grad: linear-gradient(90deg, var(--c), var(--c-2));

        --m-blue: #2d70b3;
        --m-red: #c74440;
        --m-green: #388c46;
        --m-purple: #6042a6;
        --m-orange: #fa7e19;

        --ok: #388c46;
        --warn: #e0a526;
        --stop: #c74440;

        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * { box-sizing: border-box; }

      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body {
        font-family: "Satoshi", system-ui, sans-serif;
        background: linear-gradient(135deg, #f7fbfa 0%, #e8f6f4 55%, #f2faf8 100%);
        color: var(--daf-ink);
      }

      h1, h2, h3 { font-family: "Cabinet Grotesk", "Satoshi", sans-serif; }

      .mono { font-family: "JetBrains Mono", monospace; }
      .hand { font-family: "Lemonada", cursive; }

      .app {
        width: 100vw; height: 100vh; position: relative; overflow: hidden;
        background: linear-gradient(135deg, #f7fbfa 0%, #e8f6f4 55%, #f2faf8 100%);
      }

      .ambient { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

      /* ---------------- header ---------------- */
      .header {
        position: absolute; inset-inline: 0; top: 0; height: 72px; z-index: 50;
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr);
        align-items: center; gap: 14px; padding: 6px 20px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-bottom: 3px solid var(--daf-gold);
        box-shadow: 0 10px 30px rgba(10, 95, 88, 0.07);
      }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand-star { width: 42px; height: 42px; color: var(--daf-teal); flex-shrink: 0; }
      .brand-txt b { display: block; font-size: 15px; color: var(--daf-deep); letter-spacing: 0.02em; line-height: 1.1; }
      .brand-txt span { font-size: 9px; letter-spacing: 0.14em; color: var(--daf-ink-2); font-weight: 800; }
      .head-center { text-align: center; min-width: 0; padding: 0 6px; }
      .head-center b { display: block; color: var(--c); font-size: clamp(12px, 1.08vw, 15px); letter-spacing: 0.06em; transition: color .5s var(--ease); }
      .head-center span { font-size: 9.5px; letter-spacing: 0.13em; color: var(--daf-ink-2); font-weight: 800; }
      .header-right { display: flex; justify-content: flex-end; align-items: center; gap: 9px; min-width: 0; overflow: hidden; }

      /* ---------------- stage ---------------- */
      .stage-wrap { position: absolute; inset-inline: 0; top: 72px; bottom: 36px; z-index: 3; }

      .screen {
        width: 100%; height: 100%; position: relative; display: grid;
        grid-template-columns: minmax(300px, 34%) 1fr;
        overflow: hidden;
        background: linear-gradient(145deg, #ffffff 0%, #fbfefd 60%, #eef8f6 100%);
        animation: screenIn 0.66s var(--ease) both;
      }
      .screen.full { grid-template-columns: 1fr; }

      /* =====================================================================
         VISUAL-FIRST LAYOUT (the default) — the slide IS a stage.
         The copy collapses into a compact, scrollable band along the top;
         the canvas + interactive own the dominant area below and scroll
         within the slide when content is tall. Three auto layouts:
           · .l-stage  — story/build/canvas screens: copy band + big stage
           · .l-studio — interactive stage widgets (gap map, sprint, critic,
                         gate, wall): near full-width widget, slim title strip
           · .l-board — the modeled-rule board: full-bleed drawing, float text
         The legacy side-by-side grid is kept only as the narrow fallback.
         ===================================================================== */
      .screen.l-stage,
      .screen.l-studio,
      .screen.l-board {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
      }
      .screen.l-stage .copy,
      .screen.l-studio .copy,
      .screen.l-board .copy {
        flex-direction: row; align-items: center; flex-wrap: wrap; column-gap: 18px;
        justify-content: flex-start;
        padding: 12px 30px 10px;
        max-height: 132px; overflow-y: auto;
        border-bottom: 1.5px solid color-mix(in srgb, var(--c) 18%, transparent);
        background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.66));
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      .screen.l-studio .copy { max-height: 96px; }
      .screen.l-board .copy { max-height: 84px; }
      /* the compact copy band: chip + tag cluster left, headline fills,
         the lead and goal collapse behind a disclosure for more room */
      .screen.l-stage .copy h1,
      .screen.l-studio .copy h1,
      .screen.l-board .copy h1 {
        order: 2; flex: 1 1 320px; margin: 0;
        font-size: clamp(19px, 1.85vw, 30px); line-height: 1.08; letter-spacing: -0.03em;
      }
      .screen.l-stage .copy .stage-chip,
      .screen.l-studio .copy .stage-chip,
      .screen.l-board .copy .stage-chip { order: 1; margin: 0 0 4px; }
      .screen.l-stage .copy .phase-tag,
      .screen.l-studio .copy .phase-tag,
      .screen.l-board .copy .phase-tag { order: 1; margin: 0 0 4px; padding: 4px 10px; }
      .screen.l-stage .copy .lead,
      .screen.l-board .copy .lead {
        order: 3; flex: 1 1 100%; margin-top: 2px;
        font-size: 13px; line-height: 1.45; max-width: none;
      }
      .screen.l-stage .copy .goal { order: 4; flex: 1 1 100%; margin-top: 4px; }
      .screen.l-studio .copy .lead,
      .screen.l-studio .copy .goal { display: none; }
      .screen.l-board .copy .goal { display: none; }
      .screen.l-stage .copy-star,
      .screen.l-studio .copy-star,
      .screen.l-board .copy-star { display: none; }

      /* the stage area fills the row beneath the band; content scrolls */
      .screen.l-stage .visual,
      .screen.l-studio .visual,
      .screen.l-board .visual {
        grid-row: 2; padding: 14px 30px 46px;
        align-items: stretch; justify-content: center;
      }
      .screen.l-stage .visual > *,
      .screen.l-studio .visual > * { max-height: 100%; }
      .screen.l-stage .visual > .glass-panel,
      .screen.l-studio .visual > .glass-panel {
        justify-content: flex-start; overflow-y: auto;
        scrollbar-width: thin; scrollbar-color: rgba(18,133,124,.3) transparent;
      }
      /* interactive widgets get a roomier max width so cards/chips breathe */
      .screen.l-studio .visual { padding-inline: clamp(20px, 5vw, 72px); }
      .screen.l-board .visual { padding: 10px 24px 40px; }
      /* full-bleed board: the rule drawing owns the whole stage */
      .screen.l-board .visual > .glass-panel,
      .screen.l-board .visual > .story-shell {
        max-height: 100%; overflow: hidden;
      }

      /* On the story build screens (stage 3), the in-stage story ribbon
         already carries the scene title + text, so the top band tightens to
         a single line — no duplicated narrative, maximum room for the
         interactive. The teacher rail (T) still shows the full meta. */
      .screen.l-stage .copy:has(~ .visual .story-shell) .lead,
      .screen.l-stage .copy:has(~ .visual .story-shell) .goal { display: none; }
      .screen.l-stage .copy:has(~ .visual .story-shell) { max-height: 78px; align-items: center; padding-block: 9px; }
      .screen.l-stage .copy:has(~ .visual .story-shell) h1 { font-size: clamp(16px, 1.5vw, 23px); }
      .screen.l-stage .copy:has(~ .visual .story-shell) .stage-chip { margin-bottom: 0; }
      /* the in-stage story ribbon becomes a slim single-row caption bar */
      .screen.l-stage .visual .story-shell { gap: 8px; }
      .screen.l-stage .visual .story-shell .story-ribbon {
        min-height: 64px; grid-template-columns: auto minmax(0, 1fr) auto; padding: 7px 14px;
      }
      .screen.l-stage .visual .story-shell .story-ribbon-copy p {
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }
      .screen.l-stage .visual .story-shell .story-ribbon-copy small { display: none; }

      /* gentle scrollbar inside the scrolling copy band */
      .screen.l-stage .copy::-webkit-scrollbar,
      .screen.l-studio .copy::-webkit-scrollbar,
      .screen.l-board .copy::-webkit-scrollbar { height: 5px; }
      .screen.l-stage .copy::-webkit-scrollbar-thumb,
      .screen.l-studio .copy::-webkit-scrollbar-thumb,
      .screen.l-board .copy::-webkit-scrollbar-thumb { background: rgba(18,133,124,.2); border-radius: 999px; }

      /* narrow screens keep the readable side-by-side split; very short
         viewports let the copy band grow and scroll */
      @media (max-width: 940px) {
        .screen.l-stage, .screen.l-board {
          grid-template-columns: minmax(280px, 38%) 1fr;
          grid-template-rows: minmax(0, 1fr);
        }
        .screen.l-stage .copy, .screen.l-board .copy {
          flex-direction: column; align-items: flex-start; justify-content: center;
          grid-row: 1 / span 2; max-height: none; border-bottom: none;
          background: none; backdrop-filter: none; padding: 26px 18px 40px 30px;
        }
        .screen.l-stage .visual, .screen.l-board .visual { grid-row: 1 / span 2; }
        .screen.l-stage .copy h1, .screen.l-board .copy h1 {
          order: 0; flex: none; font-size: clamp(24px, 2.4vw, 40px);
        }
        .screen.l-stage .copy .lead, .screen.l-board .copy .lead,
        .screen.l-stage .copy .goal, .screen.l-board .copy .goal { display: block; flex: none; }
        .screen.l-stage .copy-star, .screen.l-board .copy-star { display: block; }
      }
      .screen:before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(color-mix(in srgb, var(--c) 4%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--c) 4%, transparent) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: linear-gradient(to bottom, #000, transparent 94%);
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent 94%);
      }
      @keyframes screenIn {
        from { opacity: 0; transform: scale(1.014); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      /* THE STAGE (light paper scheme) — the slide IS the stage: the school's
         light paper, teal + gold accents. Panels are borderless so the canvas
         and the controls float directly on the stage (the canvas paints the
         same paper via the light-stage remap in draw.js — no board, no box).
         Interactive controls span the full stage width, not a bordered box.
         In the visual-first layouts the canvas grows to fill the taller
         stage instead of staying at its fixed inline height. */
      .visual > .glass-panel,
      .visual > .story-shell .glass-panel {
        background: transparent; border: none; box-shadow: none;
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      .visual > .glass-panel:has(canvas),
      .visual > .story-shell .glass-panel:has(canvas) { padding: 6px; }
      /* canvas-heavy panels fill the stage and the canvas grows to use the
         larger visual area (the drawing re-fits via the ResizeObserver).
         Paths cover both bare panels (.visual > .glass-panel) and in-story
         panels (.visual .story-shell … .glass-panel). */
      .screen.l-stage .visual .glass-panel:has(canvas:not(.ambient)),
      .screen.l-studio .visual .glass-panel:has(canvas:not(.ambient)) {
        flex: 1 1 auto; min-height: 0; justify-content: stretch;
      }
      .screen.l-stage .visual .glass-panel > canvas:not(.ambient),
      .screen.l-studio .visual .glass-panel > canvas:not(.ambient),
      .screen.l-stage .visual .board-stage canvas,
      .screen.l-studio .visual .board-stage canvas {
        width: 100% !important;
        flex: 1 1 320px; min-height: 320px;
        height: auto !important;
      }
      /* story content also fills the taller stage */
      .screen.l-stage .visual .story-content,
      .screen.l-studio .visual .story-content { min-height: 0; flex: 1 1 auto; }
      .screen.l-stage .visual .story-content > .glass-panel,
      .screen.l-studio .visual .story-content > .glass-panel { flex: 1 1 auto; min-height: 0; }
      .chip-bar { width: 100%; padding: 2px 2px 4px; }
      .chip-label { font-weight: 900; font-size: 12px; color: var(--c); margin: 0 2px 9px; }
      .chip-row { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }
      .chip-row .btn { flex: 1 1 auto; min-width: 110px; }
      .stage-line { text-align: center; font-size: 12.5px; color: var(--daf-ink-2); padding: 2px 8px 8px; }

      /* THE STAGE — board screens are full-stage: the drawing owns the whole
         visual area at full height (no framed box), Dar Al Fikr deep-teal
         surface with the logo-gold breathing frame drawn by D.stage itself. */
      .glass-panel:has(> .board-stage) { background: transparent; border: none; box-shadow: none; padding: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .board-stage { position: relative; flex: 1; min-height: 260px; }
      .stage-caption { position: absolute; left: 0; right: 0; bottom: 12px; text-align: center; font-size: 11.5px; color: rgba(16,36,43,.62); padding: 0 18px; pointer-events: none; }
      /* board screens run the full-bleed .l-board layout chosen by the Frame */
      .screen.l-board .glass-panel:has(> .board-stage) { padding: 0; }

      /* Staggered element reveals (Syntax-Academy revealUp, English edition):
         every element on the screen enters with a .08s offset. Disabled under
         prefers-reduced-motion (static state, per the accessibility policy). */
      @keyframes revealUp {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: none; }
      }
      .screen .copy > *, .screen .visual > * { animation: revealUp .5s var(--ease) both; }
      .screen .copy > :nth-child(1), .screen .visual > :nth-child(1) { animation-delay: .06s; }
      .screen .copy > :nth-child(2), .screen .visual > :nth-child(2) { animation-delay: .14s; }
      .screen .copy > :nth-child(3), .screen .visual > :nth-child(3) { animation-delay: .22s; }
      .screen .copy > :nth-child(4), .screen .visual > :nth-child(4) { animation-delay: .30s; }
      .screen .copy > :nth-child(5), .screen .visual > :nth-child(5) { animation-delay: .38s; }
      .screen .copy > :nth-child(6), .screen .visual > :nth-child(6) { animation-delay: .46s; }
      @media (prefers-reduced-motion: reduce) {
        .screen .copy > *, .screen .visual > * { animation: none; }
      }

      .copy {
        position: relative; z-index: 5;
        padding: 34px 22px 46px 44px;
        display: flex; flex-direction: column; justify-content: center;
      }

      .visual {
        position: relative; z-index: 4; min-width: 0; min-height: 0;
        display: flex; align-items: stretch; justify-content: center;
        padding: 20px 40px 42px 14px;
      }
      .visual > .glass-panel {
        display: flex; flex-direction: column; justify-content: center;
        max-height: 100%; overflow-y: auto;
      }
      .visual > .glass-panel::-webkit-scrollbar { width: 6px; }
      .visual > .glass-panel::-webkit-scrollbar-thumb { background: rgba(18,133,124,.22); border-radius: 999px; }

      .copy-star {
        position: absolute; width: 300px; height: 300px;
        inset-inline-start: -70px; bottom: -60px;
        color: var(--c); opacity: 0.05; pointer-events: none;
      }

      .phase-tag {
        display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
        font-size: 10.5px; font-weight: 900; letter-spacing: 0.16em;
        text-transform: uppercase; color: #fff; background: var(--c-grad);
        padding: 6px 13px; border-radius: 999px; margin-bottom: 15px;
        box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 30%, transparent);
      }

      h1 {
        font-size: clamp(27px, 2.9vw, 46px); line-height: 1.02;
        letter-spacing: -0.04em; margin: 0 0 15px; font-weight: 900; color: var(--daf-ink);
      }
      h1 em {
        font-style: normal;
        background: var(--c-grad);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lead { font-size: clamp(13.5px, 1.1vw, 17px); line-height: 1.55; color: var(--daf-ink-2); max-width: 560px; margin: 0; }

      .goal {
        margin-top: 18px; padding-inline-start: 13px;
        border-inline-start: 3px solid var(--daf-gold);
        font-size: 11.5px; color: var(--daf-ink-2); line-height: 1.5; max-width: 480px;
      }
      .goal b { color: var(--daf-deep); }

      .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 18px; }
      .chip {
        padding: 7px 13px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
        background: #fff; border: 1px solid var(--daf-line); color: var(--daf-deep);
      }

      /* ---------------- footer + progress ---------------- */
      .footer {
        position: absolute; inset-inline: 0; bottom: 0; height: 36px; z-index: 60;
        background: linear-gradient(90deg, var(--daf-deep), var(--daf-teal));
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 26px; font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: 0.05em;
      }
      .pull { opacity: 0.92; font-weight: 600; }

      .progress {
        position: absolute; inset-inline-start: 0; top: 69px; height: 3px; z-index: 70;
        background: var(--c-grad); transition: width 0.6s var(--ease);
      }

      /* ---------------- nav ---------------- */
      .nav { position: absolute; inset-inline-end: 18px; bottom: 48px; z-index: 80; display: flex; align-items: center; gap: 7px; }
      .nav button {
        width: 42px; height: 42px; border: 1px solid var(--daf-line); border-radius: 50%;
        background: #fff; color: var(--daf-deep); cursor: pointer; font-size: 15px;
        box-shadow: 0 8px 24px rgba(10, 95, 88, 0.12); transition: all 0.25s var(--ease);
      }
      .nav button:hover:not(:disabled) { transform: scale(1.09); background: var(--c); color: #fff; border-color: var(--c); }
      .nav button:disabled { opacity: 0.28; cursor: not-allowed; }
      .counter {
        padding: 9px 15px; border-radius: 999px; background: #fff; border: 1px solid var(--daf-line);
        font: 700 11px "JetBrains Mono", monospace; color: var(--daf-deep);
      }

      .dots {
        position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%);
        z-index: 70; display: flex; flex-direction: column; gap: 5px;
      }
      .dot { width: 4px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--daf-teal) 25%, transparent); transition: 0.35s; cursor: pointer; }
      .dot.active { height: 22px; background: var(--c); box-shadow: 0 0 12px var(--c); }

      /* ---------------- panels ---------------- */
      .glass-panel {
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
        border-radius: 18px; padding: 22px;
        box-shadow: 0 20px 45px rgba(10, 95, 88, 0.08), 0 1px 2px rgba(255, 255, 255, 0.9) inset;
        width: 100%;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--daf-line); border-radius: 14px; padding: 16px;
        transition: all 0.3s var(--ease); cursor: pointer;
      }
      .glass-card:hover, .glass-card.active {
        border-color: var(--c); transform: translateY(-3px);
        box-shadow: 0 16px 36px color-mix(in srgb, var(--c) 18%, transparent);
      }
      .glass-card.chosen { border-color: var(--c); border-width: 2px; background: #fff; }

      /* ---------------- story layer: three truth-status lanes ------------ */
      .visual > .story-shell {
        width: 100%; max-height: 100%; overflow-y: auto; padding: 1px 5px 5px;
        scrollbar-width: thin; scrollbar-color: rgba(18,133,124,.24) transparent;
      }
      .story-shell { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      .story-ribbon {
        position: relative; min-height: 76px; overflow: hidden;
        display: grid; grid-template-columns: auto minmax(0,1fr) minmax(145px,210px);
        gap: 12px; align-items: center; padding: 8px 13px;
        border-radius: 16px; border: 1px solid rgba(96,66,166,.24);
        background: linear-gradient(112deg,#fff 0%,#f8f4ff 68%,#f0e9fa 100%);
        box-shadow: 0 9px 24px rgba(7,30,39,.07);
      }
      .lane-stem .story-ribbon { border-color: rgba(45,112,179,.28); background: linear-gradient(112deg,#fff,#eef7ff); }
      .lane-amanah .story-ribbon { border-color: rgba(56,140,70,.3); background: linear-gradient(112deg,#fff,#eff8ef); }
      .story-motif { position: absolute; inset-inline-end: 0; bottom: -18px; width: 210px; height: 115px; color: #6042A6; opacity: .075; pointer-events: none; }
      .lane-stem .story-motif { color: #2D70B3; }.lane-amanah .story-motif { color: #388C46; }
      .story-cast { position: relative; z-index: 2; display: flex; align-items: end; min-width: 58px; justify-content: center; }
      .story-character,.story-lantern { display: block; flex: 0 0 auto; filter: drop-shadow(0 5px 5px rgba(7,30,39,.12)); }
      .story-ribbon-copy { position: relative; z-index: 2; min-width: 0; }
      .story-lane { display: inline-flex; gap: 6px; align-items: center; font-size: 8.5px; font-weight: 950; letter-spacing: .13em; text-transform: uppercase; color: #6042A6; }
      .lane-stem .story-lane { color: #2D70B3; }.lane-amanah .story-lane { color: #388C46; }
      .story-ribbon-copy>b { display: block; margin-top: 2px; color: var(--daf-ink); font-size: 13px; line-height: 1.25; }
      .story-ribbon-copy p { margin: 2px 0 0; color: var(--daf-ink-2); font-size: 10.5px; line-height: 1.38; }
      .story-ribbon-copy small { display: block; margin-top: 4px; color: #6042A6; font-size: 9.5px; font-weight: 850; }
      .lane-stem .story-ribbon-copy small { color: #2D70B3; }
      .folio-progress { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; align-items: center; padding: 8px 9px; border-radius: 11px; background: rgba(255,255,255,.78); border: 1px solid rgba(96,66,166,.16); }
      .folio-label { min-width: 0; }.folio-label b { display:block; font-size: 9px; color:#6042A6; text-transform:uppercase; letter-spacing:.1em; }.folio-label span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:8.5px; color:var(--daf-ink-2); }
      .folio-progress em { grid-row: 1 / span 2; grid-column: 2; font: 800 10px "JetBrains Mono",monospace; color:#6042A6; font-style:normal; }
      .folio-pips { display:flex; gap:3px; }.folio-pips i { display:block; width:12px; height:4px; border-radius:5px; background:#ddd5ed; }.folio-pips i.restored { background:linear-gradient(90deg,#6042A6,#C9A227); }
      .story-content { display:flex; flex-direction:column; gap:10px; min-width:0; }
      .story-content>.glass-panel { flex: 1; }
      .story-shell.compact .story-ribbon { min-height: 84px; }
      .stem-layout { display:grid; grid-template-columns:minmax(190px,.72fr) minmax(0,1.5fr); gap:10px; align-items:stretch; }
      .stem-source-card { border:1px solid rgba(45,112,179,.25); border-radius:15px; background:#F2F8FD; padding:14px; }
      .stem-source-card h3 { margin:8px 0 4px; font-size:13px; color:#1D5C91; }.stem-source-card p { margin:0; font-size:10.5px; color:var(--daf-ink-2); line-height:1.45; }
      .stem-status { font-size:8.5px; font-weight:900; letter-spacing:.08em; color:#2D70B3; text-transform:uppercase; }
      .stem-source-card details { margin-top:10px; font-size:9.5px; color:var(--daf-ink-2); }.stem-source-card summary { cursor:pointer; font-weight:900; color:#2D70B3; }.stem-source-card a { display:block; color:#1D5C91; margin-top:5px; }
      .stem-math { min-width:0; display:flex; }.stem-math>.glass-panel { flex:1; }
      .handoff-artifact { display:flex; gap:11px; align-items:center; padding:10px 14px; border-radius:13px; color:#fff; background:linear-gradient(100deg,#0B1F24,#12857C); border:1px solid rgba(201,162,39,.55); }
      .handoff-artifact>span { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; background:var(--daf-gold); color:#10242B; }.handoff-artifact b { display:block; color:var(--daf-gold-2); font-size:10px; text-transform:uppercase; letter-spacing:.09em; }.handoff-artifact p { margin:2px 0 0; font-size:11px; color:#EAF4F2; }
      .handoff-artifact .folio-stamp { margin-left:auto; align-self:center; }
      .handoff-artifact .folio-stamp.on { color:#0B1F24; background:var(--daf-gold); }
      .folio-save-note { flex-basis:100%; margin:0; font-size:9.5px; color:#F2C9C7; }
      .amanah-layout { display:grid; grid-template-columns:minmax(190px,.72fr) minmax(0,1.5fr); gap:10px; align-items:stretch; }
      .amanah-card { border:1px solid rgba(56,140,70,.3); border-radius:15px; background:#F0F8F0; padding:14px; }
      .amanah-card h3 { margin:8px 0 4px; font-size:13px; color:#2C6E38; }.amanah-card p { margin:0; font-size:10.5px; color:var(--daf-ink-2); line-height:1.45; }
      .amanah-status { font-size:8.5px; font-weight:900; letter-spacing:.08em; color:#388C46; text-transform:uppercase; }
      .amanah-card details { margin-top:10px; font-size:9.5px; color:var(--daf-ink-2); }.amanah-card summary { cursor:pointer; font-weight:900; color:#388C46; }
      @media(max-width:900px){.amanah-layout{grid-template-columns:1fr}}
      @media(max-width:900px){.story-ribbon{grid-template-columns:auto minmax(0,1fr)}.folio-progress{display:none}.stem-layout{grid-template-columns:1fr}.story-ribbon-copy p{font-size:9.5px}}

      .btn { border: none; cursor: pointer; font-weight: 800; border-radius: 10px; transition: all 0.25s var(--ease); font-size: 12px; padding: 10px 18px; font-family: inherit; }
      .btn-primary { background: var(--c-grad); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 32%, transparent); }
      .btn-primary:hover { transform: translateY(-2px); }
      .btn-gold { background: var(--daf-gold-grad); color: #10242b; box-shadow: 0 6px 18px rgba(201, 162, 39, 0.3); }
      .btn-gold:hover { transform: translateY(-2px); }
      .btn-ghost { background: #fff; color: var(--daf-deep); border: 1px solid var(--daf-line); }
      .btn-ghost:hover { border-color: var(--c); transform: translateY(-2px); }
      .btn-sm { padding: 6px 12px; font-size: 10.5px; }

      /* ---------------- math ---------------- */
      .daf-math { font-size: 1em; }
      math { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", serif; }
      .math-inline { display: inline-block; vertical-align: middle; }
      .math-block { display: block; text-align: center; margin: 8px 0; }
      .math-xl math { font-size: 34px; }
      .math-lg math { font-size: 24px; }
      .math-md math { font-size: 18px; }
      .daf-math-error { color: var(--stop); font-size: 12px; }


      /* ---------------- board mode: gates, attribution, ledger ---------------- */
      .gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
        background:linear-gradient(135deg,#0A5F58,#12857C);padding:24px;overflow:auto}
      .gate-card{background:#fff;border-radius:22px;padding:34px 38px;max-width:520px;text-align:center;
        box-shadow:0 30px 70px rgba(0,0,0,.28)}
      .gate-card.wide{max-width:860px}
      .gate-card h2{margin:0 0 6px;color:var(--daf-deep);font-size:23px}
      .gate-card p{margin:0 0 18px;color:var(--daf-ink-2);font-size:13.5px}
      .gate-sections{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
      .gate-sections .btn{min-width:120px;font-size:17px;padding:14px 22px}
      .gate-note{margin-top:16px;font-size:11px;color:var(--daf-ink-2)}
      .name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;
        max-height:46vh;overflow:auto;padding:2px}
      .name-chip{border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);
        border-radius:10px;padding:10px 8px;font:700 12.5px inherit;cursor:pointer;
        transition:all .16s var(--ease);text-align:center}
      .name-chip.on{border-color:var(--daf-teal);color:var(--daf-deep);background:var(--daf-mint)}
      .name-chip.pick{border-color:var(--daf-gold);background:#fffbe9;color:#7a5f00;
        box-shadow:0 0 0 3px rgba(201,162,39,.18)}
      .name-chip:hover{transform:translateY(-1px)}
      .qp-sub{font-size:11.5px;color:var(--daf-ink-2);display:block;margin-top:3px}
      .qp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}

      /* ---- gate: saved classes vs pasted list ---- */
      .gate-tabs{display:flex;gap:8px;justify-content:center;margin:4px 0 18px}
      .gate-tab{border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);
        border-radius:999px;padding:8px 18px;font:800 12px inherit;cursor:pointer;transition:all .16s var(--ease)}
      .gate-tab.on{background:var(--daf-teal);border-color:var(--daf-teal);color:#fff}
      .gate-sections .btn em{font-style:normal;font-size:11px;opacity:.75;margin-inline-start:8px}
      .saved-class{position:relative;display:inline-flex}
      .saved-x{position:absolute;top:-7px;inset-inline-end:-7px;width:20px;height:20px;border-radius:50%;
        border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);font-size:9px;cursor:pointer}
      .saved-x:hover{border-color:var(--stop);color:var(--stop)}
      .paste-wrap{text-align:left}
      .paste-name{width:100%;border:1.5px solid var(--daf-line);border-radius:10px;padding:11px 14px;
        font:800 14px inherit;color:var(--daf-deep);margin-bottom:9px}
      .paste-area{width:100%;height:190px;border:1.5px solid var(--daf-line);border-radius:12px;
        padding:12px 14px;font:500 13px inherit;line-height:1.6;color:var(--daf-ink);resize:vertical}
      .paste-name:focus,.paste-area:focus{outline:none;border-color:var(--daf-teal);
        box-shadow:0 0 0 3px rgba(18,133,124,.14)}
      .paste-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
        margin-top:8px;flex-wrap:wrap}
      .paste-count{font-size:12px;color:var(--daf-ink-2)}
      .paste-count b{color:var(--daf-teal);font-size:14px}
      .paste-remember{font-size:11.5px;color:var(--daf-ink-2);display:flex;align-items:center;gap:6px;cursor:pointer}
      .add-row{display:flex;gap:8px;margin-top:12px}
      .add-row input{flex:1;border:1.5px solid var(--daf-line);border-radius:10px;padding:9px 12px;
        font:600 12.5px inherit;color:var(--daf-ink)}
      .add-row input:focus{outline:none;border-color:var(--daf-teal)}

      /* ---- the dojo (P) — full-screen class board, ClassDojo pace ---- */
      .dojo{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
        background:radial-gradient(1100px 600px at 70% -10%,#12333B 0%,var(--daf-board,#0B1F24) 60%);
        color:#EAF4F2;padding:18px 22px 12px;animation:dj-in .22s var(--ease)}
      @keyframes dj-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
      .dj-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
      .dj-title b{font-size:19px;letter-spacing:.02em}
      .dj-title span{display:block;font-size:11.5px;color:#9fc4bd}
      .dj-star{font-style:normal;color:var(--daf-gold);font-weight:800}
      .dj-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .dj-top .dj-tools:last-child{margin-inline-start:auto}
      .dojo .btn-ghost{border-color:#2c5058;color:#cfe8e3;background:rgba(255,255,255,.04)}
      .dojo .btn-ghost:hover{border-color:var(--daf-gold);color:#fff}
      .dj-job{display:flex;align-items:center;gap:10px;background:rgba(201,162,39,.14);
        border:1.5px solid var(--daf-gold);border-radius:12px;padding:8px 14px;flex:1;min-width:220px}
      .dj-job span{font-weight:800;font-size:13.5px}
      .dj-job em{font-style:normal;font:800 12px "JetBrains Mono",monospace;color:var(--daf-gold);white-space:nowrap}
      .dj-job i{color:var(--daf-gold)}
      .dj-reasons{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
      .dj-sep{width:1.5px;height:22px;background:#2c5058;margin:0 4px}
      .dj-chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;cursor:pointer;
        border:1.5px solid #2c5058;background:rgba(255,255,255,.05);color:#d9ece8;
        padding:6px 12px;font:inherit;font-size:12px;font-weight:700;transition:all .13s var(--ease)}
      .dj-chip em{font-style:normal;font:800 11.5px "JetBrains Mono",monospace}
      .dj-chip.good i,.dj-chip.good em{color:#7ED08C}
      .dj-chip.bad i,.dj-chip.bad em{color:#F2938F}
      .dj-chip:hover{transform:translateY(-1px);border-color:#9fc4bd}
      .dj-chip.good.on{background:#388C46;border-color:#7ED08C;color:#fff}
      .dj-chip.bad.on{background:#C74440;border-color:#F2938F;color:#fff}
      .dj-chip.on i,.dj-chip.on em{color:#fff}
      .dj-att{background:rgba(201,162,39,.1);border:1px dashed var(--daf-gold);border-radius:12px;padding:8px 12px}
      .dj-att-note{font-size:12.5px;font-weight:700;color:var(--daf-gold);display:inline-flex;gap:8px;align-items:center}
      .dj-att input{flex:1;min-width:200px;border:1.5px solid #2c5058;background:rgba(0,0,0,.25);
        border-radius:9px;padding:7px 11px;font:600 12.5px inherit;color:#fff}
      .dj-att input:focus{outline:none;border-color:var(--daf-gold)}
      .dj-grid{flex:1;overflow:auto;display:grid;gap:10px;align-content:start;padding:4px 2px;
        grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
      .dj-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
        border:1.5px solid #24464e;border-radius:16px;background:rgba(255,255,255,.045);
        padding:12px 6px 10px;cursor:pointer;font:inherit;color:#EAF4F2;
        transition:all .13s var(--ease)}
      .dj-card:hover{border-color:#9fc4bd;background:rgba(255,255,255,.09);transform:translateY(-2px)}
      .dj-card.away{opacity:.32;filter:grayscale(.7)}
      .dj-card.hot{border-color:var(--daf-gold);background:rgba(201,162,39,.16);
        box-shadow:0 0 0 3px rgba(201,162,39,.28),0 10px 26px rgba(0,0,0,.35);transform:translateY(-3px) scale(1.04)}
      .dj-body{position:relative;display:block;width:58px}
      .dj-av{width:58px;height:58px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
      .dj-body.pop{animation:dj-pop .5s var(--ease)}
      .dj-body.shake{animation:dj-shake .45s var(--ease)}
      @keyframes dj-pop{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-3deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
      @keyframes dj-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}45%{transform:translateX(5px) rotate(2deg)}70%{transform:translateX(-3px)}}
      .dj-bubble{position:absolute;top:-7px;inset-inline-end:-13px;min-width:24px;height:24px;
        display:grid;place-items:center;padding:0 5px;border-radius:999px;background:var(--daf-gold);
        color:#10242B;font:800 11.5px "JetBrains Mono",monospace;box-shadow:0 3px 8px rgba(0,0,0,.4)}
      .dj-bubble.neg{background:#C74440;color:#fff}
      .dj-name{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;padding:0 4px}
      .dj-away-tag{font-size:9px;letter-spacing:.14em;color:#F2938F;font-weight:800}
      .dj-burst{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;
        font:900 17px "JetBrains Mono",monospace;color:#7ED08C;text-shadow:0 2px 8px rgba(0,0,0,.5);
        animation:dj-float 1s var(--ease) forwards}
      .dj-burst.neg{color:#F2938F}
      @keyframes dj-float{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}
        20%{opacity:1;transform:translate(-50%,-8px) scale(1.25)}
        100%{opacity:0;transform:translate(-50%,-42px) scale(1)}}
      .dj-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:9px;
        border-top:1px solid #1d3d44;font-size:12px;color:#9fc4bd}
      .dj-last{flex:1;min-width:200px}
      .dj-last em{font-style:normal;font:800 12px "JetBrains Mono",monospace}
      .dj-last em.pos{color:#7ED08C} .dj-last em.neg{color:#F2938F}
      .dj-exports{display:flex;gap:14px;flex-wrap:wrap}
      .dj-note{flex-basis:100%;font-size:9px;color:rgba(217,237,235,.45);margin-top:2px}
      .dj-exports a{color:#9fc4bd;cursor:pointer;display:inline-flex;gap:6px;align-items:center;
        font-size:11px;letter-spacing:.06em;text-decoration:none}
      .dj-exports a:hover{color:var(--daf-gold)}


      .class-chip{display:flex;align-items:center;gap:9px;border:1.5px solid var(--daf-line);
        background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;transition:all .18s var(--ease)}
      .class-chip:hover{border-color:var(--daf-teal);transform:translateY(-1px)}
      .class-chip b{font-size:14px;color:var(--daf-deep)}
      .class-chip span{font-size:10px;color:var(--daf-ink-2)}
      .class-chip em{font:700 12px "JetBrains Mono",monospace;color:var(--daf-gold);font-style:normal}

      table.ledger{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
      table.ledger th{background:var(--daf-deep);color:#fff;text-align:left;padding:7px 9px;font-size:10.5px;
        letter-spacing:.05em;position:sticky;top:0}
      table.ledger td{border-bottom:1px solid var(--daf-line);padding:6px 9px}
      table.ledger tr.absent{opacity:.4}
      .mini-badge{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:5px;
        font-size:9px;margin-right:3px;color:#fff;background:#b98f14}
      .mini-badge.tier-2{background:#8FA3AA} .mini-badge.tier-3{background:var(--daf-gold)}
      .badge.tier-2{border-color:#8FA3AA;color:#8FA3AA}
      .badge.tier-3{border-color:var(--daf-gold);color:var(--daf-gold);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
      .ledger-note{margin-top:12px;font-size:11px;color:var(--daf-ink-2);line-height:1.5}

      /* ---------------- the two doors ---------------- */
      .lane-head{text-align:center}
      .lane-head b{display:block;font-size:14.5px;color:var(--daf-ink)}
      .lane-head span{font-size:11.5px;color:var(--daf-ink-2)}
      .lane-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      @media(max-width:820px){.lane-grid{grid-template-columns:1fr}}
      .q-panel{position:relative;border:2px solid var(--daf-line);border-radius:14px;
        padding:24px 16px 16px;background:#fff;text-align:center;min-height:150px}
      .q-tag{position:absolute;top:-10px;left:14px;color:#fff;font:800 9.5px inherit;
        letter-spacing:.14em;padding:3px 10px;border-radius:999px}
      .q-prompt{font-size:12.5px;font-weight:700;color:var(--daf-ink-2);line-height:1.5;margin-bottom:8px}
      .q-answer{margin-top:10px;border-top:1px dashed var(--daf-line);padding-top:10px}
      .q-answer-v{font:900 24px "JetBrains Mono",monospace}
      .q-hint{font-size:11px;color:var(--daf-ink-2);margin-top:5px;line-height:1.45}
      .award-stack{display:flex;flex-direction:column;gap:8px}
      .award-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
        background:#fff;border:1.5px solid var(--daf-line);border-radius:12px;padding:10px 14px;
        font:inherit;transition:all .16s var(--ease)}
      .award-row:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(10,95,88,.09)}
      .award-row.done{opacity:.55}
      .ar-main{flex:1;display:flex;flex-direction:column}
      .ar-main b{font-size:13px} .ar-main em{font-size:10.5px;color:var(--daf-ink-2);font-style:normal}
      .ar-xp{color:#fff;font:800 12px "JetBrains Mono",monospace;padding:3px 9px;border-radius:999px}
      .ar-cta{font-size:10.5px;font-weight:800;color:var(--daf-ink-2);min-width:96px;text-align:right}
      .sijill-btn{margin-top:9px;width:100%;border:1.5px dashed var(--daf-gold);background:#fffdf3;
        color:#7a5f00;border-radius:9px;padding:7px;font:800 11px inherit;cursor:pointer}
      .sijill-btn:hover{background:#fff8e2}

      /* ---------------- gamification ---------------- */
      .xp-wrap { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
      .xp-track { width: 92px; min-width: 34px; flex: 0 1 auto; height: 7px; border-radius: 999px; background: var(--daf-mint); overflow: hidden; border: 1px solid var(--daf-line); }
      .xp-fill { height: 100%; background: var(--daf-gold-grad); transition: width 0.6s var(--bounce); }
      .xp-num { font: 700 11px "JetBrains Mono", monospace; color: var(--daf-deep); min-width: 46px; }

      .badge-row { display: flex; gap: 6px; flex: 0 0 auto; }
      .badge {
        width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
        border: 1.5px solid var(--daf-line); background: #fff; color: var(--daf-line);
        transition: all 0.45s var(--bounce); font-size: 12px;
      }
      .badge.on { border-color: var(--daf-gold); color: var(--daf-gold); background: #fffdf4; transform: scale(1.06); box-shadow: 0 0 0 3px rgba(201,162,39,.14); }

      .flash {
        position: absolute; inset-inline-end: 22px; top: 86px; z-index: 95;
        background: var(--daf-gold-grad); color: #10242b; font-weight: 900; font-size: 12px;
        padding: 10px 16px; border-radius: 12px; box-shadow: 0 12px 30px rgba(201, 162, 39, 0.4);
        animation: flashIn 0.5s var(--bounce);
      }
      @keyframes flashIn { from { opacity: 0; transform: translateY(-14px) scale(0.9); } to { opacity: 1; transform: none; } }

      /* ---------------- modals ---------------- */
      .modal {
        position: absolute; inset: 0; z-index: 100;
        background: rgba(11, 31, 36, 0.9);
        backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
        padding: 34px; display: flex; flex-direction: column; animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal h2 { color: var(--daf-gold); margin: 0; font-size: 23px; font-weight: 900; }

      /* white working surface for the board-mode modals (ledger, attribution) */
      .modal-card{background:#fff;border-radius:18px;padding:20px 24px;margin:auto;
        width:min(1120px,96vw);max-height:88vh;overflow:auto;
        box-shadow:0 30px 80px rgba(0,0,0,.45);animation:popIn .26s var(--bounce)}
      .modal-card.wide{width:min(1220px,97vw)}
      .modal-card h3{color:var(--daf-deep);font-size:19px;font-weight:900}
      .modal-head{display:flex;justify-content:space-between;align-items:flex-start;
        gap:14px;margin-bottom:14px;flex-wrap:wrap}
      @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

      .rail {
        position: absolute; inset-inline-end: 0; top: 72px; bottom: 36px; width: 340px; z-index: 90;
        background: rgba(11, 31, 36, 0.96); color: #dff1ee; padding: 22px; overflow-y: auto;
        box-shadow: -12px 0 40px rgba(0, 0, 0, 0.2); animation: railIn 0.35s var(--ease);
      }
      @keyframes railIn { from { transform: translateX(100%); } to { transform: none; } }
      .rail h4 { color: var(--daf-gold); font-size: 10.5px; letter-spacing: 0.14em; margin: 18px 0 7px; font-weight: 900; }
      .rail p { font-size: 12.5px; line-height: 1.55; margin: 0 0 6px; color: #cfe6e2; }
      .rail .say { background: rgba(255,255,255,.07); border-inline-start: 3px solid var(--daf-gold); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; }

      .scroll-y { overflow-y: auto; }
      .scroll-y::-webkit-scrollbar { width: 6px; }
      .scroll-y::-webkit-scrollbar-thumb { background: rgba(18,133,124,.25); border-radius: 999px; }

      .kbd {
        display: inline-block; min-width: 18px; text-align: center; padding: 1px 5px;
        border: 1px solid var(--daf-line); border-bottom-width: 2px; border-radius: 5px;
        font: 700 10px "JetBrains Mono", monospace; color: var(--daf-deep); background: #fff;
      }

      /* =========================================================================
         THE SEVEN STAGES · engine screens
         Content at home. Thinking in class. Evidence on the wall.
         ========================================================================= */
      .stage-chip {
        display: inline-flex; align-items: center; gap: 8px; margin-bottom: 8px;
        font: 900 10px "JetBrains Mono", monospace; letter-spacing: .06em;
        color: var(--daf-deep);
      }
      .stage-chip span:first-child {
        background: var(--daf-grad); color: #fff; padding: 2px 8px; border-radius: 999px;
      }
      .stage-chip em { font-style: normal; font-weight: 800; color: var(--c); }
      .stage-chip span:last-child { color: var(--daf-ink-2); }

      .prep-sent { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .prep-stamp {
        display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px;
        border: 2px solid var(--daf-gold); border-radius: 999px; color: var(--daf-deep);
        font-weight: 900; font-size: 12px; background: #fffdf3; transform: rotate(-1deg);
      }
      .prep-sent > span:last-child { font-size: 11.5px; color: var(--daf-ink-2); }
      .prep-label {
        font: 900 10.5px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase;
        color: var(--c); margin-bottom: 8px;
      }
      .prep-objs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 9px; }
      .prep-obj {
        background: #0B1F24; border: 1.5px solid var(--daf-gold); border-radius: 12px;
        padding: 12px; display: flex; align-items: center; justify-content: center;
      }
      .prep-obj .math-inline, .prep-obj .math-block { color: #EAF4F2; }
      .prep-q {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; margin: 0 6px 6px 0;
        background: var(--daf-mint); border: 1px solid var(--daf-line); border-radius: 999px;
        font-size: 12px; font-weight: 700; color: var(--daf-deep);
      }
      .prep-q i { color: var(--daf-gold); }
      .prep-foot {
        text-align: center; font-size: 11px; color: var(--daf-ink-2);
        border-top: 1px dashed var(--daf-line); padding-top: 9px;
      }

      .gap-rows { display: flex; flex-direction: column; gap: 7px; }
      .gap-row {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 9px 12px; border: 1.5px solid var(--daf-line); border-radius: 12px;
        background: #fff;
      }
      .gap-row.set { border-color: var(--c); background: var(--daf-mint); }
      .gap-claim { font-size: 13px; font-weight: 700; color: var(--daf-ink); }
      .gap-vote { display: flex; gap: 6px; flex-shrink: 0; }
      .gap-no.on { background: #fff4dd; border-color: var(--warn); color: #8a6410; }
      .gap-verdict {
        display: flex; gap: 8px; align-items: flex-start; padding: 11px 13px; border-radius: 12px;
        font-size: 12.5px; font-weight: 700; line-height: 1.5;
      }
      .gap-verdict.gaps { background: #fff8ec; border: 1.5px solid var(--warn); color: #7a5a10; }
      .gap-verdict.gaps i { color: var(--warn); margin-top: 2px; }
      .gap-verdict.clear { background: #eff8ef; border: 1.5px solid var(--ok); color: #1e5b2a; }
      .gap-verdict.clear i { color: var(--ok); margin-top: 2px; }

      .sprint-mode {
        display: inline-block; font: 900 10.5px "JetBrains Mono", monospace; letter-spacing: .05em;
        padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,.6);
        border: 1.5px solid currentColor;
      }
      .sprint-model {
        width: 168px; flex-shrink: 0; border: 1.5px dashed var(--daf-line); border-radius: 12px;
        padding: 10px; background: #fbfdfd; display: flex; flex-direction: column; gap: 7px;
        align-items: center; justify-content: center; text-align: center;
      }
      .sprint-model.open { border-style: solid; border-color: var(--c); background: var(--daf-mint); }
      .sprint-model-tag { font: 900 9.5px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--c); text-transform: uppercase; }
      .sprint-model-math { display: flex; justify-content: center; }
      .sprint-model-empty { font-size: 11px; color: var(--daf-ink-2); font-style: italic; }
      .sprint-fb { border-top: 1px dashed var(--daf-line); padding-top: 11px; }

      .critic-brief {
        background: var(--daf-mint); border: 1.5px solid var(--daf-line); border-radius: 13px;
        padding: 12px 14px; font-size: 13px; line-height: 1.55; color: var(--daf-ink);
      }
      .critic-brief-tag {
        display: inline-flex; align-items: center; gap: 7px; font-weight: 900; font-size: 11px;
        color: var(--c); letter-spacing: .05em; margin-bottom: 6px;
      }
      .critic-mission b { color: var(--daf-deep); }
      .critic-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
      .critic-who {
        display: inline-flex; align-items: center; gap: 7px; font-weight: 900; font-size: 12.5px; color: var(--daf-gold);
      }
      .critic-rule {
        font: 900 9.5px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase;
        color: var(--stop); background: #fdecea; border: 1px solid #f3c1bd; padding: 3px 9px; border-radius: 999px;
      }
      .critic-tag {
        display: inline-block; margin: 9px 0 6px; font: 900 10.5px "JetBrains Mono", monospace;
        letter-spacing: .08em; padding: 3px 10px; border-radius: 999px;
        background: var(--c); color: #fff;
      }
      .critic-q { font-size: 13.5px; font-weight: 700; line-height: 1.5; margin-bottom: 9px; }
      .critic-opt { font-size: 12.5px; font-weight: 700; line-height: 1.45; padding: 10px 13px; }
      .critic-ok, .critic-no {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 9px;
        padding: 10px 13px; border-radius: 11px; font-size: 12.5px; font-weight: 700; line-height: 1.5;
      }
      .critic-ok { background: #eff8ef; border: 1.5px solid var(--ok); color: #1e5b2a; }
      .critic-ok i { color: var(--ok); }
      .critic-no { background: #fff8ec; border: 1.5px solid var(--warn); color: #7a5a10; }
      .critic-no i { color: var(--warn); }
      .critic-done { text-align: center; }
      .critic-stamp {
        display: inline-flex; align-items: center; gap: 9px; padding: 8px 20px; margin-bottom: 8px;
        border: 2.5px solid var(--daf-gold); border-radius: 10px; transform: rotate(-2deg);
        font-weight: 900; font-size: 15px; color: var(--daf-deep); background: #fffdf3;
      }
      .critic-rule-note { font-size: 11.5px; color: var(--daf-ink-2); margin-bottom: 11px; line-height: 1.5; }

      /* the STEM production card — the artifact the students build (stage 5) */
      .critic-production {
        border: 1.5px dashed var(--daf-gold); border-radius: 12px; padding: 11px 13px;
        background: var(--daf-mint); display: flex; flex-direction: column; gap: 7px;
      }
      .critic-production-tag { font-size: 10px; font-weight: 900; letter-spacing: .08em; color: var(--daf-deep); }
      .critic-production-option {
        display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
        border: 1px solid rgba(16,24,40,.14); border-radius: 10px; background: #fff;
        cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease;
      }
      .critic-production-option:hover { border-color: rgba(201,162,39,.55); }
      .critic-production-option.chosen {
        border: 1.5px solid var(--daf-gold); box-shadow: 0 1px 6px rgba(201,162,39,.2);
        background: #fffdf4;
      }
      .critic-production-opt-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .critic-production-kind {
        flex: none; font-family: "JetBrains Mono", monospace; font-size: 10.5px; font-weight: 800;
        color: var(--daf-gold); text-transform: uppercase; letter-spacing: .06em;
        background: rgba(201,162,39,.12); border: 1px solid rgba(201,162,39,.4);
        border-radius: 6px; padding: 2px 8px;
      }
      .critic-production-ai {
        display: inline-flex; align-items: center; gap: 5px;
        font-family: "JetBrains Mono", monospace; font-size: 9.5px; font-weight: 800;
        letter-spacing: .05em; text-transform: uppercase; color: #6042a6;
        background: rgba(96,66,166,.08); border: 1px solid rgba(96,66,166,.28);
        border-radius: 20px; padding: 3px 8px;
      }
      .critic-production-pick {
        margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 9.5px;
        font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8a94a6;
      }
      .critic-production-option.chosen .critic-production-pick { color: var(--daf-gold); }
      .critic-production-task { font-size: 12.5px; font-weight: 700; color: var(--daf-ink); line-height: 1.5; }
      .critic-production-stem { font-size: 11px; color: var(--daf-ink-2); line-height: 1.5; }
      .critic-production-ai-rule {
        font-size: 10.5px; font-weight: 700; color: #6042a6;
        display: flex; align-items: center; gap: 6px;
      }
      .critic-chosen-note {
        display: flex; align-items: center; gap: 7px; margin-top: 2px;
        font-size: 11.5px; font-weight: 700; color: var(--daf-ink-2);
      }

      .gate-lanes { border-top: 2px solid var(--daf-line); margin-top: 12px; padding-top: 11px; }
      .gate-lanes-head {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 900; font-size: 13px; color: var(--daf-deep);
      }
      .gate-lanes-head i { color: var(--stop); }
      .gate-lanes-head span { font-weight: 600; font-size: 11px; color: var(--daf-ink-2); }
      .gate-lane-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
      @media (max-width: 820px) { .gate-lane-grid { grid-template-columns: 1fr; } }
      .gate-lane {
        border-radius: 13px; padding: 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start;
      }
      .gate-lane.fwd { background: #eff8ef; border: 1.5px solid var(--ok); }
      .gate-lane.fwd b { color: #1e5b2a; display: flex; align-items: center; gap: 7px; font-size: 13px; }
      .gate-lane.ret { background: #fff8ec; border: 1.5px solid var(--warn); }
      .gate-lane.ret b { color: #7a5a10; display: flex; align-items: center; gap: 7px; font-size: 13px; }
      .gate-lane span { font-size: 11px; color: var(--daf-ink-2); }
      .gate-lane-btn { margin-top: 6px; }
      .gate-recipe {
        display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
        font-size: 11.5px; color: var(--daf-ink-2);
      }
      .gate-recipe i { color: var(--daf-gold); }
      .gate-recipe em {
        font-style: normal; background: var(--daf-gold); color: #0B1F24; font-weight: 700;
        padding: 2px 8px; border-radius: 6px; margin: 0 2px; font-size: 10.5px;
      }

      .wall-panel { border-top: 3px solid var(--daf-gold); }
      .wall-head { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--daf-deep); }
      .wall-head span:last-child { font: 700 10px "JetBrains Mono", monospace; color: var(--daf-ink-2); letter-spacing: .06em; }
      .wall-artifact { background: #0B1F24; border: 2px solid var(--daf-gold); border-radius: 13px; padding: 13px 15px; }
      .wall-art-label { font: 900 9.5px "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--daf-gold); margin-bottom: 6px; }
      .wall-art-name { color: #EAF4F2; font-size: 15px; font-weight: 800; line-height: 1.4; }
      .wall-art-sub { color: #a9c9c4; font-size: 11px; margin-top: 6px; line-height: 1.5; }
      .wall-grid { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
      .wall-slot {
        width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
        border: 1.5px dashed var(--daf-line); color: var(--daf-line); font-size: 13px;
      }
      .wall-slot.on {
        border-style: solid; border-color: var(--daf-gold); background: #fffdf3; color: var(--daf-gold);
        animation: wallPop .5s var(--bounce);
      }
      @keyframes wallPop { 0% { transform: scale(.4); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

    </style>
  </head>
  <body>
    <div id="root"></div>
