          <div className="critic-q">{ch.question}</div>
          <div className="chip-row" style={{ flexDirection: "column", alignItems: "stretch" }}>
            {ch.options.map((o, i) => (
              <div key={i} className={"glass-card critic-opt" + (pick === i ? " chosen" : "")}
                onClick={() => { if (pick === null) { setPick(i); if (i !== ch.right) setMisses((m) => m + 1); } }}
                style={{
                  borderColor: pick !== null && pick === i
                    ? (i === ch.right ? "var(--ok)" : "var(--warn)") : undefined,
                  borderWidth: pick !== null && pick === i ? "2px" : "1px"
                }}>
                {optText(o)}
              </div>
            ))}
          </div>
          {pick !== null && (chRight ? (
            <div className="critic-ok gsap-auto">
              <Icon name="fa-shield-halved" /> {ch.explain}
              <button className="btn btn-primary" style={{ marginTop: 9, marginLeft: 10 }}
                onClick={() => {
                  if (stage + 1 < C.challenges.length) { setStage(stage + 1); setPick(null); setMisses(0); setChDone(chDone + 1); }
                  else { setStage("done"); setPick(null); setChDone(C.challenges.length); }
                }}>
                {stage + 1 < C.challenges.length ? "Next challenge" : "Accept the production"} <Icon name="fa-arrow-right" />
              </button>
            </div>
          ) : (
            <div className="critic-no gsap-auto">
              <Icon name="fa-magnifying-glass" /> The critic does not correct. It makes the class check the evidence — defend it again.
              <button className="btn btn-sm btn-ghost" style={{ marginLeft: 10 }} onClick={reset}><Icon name="fa-rotate-left" /> Defend again</button>
            </div>
          ))}
        </div>
      )}

      {accepted && (
        <div className="critic-done gsap-auto">
          <div className="critic-stamp"><Icon name="fa-stamp" /> Production accepted</div>
          {prodPick !== null && C.production.options[prodPick] && (
            <div className="critic-chosen-note"><Icon name="fa-feather" /> Chosen build: {C.production.options[prodPick].kind}
              {C.production.options[prodPick].ai === true ? " (AI in the loop — the student wrote every line)" : ""}</div>
          )}
          <div className="critic-rule-note">
            The critic examined, challenged and critiqued. It never generated the work — the production is the students'.
          </div>
          <AwardRow label="Defended the production" sub="tap the students who led the defence"
            amount={XP.production} count={given.prod} col="var(--daf-gold)"
            onPick={() => award(XP.production, null, "Defended the production through the critic", "pick", mark("prod"))} />
        </div>
      )}
    </div>
  );
}

/* ---- stage 6 · the gate lanes (inside ShowWhatYouKnow) ---------------------- */
/* The formative check now routes: one individual task decides the next path
   for each student. Two lanes — forward, or reteach — the teacher taps. The
   gate pays nothing; it is a judgement, not a reward. The reteach lane
   carries the prescription: IXL codes plus a reopen of the model. */
function GateLanes({ award }) {
  const plan = stagePlan();
  if (!plan) return null;
  /* lessons with formative checks mid-build keep those plain — only the
     stage-6 gate (the lesson's last check) carries the routing lanes */
  if (window.__DAF_FINAL_GATE_CASE != null &&
      window.__DAF_FINAL_GATE_CASE !== window.__DAF_ACTIVE_CASE) return null;
  const G = plan.gate;
  const [fwd, setFwd] = useState(null);
  const [ret, setRet] = useState(null);
  const revisit = (G.revisitOld != null) ? G.revisitOld + 2 : null;
  const reopen = () => {
    try { window.postMessage({ type: "set-slide", step: revisit }, "*"); } catch (e) {}
  };
  return (
    <div className="gate-lanes gsap-auto">
      <div className="gate-lanes-head">
        <Icon name="fa-signs-post" /> The gate decides the next path
        <span>one individual task · forward, or into reteaching</span>
      </div>
      <div className="gate-lane-grid">
        <div className="gate-lane fwd">
          <b><Icon name="fa-arrow-trend-up" /> Forward — mastered</b>
          <span>on to the next lesson</span>
          <button className="btn btn-sm btn-primary gate-lane-btn"
            onClick={() => award(0, "gate", "Who cleared the gate to the forward lane?", "pick", (n) => setFwd(n))}>
            <Icon name="fa-hand-pointer" /> {fwd != null ? fwd + " tapped" : "Tap the students"}
          </button>
        </div>
        <div className="gate-lane ret">
          <b><Icon name="fa-rotate-left" /> Reteach — revisit the model</b>
          <span>same math, second pass</span>
          <button className="btn btn-sm btn-ghost gate-lane-btn"
            onClick={() => award(0, "reteach", "Who takes the reteach lane?", "pick", (n) => setRet(n))}>
            <Icon name="fa-hand-pointer" /> {ret != null ? ret + " tapped" : "Tap the students"}
          </button>
        </div>
      </div>
      <div className="gate-recipe">
        <span>
          <Icon name="fa-book" /> Reteach: IXL{" "}
          {(G.ixl || []).map((c) => <em key={c} className="mono">{c}</em>)}
        </span>
        {revisit != null && (
          <button className="btn btn-sm btn-ghost" onClick={reopen}>
            <Icon name="fa-chalkboard" /> Reopen the model (slide {String(revisit + 1).padStart(2, "0")})
          </button>
        )}
      </div>
    </div>
  );
}

/* ---- stage 7 · the evidence wall (rendered by the app on the final screen) -- */
/* The unit closes with a tangible artifact the student is willing to put
   their name on. The teacher posts each student's version to the wall —
   evidence on the wall that learning truly happened. First post stamps the
   class folio, like the story handoff. */
function EvidenceWall({ game, award }) {
  const plan = stagePlan();
  if (!plan) return null;
  const present = Object.keys(game.s || {}).filter((n) => game.present[n]);
  const slots = Math.max(6, Math.min(24, present.length || 8));
  const [posted, setPosted] = useState(0);
  const [given, setGiven] = useState({});
  const mark = (n) => setGiven((g) => Object.assign({}, g, { wall: n }));
  const date = new Date().toISOString().slice(0, 10);
  const post = () => {
    if (posted >= slots) return;
    if (posted === 0) { try { folioStamp(game.section, LESSON.code); } catch (e) {} }
    setPosted(posted + 1);
  };
  return (
    <div className="glass-panel wall-panel" style={{ display: "flex", flexDirection: "column", gap: "11px" }}>
      <div className="wall-head">
        <Star8 style={{ width: 15, height: 15, color: "var(--daf-gold)" }} />
        <b>The evidence wall</b>
        <span>stage 7 · smart production</span>
      </div>
      <div className="wall-artifact">
        <div className="wall-art-label">The artifact this class is willing to stand behind</div>
        <div className="wall-art-name">{plan.wall.artifact}</div>
        <div className="wall-art-sub">made by {game.section} · {date} · a unit is finished when the student can show what they made from it</div>
      </div>
      <div className="wall-grid">
        {Array.from({ length: slots }, (_, i) => (
          <span key={i} className={"wall-slot" + (i < posted ? " on" : "")}>
            {i < posted ? <Icon name="fa-star" /> : <Star8 style={{ width: 11, height: 11, opacity: 0.3 }} />}
          </span>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8, justifyContent: "center", flexWrap: "wrap" }}>
        <button className="btn btn-primary" disabled={posted >= slots}
          style={{ opacity: posted >= slots ? 0.45 : 1 }} onClick={post}>
          <Icon name="fa-image" /> Post a student's version
        </button>
        {posted > 0 && (
          <button className="btn btn-ghost" onClick={() => setPosted(0)}>
            <Icon name="fa-eraser" /> Clear the wall
          </button>
        )}
      </div>
      <AwardRow label="Posted the artifact to the wall" sub="teacher issued — once for this unit's evidence"
        amount={XP.exhibition} count={given.wall} col="var(--daf-gold)"
        onPick={() => award(XP.exhibition, null, "Posted the artifact to the evidence wall", "pick", mark)} />
      <div className="prep-foot">Evidence on the wall: not what was taught, but what the class made from it.</div>
    </div>
  );
}
/* ===========================================================================
   Grade 4 · Topic 5 · LESSON 5-2 · Mental Math: Estimate Quotients
   Standard 4.NBT.B.6   I can ... estimate a quotient by choosing a compatible
   number the divisor divides exactly.
   =========================================================================== */

const M = {
  problem: om(mt("245\u00f76")),
  compatible: om(mt("240\u00f76=40")),
  exact: om(mt("245\u00f76=about 41")),
  why: om(mnor("240 is close to 245, and 6 divides it exactly")),
  other: om(mt("180\u00f76=30")),
  rule: om(mnor("use the nearest number the divisor goes into exactly")),
  swyk: om(mt("430\u00f77")),
  swykAnswer: om(mt("420\u00f77=60"))
};

/* the number line of nearby multiples of the divisor */
const makeCompat = (pick) => (ctx, W, H, frame) => {
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  const lo = 180, hi = 300;
  const x = 62, w = W - 124, y = H / 2 + 4;
  const px = function (n) { return x + ((n - lo) / (hi - lo)) * w; };
  D.marker(ctx, [[x, y], [x + w, y]], 1, "rgba(234,244,242,.7)", 2.2);

  const marks = [{ v: 180 }, { v: 240 }, { v: 300 }];
  marks.forEach(function (m) {
    const on = m.v === pick;
    ctx.save();
    ctx.strokeStyle = on ? "#C9A227" : "rgba(234,244,242,.4)";
    ctx.lineWidth = on ? 2.4 : 1.4;
    ctx.beginPath(); ctx.moveTo(px(m.v), y - (on ? 13 : 8)); ctx.lineTo(px(m.v), y + (on ? 13 : 8)); ctx.stroke();
    ctx.restore();
    D.txt(ctx, m.v.toLocaleString("en-US"), px(m.v), y + 30,
      { size: 11.5, col: on ? "#C9A227" : "rgba(234,244,242,.5)", font: "marker" });
    D.txt(ctx, "\u00f76 = " + (m.v / 6), px(m.v), y + 50,
      { size: 10.5, col: on ? "#34D399" : "rgba(234,244,242,.3)", font: "mono", weight: 600 });
  });

  ctx.save();
  ctx.beginPath(); ctx.arc(px(245), y, 6.5, 0, Math.PI * 2);
  ctx.fillStyle = "#FA7E19"; ctx.fill(); ctx.restore();
  D.txt(ctx, "245", px(245), y - 28, { size: 15, col: "#FA7E19", font: "marker" });
  D.txt(ctx, "the number we actually have", W / 2, 32,
    { size: 13, col: "rgba(234,244,242,.7)", font: "marker" });
  D.txt(ctx, "245 \u00f7 6 is about " + (pick / 6).toLocaleString("en-US"),
    W / 2, H - 16, { size: 16, col: "#C9A227", font: "marker" });
};

/* how close each candidate estimate lands */
const makeClose52 = (pick) => (ctx, W, H, frame) => {
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  const rows = [{ v: 180, note: "too low" }, { v: 240, note: "closest" }, { v: 300, note: "too high" }];
  rows.forEach(function (r, k) {
    const on = r.v === pick;
    const a = on ? 1 : 0.4;
    D.txt(ctx, r.v.toLocaleString("en-US") + " \u00f7 6", W / 2 - 48, 66 + k * 46,
      { size: 18, col: on ? "#C9A227" : "#EAF4F2", font: "marker", align: "right", alpha: a });
    D.txt(ctx, "=", W / 2 - 24, 66 + k * 46, { size: 15, col: "rgba(234,244,242,.5)", font: "marker", alpha: a });
    D.txt(ctx, String(r.v / 6), W / 2 + 44, 66 + k * 46,
      { size: 20, col: on ? "#34D399" : "#EAF4F2", font: "marker", align: "right", alpha: a });
    D.txt(ctx, r.note, W / 2 + 74, 66 + k * 46,
      { size: 11, col: on ? "#C9A227" : "rgba(234,244,242,.4)", font: "mono", weight: 600, align: "left", alpha: a });
  });
  D.txt(ctx, "the exact answer is about 41", W / 2, H - 40, { size: 14, col: "#EAF4F2", font: "marker" });
  D.txt(ctx, "a compatible number is one the divisor goes into exactly", W / 2, H - 16,
    { size: 12.5, col: "rgba(234,244,242,.65)", font: "marker" });
};

const drawStory52 = (ctx, W, H, frame) => {
  const CYCLE = 620, f = frame % CYCLE;
  const p1 = D.at(f, 0, 130), p2 = D.at(f, 130, 340), p3 = D.at(f, 350, 470);
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  D.txt(ctx, "water bottles for sports day", W / 2, 22, { size: 12.5, col: "#C9A227", font: "marker", alpha: p1 });
  for (var g = 0; g < 6; g++) {
    var a = D.at(p2, g / 6, g / 6 + 0.5);
    if (a <= 0) continue;
    var gx = 44 + g * ((W - 100) / 6);
    ctx.save();
    ctx.globalAlpha = a * 0.85;
    D.rr(ctx, gx, 58, (W - 120) / 6, 52, 7);
    ctx.fillStyle = "#2D70B3"; ctx.globalAlpha = a * 0.2; ctx.fill();
    ctx.globalAlpha = a; ctx.strokeStyle = "#2D70B3"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
    D.txt(ctx, "?", gx + (W - 120) / (2 * 6), 88, { size: 16, col: "#EAF4F2", font: "marker", alpha: a });
  }
  if (p3 > 0) {
    D.txt(ctx, "245 bottles · 6 classes", W / 2, 142, { size: 13.5, col: "#EAF4F2", font: "marker", alpha: p3 });
    D.txt(ctx, "about how many for each class?", W / 2, H - 16, { size: 15, col: "#C9A227", font: "marker", alpha: p3 });
  }
};

const drawBoard52 = (ctx, W, H, frame) => {
  const CYCLE = 760, f = frame % CYCLE;
  D.board(ctx, W, H, { t: frame, title: "Find a number that divides neatly" });
  const p1 = D.at(f, 20, 150), p2 = D.at(f, 160, 340), p3 = D.at(f, 350, 520), p4 = D.at(f, 520, 680);
  D.txt(ctx, "245 \u00f7 6", W / 2, 100, { size: 30, col: "#EAF4F2", font: "marker", alpha: p1 });

const WEEK = (typeof window !== "undefined" && window.DAF_WEEK) || null;
const WEEK_L = WEEK && WEEK.lessons ? (WEEK.lessons[LESSON.code] || null) : null;

/* ---- inline text: bold, italics, code, and stacked fractions ------------- */
function wkFracNodes(str, keyBase) {
  const out = [];
  const re = /(\d+)\s*\/\s*(\d+)/g;
  let last = 0, m, n = 0;
  while ((m = re.exec(str))) {
    if (m.index > last) out.push(str.slice(last, m.index));
    out.push(<span key={(keyBase || "f") + (n++)} className="wk-frac">
      <i>{m[1]}</i><em>/</em><b>{m[2]}</b>
    </span>);
    last = m.index + m[0].length;
  }
  if (last < str.length) out.push(str.slice(last));
  return out.length ? out : [str];
}
function WkRuns({ runs, className }) {
  const list = runs && runs.length ? runs : [{ t: "t", v: "" }];
  return (
    <span className={className || "wk-runs"}>
      {list.map((r, i) => {
        const v = String(r.v || "");
        if (r.t === "b") return <strong key={i}>{wkFracNodes(v, "b" + i)}</strong>;
        if (r.t === "i") return <em key={i}>{wkFracNodes(v, "i" + i)}</em>;
        if (r.t === "c") return <code key={i}>{v}</code>;
        return <span key={i}>{wkFracNodes(v, "t" + i)}</span>;
      })}
    </span>
  );
}
/* a math-looking line gets the mono-gold treatment, not a paragraph */
function wkIsMathLine(s) {
  return /^[\s\d.,;=<>+\u2212\u00d7\u00f7()\u00bd\/%\u00b0-]+$/.test(String(s || "").replace(/[a-z]/gi, ""))
    && /\d/.test(String(s || ""));
}

const WkTable = ({ head, rows }) => (
  <div className="wk-table-wrap scroll-y">
    <table className="wk-table">
      {head && head.length > 0 && <thead><tr>{head.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>}
      <tbody>
        {(rows || []).map((r, i) => (
          <tr key={i}>{(r || []).map((c, j) => <td key={j}>{wkFracNodes(String(c == null ? "" : c), i + "-" + j)}</td>)}</tr>
        ))}
      </tbody>
    </table>
  </div>
);

function WkBlock({ b }) {
  if (!b) return null;
  switch (b.t) {
    case "p":
      return wkIsMathLine(b.text)
        ? <div className="wk-math"><WkRuns runs={b.runs} /></div>
        : <p className="wk-p"><WkRuns runs={b.runs} /></p>;
    case "list":
      return (
        <ul className="wk-list">
          {(b.items || []).map((it, i) => <li key={i}><WkRuns runs={it.runs} /></li>)}

    case "nums":

        <ol className="wk-list">

          ))}

const MathLine = ({ text }) => <span className="wk-eq"><WkRuns runs={[{ t: "t", v: String(text || "") }]} /></span>;

const WkBlocks = ({ blocks, max }) => {

/* ==========================================================================
   THE MODEL COMPILER · a printed item becomes a live drawing
   ========================================================================== */
function wkPanel(ctx, W, H, title, t) {
  D.rr(ctx, 0, 0, W, H, 12);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  if (title) D.txt(ctx, title, W / 2, 18, { size: 12, col: "rgba(234,244,242,.62)", font: "marker", alpha: D.at(t, 0, 120) });
}
function wkNote(ctx, W, H, s, col, prog) {
  D.txt(ctx, String(s), W / 2, H - 14, { size: 13.5, col: col || "#C9A227", font: "marker", alpha: prog });
}
function wkGcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = b; b = a % b; a = t; } return a || 1; }
function wkLcm(a, b) { return (a * b) / wkGcd(a, b); }
/* split a factor into its place values: 700 → 700 · 13 → 10 + 3 · 25 → 20 + 5 */
function wkParts(n) {
  const s = String(Math.trunc(Math.abs(+n || 0)));
  const out = [];
  for (let i = 0; i < s.length; i++) { const d = +s[i]; if (d) out.push(d * Math.pow(10, s.length - 1 - i)); }
  return out.length ? out : [0];
}
function wkExpanded(n) {
  const s = String(Math.trunc(n)); const out = [];
  for (let i = 0; i < s.length; i++) { const d = +s[i]; if (d) out.push(d + "0".repeat(s.length - i - 1)); }
  return out.map((v) => Number(v).toLocaleString("en-US")).join(" + ");
}
function wkChunks(dividend, divisor) {
  const chunks = []; let rem = dividend;
  const steps = [1000, 100, 10, 1];
  for (const p of steps) {
    while (rem - divisor * p >= 0) { rem -= divisor * p; chunks.push({ q: p, label: p + " groups of " + divisor }); }
    if (chunks.length > 6) break;
  }
  if (rem > 0 && rem < divisor) chunks.push({ q: 0, label: "remainder " + rem });
  if (!chunks.length) chunks.push({ q: 0, label: "start with a chunk you know" });
  return chunks;
}

function drawWeekFig(fig) {
  return (ctx, W, H, frame) => {
    if (!fig) { wkPanel(ctx, W, H, null, frame); return; }
    const CY = 700, f = frame % CY;
    const p = D.at(f, 0, 200);
    switch (fig.kind) {

      /* two numbers, one box — the comparison made visible */
      case "compare": {
        wkPanel(ctx, W, H, "compare the values, place by place", frame);
        const a = +fig.a, b = +fig.b;
        const max = Math.max(Math.abs(a), Math.abs(b), 1);
        const bw = (W - 190) / 2, y = H / 2 - 14;
        [[a, 40, "#2D70B3"], [b, 40 + bw + 110, "#FA7E19"]].forEach(([v, x, col], i) => {
          const w = Math.max(16, (Math.abs(v) / max) * bw);
          const ap = D.at(f, 40 + i * 90, 190 + i * 90);
          ctx.save(); ctx.globalAlpha = ap * 0.75;
          D.rr(ctx, x, y, w, 34, 7); ctx.fillStyle = col; ctx.fill();
          ctx.restore();
          D.rr(ctx, x, y, w, 34, 7); ctx.strokeStyle = "rgba(234,244,242,.6)"; ctx.lineWidth = 1.6; ctx.stroke();
          D.txt(ctx, Number(v).toLocaleString("en-US"), x + w / 2, y + 52, { size: 17, col: "#EAF4F2", font: "marker", alpha: ap });
        });
        const sym = a > b ? ">" : a < b ? "<" : "=";
        D.txt(ctx, sym, W / 2, y + 16, { size: 30, col: "#C9A227", font: "marker", alpha: D.at(f, 220, 320) });
        wkNote(ctx, W, H, a === b ? "equal — the same value, two spellings"
          : (a > b ? Number(a).toLocaleString("en-US") : Number(b).toLocaleString("en-US")) + " is greater; the difference is "
            + Math.abs(a - b).toLocaleString("en-US"), "#34D399", D.at(f, 300, 420));
        return;
      }

      /* place value: the chart, then the number read apart */
      case "pv": {
        wkPanel(ctx, W, H, "the place decides the value", frame);
        const digits = String(fig.digits || "");
        D.pvChart(ctx, { x: 26, y: 34, w: W - 52, digits, slots: Math.max(6, Math.ceil(digits.length / 3) * 3), prog: p, t: frame });
        const n = +digits;
        if (!isNaN(n)) {
          const pe = D.at(f, 260, 400);
          D.txt(ctx, wkExpanded(n), W / 2, H - 34, { size: 15, col: "#34D399", font: "marker", alpha: pe });
          wkNote(ctx, W, H, "expanded form is the chart written as a sum", "#C9A227", D.at(f, 360, 480));
        }
        return;
      }

      /* rounding on the number line */
      case "round": {
        wkPanel(ctx, W, H, "which end is it closer to?", frame);
        const lo = +fig.lo, hi = +fig.hi, v = +fig.value;
        D.roundLine(ctx, { x: 46, y: H / 2 - 6, w: W - 92, lo, hi, value: v, prog: p });
        const mid = (lo + hi) / 2;
        const up = v - mid >= 0;
        const pa = D.at(f, 300, 430);
        D.marker(ctx, [[46 + (W - 92) * ((v - lo) / (hi - lo)), H / 2 + 16],
                      [46 + (W - 92) * ((( up ? hi : lo) - lo) / (hi - lo)), H / 2 + 44]], pa, "rgba(201,162,39,.8)", 2);
        wkNote(ctx, W, H, Number(v).toLocaleString("en-US") + " → " + Number(up ? hi : lo).toLocaleString("en-US")
          + "  ·  " + (v - mid >= 0 ? "at or past the halfway " + mid.toLocaleString("en-US") + ", round up"
            : "below the halfway " + mid.toLocaleString("en-US") + ", round down"), "#34D399", pa);
        return;
      }

      /* the standard algorithm, in columns */
      case "col": {
        wkPanel(ctx, W, H, fig.op === "-" ? "subtract — regroup where you must" : "add — ones first, then carry", frame);
        const a = Number(fig.a), b = Number(fig.b);
        const cw = W > 380 ? 46 : 34;
        const wid = (String(a).length + 1) * cw + 20;
        D.columnOp(ctx, { x: W / 2 - wid / 2, y: 30, w: wid, a, b, op: fig.op || "+", prog: D.at(f, 0, 420), t: frame, cw });
        const r = fig.op === "-" ? a - b : a + b;
        wkNote(ctx, W, H, (fig.op === "-" ? "difference " : "sum ") + (Math.round(r * 1000) / 1000).toLocaleString("en-US"),
          "#34D399", D.at(f, 430, 540));
        return;
      }

      /* multiplication as an area model with the partial products */
      case "mult": {
        wkPanel(ctx, W, H, "break the factor apart, multiply each piece", frame);
        const a = +fig.a, b = +fig.b;
        const cols = wkParts(b).map((v) => ({ v }));
        D.areaModel(ctx, { x: 60, y: 44, w: W - 100, h: Math.min(96, H - 110), rowV: a, cols, prog: p, showSum: true });
        wkNote(ctx, W, H, a + " \u00d7 " + b + " = " + (a * b).toLocaleString("en-US"), "#34D399", D.at(f, 380, 480));
        return;
      }

      /* division as partial quotients */
      case "div": {
        wkPanel(ctx, W, H, "take out chunks you can do in your head", frame);
        const a = +fig.a, b = +fig.b;
        const chunks = wkChunks(a, b);
        const shown = Math.max(1, Math.floor(chunks.length * Math.min(1, f / 420) + 0.0001));
        D.partialQuotients(ctx, { dividend: a, divisor: b, chunks, shown, x: W / 2 - 90, y: 34, w: Math.min(210, W - 150), lh: 26 });
        const q = Math.floor(a / b), r = a - q * b;
        wkNote(ctx, W, H, a + " \u00f7 " + b + " = " + q + (r ? " R " + r : " (no remainder)"), "#34D399", D.at(f, 420, 520));
        return;
      }

      /* fractions as bars over the same whole */
      case "frac": {
        wkPanel(ctx, W, H, "the same whole, cut differently", frame);
        const fr = (fig.fracs || []).slice(0, 3);
        const bh = Math.min(40, (H - 70) / Math.max(1, fr.length));
        fr.forEach((fr1, i) => {
          const a = D.at(f, i * 90, i * 90 + 200);
          D.fracBar(ctx, { x: 40, y: 32 + i * (bh + 14), w: W - 80, h: bh, den: fr1.d, num: fr1.n, prog: a,
            col: ["#2D70B3", "#FA7E19", "#388C46"][i % 3], label: false });
          D.txt(ctx, fr1.n + "/" + fr1.d, W - 22, 32 + i * (bh + 14) + bh / 2,
            { size: 15, col: "#EAF4F2", font: "marker", alpha: a, align: "left" });
        });
        if (fr.length === 2) {
          const eq = fr[0].n * fr[1].d === fr[1].n * fr[0].d;
          wkNote(ctx, W, H, fr[0].n + "/" + fr[0].d + (eq ? " = " : " \u2260 ") + fr[1].n + "/" + fr[1].d
            + (eq ? " — same amount, different pieces" : " — different amounts"), "#34D399", D.at(f, 300, 420));
        } else {
          wkNote(ctx, W, H, "numerator counts the pieces · denominator cuts the whole", "#C9A227", D.at(f, 300, 420));
        }
        return;
      }

      /* fractions on a number line */
      case "fracline": {
        wkPanel(ctx, W, H, "the same point on the line, two names", frame);
        const fr = (fig.fracs || []).slice(0, 4);
        let den = fr.length ? fr[0].d : 4;
        fr.forEach((x) => { den = wkLcm(den, x.d); });
        den = Math.min(den, 24);
        D.fracLine(ctx, { x: 44, y: H / 2, w: W - 88, den, whole: 1, prog: p, labelAll: true,
          marks: fr.map((x) => ({ n: Math.round(x.n * den / x.d), den, col: "#34D399" })) });
        wkNote(ctx, W, H, fr.map((x) => x.n + "/" + x.d).join("  ·  "), "#C9A227", D.at(f, 320, 440));
        return;
      }

      /* mixed numbers: the same pieces, regrouped */
      case "mixed": {
        wkPanel(ctx, W, H, "improper and mixed — the same amount", frame);
        const fr = (fig.fracs || [])[0] || { n: 3, d: 4 };
        const wholes = Math.max(1, Math.ceil(fr.n / fr.d));
        D.mixedBar(ctx, { x: 44, y: 38, w: W - 88, wholes, den: fr.d, num: fr.n, h: Math.min(52, H - 100), prog: p, col: "#388C46", label: false });
        const w = Math.floor(fr.n / fr.d), rem = fr.n - w * fr.d;
        wkNote(ctx, W, H, fr.n + "/" + fr.d + " = " + (w ? w + " " : "") + rem + "/" + fr.d, "#34D399", D.at(f, 300, 420));
        return;
      }

      /* decimals on the hundredths grid */
      case "dec": {
        wkPanel(ctx, W, H, "tenths and hundredths, shaded", frame);
        const v = +fig.value;
        const hundredths = Math.round((v % 1) * 100);
        D.decGrid(ctx, { x: W / 2 - 78, y: 26, s: Math.min(140, H - 66), tenths: hundredths % 10 !== 0 ? false : true,
          shaded: hundredths || 100, prog: p, col: "#6042A6",
          label: String(v), sub: (Math.floor(v) ? Math.floor(v) + " whole" : "") });
        wkNote(ctx, W, H, v + " = " + hundredths + "/100" + (Math.floor(v) ? " plus " + Math.floor(v) + " whole(s)" : ""),
          "#34D399", D.at(f, 300, 420));
        return;
      }

      /* a strip diagram for anything part-to-whole, money included */
      case "strip": {
        wkPanel(ctx, W, H, "one strip, the parts inside it", frame);
        const parts = (fig.parts || []).map((x, i) => ({
          v: Math.max(0.0001, +x.v || 0), label: String(x.label == null ? x.v : x.label),
          col: ["#FA7E19", "#2D70B3", "#388C46", "#6042A6", "#C74440"][i % 5]
        }));
        if (!parts.length) { wkNote(ctx, W, H, "draw the parts, then the question mark", "#C9A227", 1); return; }
        parts[parts.length - 1] = Object.assign({}, parts[parts.length - 1], { label: parts[parts.length - 1].label + "" });
        const total = parts.reduce((s, x) => s + x.v, 0);
        D.strip(ctx, { x: 40, y: H / 2 - 8, w: W - 80, h: 46, parts, prog: p, total: fig.total != null ? fig.total : Math.round(total * 100) / 100 });
        wkNote(ctx, W, H, fig.note || ("the parts add to " + (Math.round(total * 100) / 100).toLocaleString("en-US")), "#C9A227", D.at(f, 300, 420));
        return;
      }

      /* the quantities of a word problem, lined up against each other */
      case "bars": {
        wkPanel(ctx, W, H, "the quantities in the problem", frame);
        const nums = (fig.nums || []).slice(0, 5).map(Number).filter((x) => isFinite(x));
        const max = Math.max.apply(null, nums.concat([1]));
        const bh = Math.min(30, (H - 60) / Math.max(1, nums.length));
        nums.forEach((v, i) => {
          const a = D.at(f, i * 80, i * 80 + 190);
          const w = Math.max(10, (v / max) * (W - 190));
          D.rr(ctx, 40, 30 + i * (bh + 10), w, bh, 6);
          ctx.save(); ctx.globalAlpha = a * 0.72;
          ctx.fillStyle = ["#2D70B3", "#FA7E19", "#388C46", "#6042A6", "#C74440"][i % 5]; ctx.fill();
          ctx.restore();
          D.rr(ctx, 40, 30 + i * (bh + 10), w, bh, 6);
          ctx.strokeStyle = "rgba(234,244,242,.55)"; ctx.lineWidth = 1.5; ctx.stroke();
          D.txt(ctx, v.toLocaleString("en-US"), 46 + w, 30 + i * (bh + 10) + bh / 2,
            { size: 14, col: "#EAF4F2", font: "marker", alpha: a, align: "left" });
        });
        wkNote(ctx, W, H, "compare the longest bar with the shortest, then decide the operation",
          "#C9A227", D.at(f, nums.length * 80 + 120, nums.length * 80 + 240));
        return;
      }

      /* a clock, for elapsed-time and time problems */
      case "clock": {
        wkPanel(ctx, W, H, "the hour hand and the minute hand", frame);
        D.clock(ctx, { cx: W / 2 - (fig.to ? 78 : 0), cy: H / 2 + 4, r: Math.min(64, H / 2 - 22),
          h: +fig.h || 0, m: +fig.m || 0, prog: p, label: (fig.h % 12 || 12) + ":" + String(fig.m || 0).padStart(2, "0") });
        if (fig.to) {
          D.clock(ctx, { cx: W / 2 + 86, cy: H / 2 + 4, r: Math.min(56, H / 2 - 26),
            h: +fig.to.h || 0, m: +fig.to.m || 0, prog: D.at(f, 160, 380),
            label: (fig.to.h % 12 || 12) + ":" + String(fig.to.m || 0).padStart(2, "0"),
            hourCol: "rgba(201,162,39,.55)", minCol: "#388C46" });
          D.marker(ctx, [[W / 2 - 6, H / 2 - 34], [W / 2 + 30, H / 2 - 44]], D.at(f, 260, 420), "#34D399", 2.2);
        }
        wkNote(ctx, W, H, fig.note || "count the minutes in hops, not one by one", "#C9A227", D.at(f, 340, 460));
        return;
      }

      /* angles */
      case "angle": {
        wkPanel(ctx, W, H, "the opening, not the length of the rays", frame);
        const deg = Math.max(1, Math.min(360, +fig.deg || 45));
        D.angleFig(ctx, { cx: W / 2 - 30, cy: H - 34, r: Math.min(104, H - 58), start: 0, deg,
          prog: p, col: "#2D70B3", arcCol: "#C9A227", label: deg + "\u00b0", square: deg === 90, protractor: !!fig.protractor });
        const kind = deg < 90 ? "acute" : deg === 90 ? "right" : deg < 180 ? "obtuse" : deg === 180 ? "straight" : "reflex";
        wkNote(ctx, W, H, deg + "\u00b0 \u2014 " + (/^[aeiou]/.test(kind) ? "an " : "a ") + kind + " angle"
          + (deg === 90 ? "" : " (" + Math.abs(90 - deg) + "\u00b0 from a right angle)"), "#34D399", D.at(f, 280, 400));
        return;
      }

      /* points, lines, rays, segments, parallel and perpendicular */
      case "lines": {
        wkPanel(ctx, W, H, "name the figure by its ends", frame);
        D.lineFig(ctx, { x: 46, y: H / 2 - 24, w: W - 92, h: 46, kind: fig.lineKind || "segment",
          prog: p, col: "#2D70B3", label: fig.lineKind || "segment" });
        const ends = { segment: "2 endpoints", ray: "1 endpoint, one direction", line: "no endpoints, both directions",
          parallel: "same distance apart, never meeting", perpendicular: "meet at a right angle" };
        wkNote(ctx, W, H, (fig.lineKind || "segment") + " — " + (ends[fig.lineKind] || ends.segment), "#C9A227", D.at(f, 300, 420));
        return;
      }

      /* shapes for classification and symmetry */
      case "shape": case "symmetry": {
        wkPanel(ctx, W, H, fig.kind === "symmetry" ? "does the fold land on itself?" : "count the sides, look at the angles", frame);
        const cx = W / 2, cy = H / 2, r = Math.min(64, H / 2 - 20);
        const name = String(fig.name || "shape").toLowerCase();
        let pts, right = [];
        if (/square|symmetr/.test(name) || fig.kind === "symmetry") {
          pts = [[cx - r, cy - r], [cx + r, cy - r], [cx + r, cy + r], [cx - r, cy + r]]; right = [0, 1, 2, 3];
        } else if (/rectangle/.test(name)) {
          pts = [[cx - r * 1.4, cy - r * 0.8], [cx + r * 1.4, cy - r * 0.8], [cx + r * 1.4, cy + r * 0.8], [cx - r * 1.4, cy + r * 0.8]]; right = [0, 1];
        } else if (/rhombus|parallelogram/.test(name)) {
          pts = [[cx - r * 0.4, cy - r], [cx + r * 1.2, cy - r], [cx + r * 0.4, cy + r], [cx - r * 1.2, cy + r]];
        } else if (/trapezoid/.test(name)) {
          pts = [[cx - r * 1.3, cy + r * 0.8], [cx + r * 1.3, cy + r * 0.8], [cx + r * 0.5, cy - r * 0.8], [cx - r * 0.6, cy - r * 0.8]];
        } else if (/pentagon/.test(name)) {
          pts = [0, 1, 2, 3, 4].map((i) => [cx + Math.sin(i * 1.2566) * r, cy - Math.cos(i * 1.2566) * r]);
        } else if (/hexagon/.test(name)) {
          pts = [0, 1, 2, 3, 4, 5].map((i) => [cx + Math.sin(i * 1.0472) * r, cy - Math.cos(i * 1.0472) * r]);
        } else if (/isosceles/.test(name)) {
          pts = [[cx - r, cy + r * 0.8], [cx + r, cy + r * 0.8], [cx, cy - r]];
        } else if (/equilateral/.test(name)) {
          pts = [[cx - r, cy + r * 0.7], [cx + r, cy + r * 0.7], [cx, cy - r]];
        } else if (/right/.test(name)) {
          pts = [[cx - r, cy - r], [cx - r, cy + r], [cx + r, cy + r]]; right = [1];
        } else {
          pts = [[cx - r * 1.1, cy + r * 0.9], [cx + r * 1.1, cy + r * 0.9], [cx + r * 0.2, cy - r]];
        }
        D.polyFig(ctx, { pts, prog: p, col: "#6042A6", rightAngles: right, fill: true,
          mirror: fig.kind === "symmetry" ? "vertical" : undefined });
        wkNote(ctx, W, H, fig.kind === "symmetry" ? "a line of symmetry folds the shape onto itself"
          : (name + " — " + pts.length + " sides"), "#34D399", D.at(f, 300, 430));
        return;
      }

      /* perimeter and area of a rectangle */
      case "rect": {
        wkPanel(ctx, W, H, fig.mode === "perimeter" ? "the fence goes round" : "the grass covers", frame);
        const L = +fig.long || 4, S = +fig.short || 2;
        const maxSide = Math.max(L, S, 1);
        const bw = Math.min(W - 120, 300), scale = bw / maxSide;
        D.rectFig(ctx, { x: W / 2 - (L * scale) / 2, y: 30, w: L * scale, h: Math.min(H - 96, S * scale),
          long: L, short: S, prog: p, mode: fig.mode === "perimeter" ? "perimeter" : "area",
          longLabel: String(L), shortLabel: String(S) });
        wkNote(ctx, W, H, "area = " + L + " \u00d7 " + S + " = " + (L * S).toLocaleString("en-US")
          + "  ·  perimeter = 2 \u00d7 (" + L + " + " + S + ") = " + (2 * (L + S)).toLocaleString("en-US"),
          "#34D399", D.at(f, 320, 440));
        return;
      }

      /* volume with unit cubes */
      case "cube": {
        wkPanel(ctx, W, H, "how many cubes fill it?", frame);
        const L = Math.max(1, Math.round(+fig.L || 3)), Wd = Math.max(1, Math.round(+fig.W || 2)), Hh = Math.max(1, Math.round(+fig.H || 2));
        D.cubePrism(ctx, { x: W / 2 - (L + Wd) * 9, y: H - 26, s: Math.min(20, (H - 60) / (L + Hh + 2)),
          L, W: Wd, H: Hh, prog: p, col: "#2D70B3", lLabel: String(L), wLabel: String(Wd), hLabel: String(Hh) });
        wkNote(ctx, W, H, L + " \u00d7 " + Wd + " \u00d7 " + Hh + " = " + (L * Wd * Hh) + " unit cubes", "#34D399", D.at(f, 320, 440));
        return;
      }

      /* factors and multiples */
      case "factor": {
        wkPanel(ctx, W, H, fig.mode === "multiples" ? "multiples keep adding the same number" : "every rectangle of that many squares", frame);
        const n = Math.max(1, Math.round(+fig.n || 12));
        if (fig.mode === "multiples") {
          const nums = [];
          for (let k = 1; k * n <= 100 && nums.length < 24; k++) nums.push(k * n);
          D.numberGrid(ctx, { n: 100, cols: 10, x: W / 2 - Math.min(W - 60, 320) / 2, y: 30, w: Math.min(W - 60, 320),
            ch: Math.min(20, (H - 60) / 10), sets: [{ nums, col: "#388C46" }] });
          wkNote(ctx, W, H, nums.slice(0, 8).join(", ") + (nums.length > 8 ? " …" : ""), "#C9A227", D.at(f, 340, 460));
        } else {
          const pairs = [];
          for (let a = 1; a * a <= n; a++) if (n % a === 0) pairs.push([a, n / a]);
          D.factorRects(ctx, { n, pairs, active: pairs.length - 1, x: 30, y: 28, w: W - 60, h: H - 78,
            cell: Math.max(5, Math.min(11, Math.floor((W - 80) / (pairs.length * (n + 1))))) });
          wkNote(ctx, W, H, "factors of " + n + ": " + pairs.reduce((acc, pr) => acc.concat([pr[0], pr[1]]), []).filter((v, i, a) => a.indexOf(v) === i).sort((a, b) => a - b).join(", "),
            "#34D399", D.at(f, 340, 460));
        }
        return;
      }

      /* patterns and rules */
      case "seq": {
        wkPanel(ctx, W, H, "the rule decides every next term", frame);
        let nums = (fig.nums || []).map(Number).filter((x) => isFinite(x));
        if (nums.length < 3 && fig.rule) {
          nums = [];
          let v = +fig.rule.start;
          for (let i = 0; i < 8; i++) { nums.push(v); v += (fig.rule.op === "-" ? -1 : 1) * (+fig.rule.step || 1); }
        }
        if (nums.length < 2) { wkNote(ctx, W, H, "name the rule first, then extend", "#C9A227", 1); return; }
        const lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
        const xs = W - 90, ys = H - 74;
        const map = D.axes(ctx, { x: 44, y: 26, w: xs, h: ys, xmax: Math.max(6, nums.length + 1),
          ymax: Math.max(1, hi), prog: p, xLabel: "term", yLabel: "value", xStep: 1 });
        D.plotPoints(ctx, map, nums.map((v, i) => [i + 1, v]), D.at(f, 100, 420), "#2D70B3", nums.map(String));
        const d = nums.length > 1 ? nums[1] - nums[0] : 0;
        wkNote(ctx, W, H, "next terms: " + [1, 2, 3].map((k) => nums[nums.length - 1] + d * k).join(", ")
          + (d ? "  ·  the rule is " + (d > 0 ? "add " + d : "subtract " + -d) : ""), "#34D399", D.at(f, 420, 540));
        return;
      }

      /* a line plot made from the printed data */
      case "lineplot": {
        wkPanel(ctx, W, H, "the class data, in fractions of a unit", frame);
        const den = Math.max(1, +fig.den || 8);
        const counts = {};
        let maxIdx = den;
        (fig.counts || []).forEach((c) => {
          const idx = Math.round((+c.at) || 0);
          counts[idx] = (counts[idx] || 0) + (+c.count || 1);
          maxIdx = Math.max(maxIdx, idx);
        });
        D.linePlot(ctx, { x: 50, y: H - 62, w: W - 100, den, max: Math.max(den, maxIdx), counts,
          prog: p, col: "#2D70B3", showCounts: true, axisLabel: fig.axisLabel || "measured to the nearest " + (den > 1 ? "1/" + den : "whole") });
        return;
      }

      /* an input–output table plotted */
      case "plotpoints": {
        wkPanel(ctx, W, H, "the table, then the rule", frame);
        const rows = (fig.rows || []).filter((r) => r && r.length >= 2 && r[0] != null && r[1] != null);
        if (!rows.length) { wkNote(ctx, W, H, "read the table down the columns", "#C9A227", 1); return; }
        const xmax = Math.max.apply(null, rows.map((r) => r[0]).concat([4]));
        const ymax = Math.max.apply(null, rows.map((r) => r[1]).concat([4]));
        const map = D.axes(ctx, { x: 46, y: 24, w: W - 96, h: H - 74, xmax, ymax, prog: p, xStep: 1 });
        D.plotPoints(ctx, map, rows.map((r) => [r[0], r[1]]), D.at(f, 60, 380), "#388C46");
        const d = rows.length > 1 ? rows[1][1] - rows[0][1] : 0;
        wkNote(ctx, W, H, (fig.head ? fig.head.join("  \u2192  ") : "in \u2192 out") + (d ? "  ·  step " + d : ""),
          "#C9A227", D.at(f, 400, 500));
        return;
      }

      /* a plain data table, drawn — the fallback that always has something true to show */
      case "table": {
        wkPanel(ctx, W, H, "read the data across, then down", frame);
        D.table(ctx, { x: 34, y: 26, w: W - 68, rh: 24, head: fig.head || [], rows: fig.rows || [], prog: p });
        return;
      }

      /* measurement equivalence: the same length in two units */
      case "unit": {
        wkPanel(ctx, W, H, "the same length, two units", frame);
        D.unitBar(ctx, { x: 46, y: H / 2 - 34, w: W - 92, h: 30, n: +fig.n || 1, big: fig.big || "foot",
          small: fig.small || "inch", copies: +fig.copies || 1, prog: p, bigCol: "#2D70B3", smallCol: "#FA7E19" });
        wkNote(ctx, W, H, (fig.n || 1) + " " + (fig.big || "foot") + " = " + ((fig.n || 1) * (fig.copies || 12)) + " " + (fig.small || "inch"),
          "#34D399", D.at(f, 320, 440));
        return;
      }

      default: {
        wkPanel(ctx, W, H, null, frame);
        wkNote(ctx, W, H, "model it on the board", "#C9A227", 1);
      }
    }
  };
}

/* the drawing for a figure is cached by its content so <Sketch> is not
   restarted on every render of the same item */
const WK_FIG_CACHE = {};
function wkFigDraw(fig) {
  const key = JSON.stringify(fig);
  if (!WK_FIG_CACHE[key]) WK_FIG_CACHE[key] = drawWeekFig(fig);
  return WK_FIG_CACHE[key];
}
function WeekFig({ fig, height, caption }) {
  if (!fig) return null;
  return (
    <div className="wk-fig">
      <Sketch draw={wkFigDraw(fig)} height={height || 176} />
      {caption && <div className="wk-fig-cap">{caption}</div>}
    </div>
  );
}

/* ==========================================================================
   THE SLIDES
   ========================================================================== */
function WkTag({ children, tone }) {
  if (!children) return null;
  return <span className={"wk-tag" + (tone ? " wk-tag-" + tone : "")}>{children}</span>;
}
function WkSectionHead({ label, title, sub }) {
  return (
    <div className="wk-sec">
      {label && <div className="wk-sec-label"><Icon name="fa-book-open" /> {label}</div>}
      <h3>{title}</h3>
      {sub && <p className="wk-sec-sub"><WkRuns runs={[{ t: "t", v: sub }]} /></p>}
    </div>
  );
}

/* ---- one printed item, with the model and the answer key ----------------- */
function WkItem({ it, open, onToggle, mode, idx }) {
  const [shown, setShown] = useState(false);
  const [self, setSelf] = useState(null);
  const reveal = () => { setShown(true); if (onToggle) onToggle(); };
  const opts = it.options && it.options.length ? it.options : null;
  /* the answer the printed numbers gave us, matched back to a choice — the
     text of every option is on the page too, so this is a match, not a guess */
  const key = (v) => String(v == null ? "" : v).replace(/,/g, "").replace(/[^0-9.<>=/\-]/g, "");
  const rightOf = opts && it.answer
    ? (opts.find((o) => key(o.text).length > 0 && key(it.answer).indexOf(key(o.text)) >= 0) || null)
    : null;
  const answered = !!it.answer;
  return (
    <div className={"wk-item" + (shown || open ? " open" : "")}>
      <div className="wk-item-top">

/* ---- a lane of printed items, paged so nothing is hidden ----------------- */
function WkItemList({ items, per, label, award, onAllDone }) {
  const list = items || [];
  const size = per || 4;
  const pages = Math.max(1, Math.ceil(list.length / size));
  const [pg, setPg] = useState(0);
  const [checked, setChecked] = useState(0);
  if (!list.length) return null;
  const slice = list.slice(pg * size, pg * size + size);
  return (
    <div className="wk-lane">
      <div className="wk-lane-head">
        <b>{label}</b>
        <span className="mono">{list.length} {list.length === 1 ? "item" : "items"} · as printed</span>

          <span className="wk-pager">
            <button className="btn btn-sm btn-ghost" disabled={pg === 0} onClick={() => setPg(pg - 1)}><Icon name="fa-chevron-left" /></button>
            <span className="mono">{pg + 1} / {pages}</span>
            <button className="btn btn-sm btn-ghost" disabled={pg >= pages - 1}
              onClick={() => { if (pg >= pages - 1) { if (onAllDone) onAllDone(); } setPg(Math.min(pages - 1, pg + 1)); }}><Icon name="fa-chevron-right" /></button>
          </span>
        )}
      </div>
      {slice.map((it, i) => (
        <WkItem key={(it.n || i) + "-" + pg} it={it} idx={pg * size + i}
          onToggle={(v) => { if (v === "ok") { setChecked((c) => c + 1); if (award) award(XP.sprint, "correct", "Week practice — checked honestly", "self"); } }} />
      ))}
    </div>
  );
}

/* the week route — this lesson inside the week's plan, drawn as a path */
function drawWeekRoute(W1, L) {
  const codes = Object.keys(W1.lessons || {});
  return (ctx, W, H, frame) => {
    wkPanel(ctx, W, H, null, frame);
    const f = frame % 900;
    const y = H / 2 + 6, n = Math.max(1, codes.length);
    const x0 = 34, x1 = W - 34;
    D.marker(ctx, [[x0, y], [x1, y]], D.at(f, 0, 200), "rgba(234,244,242,.55)", 2);
    codes.forEach((code, i) => {
      const cx = n === 1 ? (x0 + x1) / 2 : x0 + (x1 - x0) * (i / (n - 1));
      const on = L && code === L.code;
      const a = D.at(f, 120 + i * 90, 260 + i * 90);
      D.star8(ctx, cx, y, on ? 15 : 10, a, on ? "#C9A227" : "rgba(234,244,242,.6)", 1.8);
      D.txt(ctx, "Lesson " + code, cx, y - 26, { size: 12.5, col: on ? "#C9A227" : "rgba(234,244,242,.72)", font: "marker", alpha: a });
      const title = ((W1.lessons[code] || {}).title || "").split(" ")[0];
      D.txt(ctx, title, cx, y + 30, { size: 10.5, col: "rgba(234,244,242,.55)", font: "mono", weight: 600, alpha: a });
    });
    const b = D.at(f, 520, 700);
    D.txt(ctx, (W1.kind === "lesson" ? "semester " + W1.semester + " · week " + String(W1.week).padStart(2, "0") : W1.kind) +
      " · " + (W1.focus || ""), W / 2, 18, { size: 11.5, col: "rgba(234,244,242,.6)", font: "marker", alpha: b });
  };
}

/* how much printed material a section actually carries — an empty or
   one-line section never earns a whole slide of its own */
function wkSize(sec) {
  if (!sec) return 0;
  let n = 0;
  (sec.blocks || []).forEach((b) => {
    n += String(b.text || b.label || "").length;
    if (b.items) b.items.forEach((x) => { n += String(x.text || "").length; });
    if (b.rows) n += 60 * b.rows.length;
    if (b.lines) n += 24 * b.lines.length;
  });
  ["items", "understand", "knowHow"].forEach((k) => (sec[k] || []).forEach((it) => { n += 40 + String(it.text || "").length; }));
  return n;
}
function firstFig(sec) {
  if (!sec) return null;
  if (sec.fig) return sec.fig;      /* the section's own model, from the page */
  const b = (sec.blocks || []).find((x) => x && x.fig);
  if (b) return b.fig;
  const it = (sec.items || []).concat(sec.knowHow || [], sec.understand || []).find((x) => x.fig);
  return it ? it.fig : null;
}

/* ---- dispatch ------------------------------------------------------------ */
function WeekScreens({ k }) {
  if (!WEEK || !WEEK_L) return null;
  switch (k) {
    case "open": return <WeekOpen />;
    case "bridge": return <WeekBridge />;
    case "example": return WEEK_L.sections && WEEK_L.sections.anotherExample ? <WeekExample /> : null;
    case "practice": return <WeekPractice />;
    case "problem": return WEEK_L.sections && (WEEK_L.sections.problemSolving || WEEK_L.sections.stem) ? <WeekProblem /> : null;
    case "assess": return WEEK_L.sections && WEEK_L.sections.assessment ? <WeekAssess /> : null;
    case "close": return <WeekClose />;
    default: return null;
  }
}

/* ==========================================================================
   THE ARC · where the week's screens sit inside the seven stages
     open      → the very start of Knowledge Building (stage 3)
     bridge/example → the end of Knowledge Building, before the sprint
     practice  → stage 4, right after the engine's own sprint
     problem   → stage 5, right after the critic
     assess    → stage 6, after the lesson's gate check
     close     → stage 7, last
   ========================================================================== */
function weekScreenPlan() {
  if (!WEEK || !WEEK_L) return [];
  const secs = WEEK_L.sections || {};
  const out = [];
  const push = (anchor, key, phase, stage, title, lead, goal, pull, rail) =>
    out.push({ anchor, key, phase, stage, meta: { phase, title, lead, goal, pull, rail } });

  push("build-start", "open", "warmup", 3,
    "The week opens on <em>the printed page</em>",
    "Semester " + WEEK.semester + " · Week " + String(WEEK.week).padStart(2, "0") + " — " + (WEEK.focus || WEEK.title || "") +
    (WEEK_L.iCan ? ". I can " + WEEK_L.iCan : "."),
    "Arrive knowing what this lesson is for: the book's own words, not a summary of them.",
    "Every number on this slide came off the week file, unedited.",
    railFor("Read the I-can statement from the page, then the Essential Question. Niyyah first — the boys name why they are here.",
      ["They can say the goal in their own words", "They can point at the number the page used", "Nobody has answered for them yet"],
      "Which sentence on this page will you still be able to prove by Friday?",
      "Paraphrasing the objective until it stops meaning anything."));

  if (wkSize(secs.bridge) + wkSize(secs.solveShare) >= 60) {
    push("build-end", "bridge", "monitor", 3,
      "The <em>Visual Learning Bridge</em>, modelled live",
      "A richer example than the homework clip — think aloud over the page's own bridge, then answer Convince Me!",
      "Close the flagged gaps on the model the book actually printed.",
      "The clip at home and the live model are not the same thing.",
      railFor("Project the bridge, cover the answer, and solve it in front of them while saying what you are noticing.",
        ["They follow the model, not the memo", "They name the step before writing it", "The Convince Me! prompt is argued, not answered"],
        "Where would this model break, and what would you do then?",
        "Reading the worked example as the answer instead of as the method."));
  }
  if (wkSize(secs.anotherExample) >= 60) {
    push("build-end", "example", "connect", 3,

function Ambient() {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current;
    if (!c || !c.getContext) return;
    const x = c.getContext("2d");
    if (!x) return;
    let w, h, id;
    const ps = Array.from({ length: 46 }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * 1.9 + 0.6,
      vx: (Math.random() - 0.5) * 0.00016, vy: (Math.random() - 0.5) * 0.00016,
      g: Math.random() > 0.55
    }));
    function size() {
      if (!c) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = c.width = window.innerWidth * dpr;
      h = c.height = window.innerHeight * dpr;
    }
    function draw() {
      if (!x || !w || !h) return;
      try {
        x.clearRect(0, 0, w, h);
        for (const p of ps) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
          if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
          x.beginPath();
          x.arc(p.x * w, p.y * h, p.r * Math.min(window.devicePixelRatio || 1, 2), 0, Math.PI * 2);
          x.fillStyle = p.g ? "rgba(201,162,39,.22)" : "rgba(18,133,124,.20)";
          x.fill();
        }
        id = requestAnimationFrame(draw);
      } catch (e) {}
    }
    size(); draw();
    window.addEventListener("resize", size);
    return () => { if (id) cancelAnimationFrame(id); window.removeEventListener("resize", size); };
  }, []);
  return <canvas ref={ref} className="ambient" />;
}

/* ===========================================================================
   THE SEVEN STAGES · sequence assembly
   Content at home. Thinking in class. Evidence on the wall.

   The lesson file keeps its own metas + Visual switch untouched — its
   mathematical content is stage 3 (knowledge building) from the cold open
   through the board, stage 6 (the mastery gate) at its formative check, and
   stage 7 (smart production) at its closing. The engine interleaves the four
   stage screens around that content:

     0  stage 1  Preparation         (engine — the briefing sent before class)
     1  stage 2  Intelligent Diagnose (engine — the gap map, not a grade)
     2… stage 3  Knowledge Building   (lesson screens 0 … swyk-1)
     …  stage 4  Practice            (engine — guided, then independent)
     …  stage 5  Production / B       (engine — the critic, never an author)
     …  stage 6  Mastery Gate         (the lesson's formative check + lanes)
     …  stage 7  Smart Production     (the lesson's closing + the wall)

   Review decks (bosses) carry no stage plan and keep their original
   sequence — stageSequence() degrades to the identity mapping for them.
   =========================================================================== */
function stageSequence() {
  const metas = LESSON.metas;
  const plan = (window.DAF_STAGE && window.DAF_STAGE.lessons &&
    window.DAF_STAGE.lessons[LESSON.code]) || null;
  let swykIdx = -1;
  metas.forEach((m, i) => { if (m.phase === "swyk") swykIdx = i; });
  const out = { metas: metas.slice(), stages: metas.map(() => 0),
                visuals: metas.map((m, i) => i), plan: plan, offset: 0 };
  if (!plan || !plan.screens || swykIdx < 1 || swykIdx >= metas.length - 1) return out;
  const S = plan.screens;
  /* the LAST swyk case is the stage-6 gate; earlier formative checks in the
     same lesson keep their plain check UI (GateLanes reads this) */
  window.__DAF_FINAL_GATE_CASE = swykIdx;
  out.offset = 2;
  out.metas = [S.prep, S.diagnose];
  out.stages = [1, 2];
  out.visuals = ["stage:prep", "stage:diagnose"];
  for (let i = 0; i < swykIdx; i++) { out.metas.push(metas[i]); out.stages.push(3); out.visuals.push(i); }
  out.metas.push(S.practice, S.critic, metas[swykIdx]);
  out.stages.push(4, 5, 6);
  out.visuals.push("stage:practice", "stage:critic", swykIdx);
  for (let i = swykIdx + 1; i < metas.length; i++) { out.metas.push(metas[i]); out.stages.push(7); out.visuals.push(i); }

  /* ---- the week layer ---------------------------------------------------
     A deck opened from weeks/Semester-N/Week-NN/ carries that week's printed
     content (window.DAF_WEEK). Its screens are spliced into the seven-stage
     sequence at the stage the FIKR frame puts them in — the page is not a
     handout bolted on the side, it IS stages 3-7. With no week payload
     (html/, chapters/, any other copy) nothing changes. */
  out.week = insertWeekScreens(out);
  return out;
}

/* splice week: screens into an assembled sequence by their anchor */
function insertWeekScreens(out) {
  let arc;
  try { arc = typeof weekScreenPlan === "function" ? weekScreenPlan() : []; }
  catch (e) { arc = []; }
  if (!arc || !arc.length) return null;
  const idxOf = (v) => out.visuals.indexOf(v);
  const gateIdx = Math.max(0, idxOf("stage:critic") + 1);
  const buildEnd = idxOf("stage:practice") >= 0 ? idxOf("stage:practice") : out.metas.length;
  const at = [];
  arc.forEach((s) => {
    let pos = out.metas.length;
    if (s.anchor === "build-start") pos = Math.max(2, idxOf("stage:diagnose") + 1);
    else if (s.anchor === "build-end") pos = buildEnd;
    else if (s.anchor === "practice") pos = Math.max(buildEnd, idxOf("stage:practice") + 1);
    else if (s.anchor === "produce") pos = Math.max(0, idxOf("stage:critic") + 1);
    else if (s.anchor === "gate") pos = gateIdx + 1;
    else if (s.anchor === "end") pos = out.metas.length;
    at.push({ pos, s });
  });
  /* insert from the back so earlier positions stay valid */
  /* from the back so earlier positions stay valid; at the same anchor keep the
     arc's own order (bridge before example, guided before independent) */
  at.sort((a, b) => (b.pos - a.pos) || (arc.indexOf(b.s) - arc.indexOf(a.s)));
  let added = 0;
  at.forEach(({ pos, s }) => {
    const p = Math.max(0, Math.min(out.metas.length, pos));
    out.metas.splice(p, 0, s.meta);
    out.stages.splice(p, 0, s.stage);
    out.visuals.splice(p, 0, "week:" + s.key);
    added++;
  });
  return added;
}
const SEQ = stageSequence();

/* the deck's own screens and the week's screens, dispatched from one place */
function DeckScreens({ k, award, game }) {
  if (typeof k === "string" && k.slice(0, 5) === "week:") {
    return <WeekScreens k={k.slice(5)} award={award} game={game} />;
  }
  return <StageScreens k={k.slice(6)} award={award} game={game} />;
}

function StageScreens({ k, award, game }) {
  switch (k) {
    case "prep": return <StagePrep />;
    case "diagnose": return <GapMap />;
    case "practice": return <PracticeSprint award={award} />;
    case "critic": return <CriticBoard award={award} />;
    default: return null;
  }
}

/* -- tiny synthesised sounds: no files, works offline ---------------------- */
let __ac = null;
function tone(seq) {
  try {
    __ac = __ac || new (window.AudioContext || window.webkitAudioContext)();
    if (__ac.state === "suspended") __ac.resume();
    const t = __ac.currentTime;
    seq.forEach((n) => {
      const o = __ac.createOscillator(), g = __ac.createGain();
      o.type = n[3] || "sine"; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t + n[1]);
      g.gain.exponentialRampToValueAtTime(n[4] || 0.09, t + n[1] + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + n[2]);
      o.connect(g); g.connect(__ac.destination);
      o.start(t + n[1]); o.stop(t + n[1] + n[2] + 0.05);
    });
  } catch (e) {}
}
const sndPlus  = () => tone([[880, 0, .12], [1318.5, .085, .22]]);
const sndMinus = () => tone([[311, 0, .16, "triangle"], [233, .11, .26, "triangle"]]);
const sndTick  = () => tone([[1046, 0, .05, "square", .03]]);
const sndLand  = () => tone([[659, 0, .1], [880, .09, .1], [1318.5, .18, .3]]);

/* -- deterministic cheerful avatar per name -------------------------------- */
const AV_SKINS = [
  ["#2D70B3", "#6BB1F0"], ["#388C46", "#7ED08C"], ["#6042A6", "#A98BE3"],
  ["#FA7E19", "#FFBD73"], ["#C74440", "#F2938F"], ["#12857C", "#53CDBF"],
  ["#B3488F", "#E795C9"], ["#8A6D1B", "#E3C65B"]
];
function nameHash(n) {
  let h = 5381;
  for (let i = 0; i < n.length; i++) h = ((h * 33) ^ n.charCodeAt(i)) >>> 0;
  return h;
}
function Avatar({ name }) {
  const h = nameHash(String(name));
  const skin = AV_SKINS[h % AV_SKINS.length];
  const gid = "av" + (h % 99991);
  const rx = 16 + (h >> 3) % 12;          /* body roundness */
  const hat = (h >> 5) % 3;               /* 0 antenna · 1 horns · 2 tuft   */
  const eyes = (h >> 7) % 4 === 0 ? 1 : 2; /* the occasional cyclops        */
  const smile = 40 + ((h >> 9) % 6);
  return (
    <svg viewBox="0 0 64 64" className="dj-av" aria-hidden="true">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={skin[1]} /><stop offset="1" stopColor={skin[0]} />
        </linearGradient>
      </defs>
      {hat === 0 && <g><line x1="32" y1="12" x2="32" y2="4" stroke={skin[0]} strokeWidth="3" />
        <circle cx="32" cy="4" r="3.4" fill={skin[1]} /></g>}
      {hat === 1 && <g><path d="M14 16 L10 5 L22 11 Z" fill={skin[0]} />
        <path d="M50 16 L54 5 L42 11 Z" fill={skin[0]} /></g>}
      {hat === 2 && <g><circle cx="26" cy="8" r="4" fill={skin[1]} />
        <circle cx="34" cy="6" r="4.6" fill={skin[0]} /><circle cx="41" cy="9" r="3.4" fill={skin[1]} /></g>}
      <rect x="7" y="10" width="50" height="48" rx={rx} fill={"url(#" + gid + ")"} />
      {eyes === 2 ? (
        <g><circle cx="23" cy="30" r="7" fill="#fff" /><circle cx="41" cy="30" r="7" fill="#fff" />
          <circle cx="24.5" cy="31" r="3" fill="#10242B" /><circle cx="42.5" cy="31" r="3" fill="#10242B" /></g>
      ) : (
        <g><circle cx="32" cy="29" r="9.5" fill="#fff" /><circle cx="33" cy="30.5" r="4" fill="#10242B" /></g>
      )}
      <path d={"M24 " + smile + " Q32 " + (smile + 7) + " 40 " + smile}
        fill="none" stroke="#10242B" strokeWidth="2.6" strokeLinecap="round" />
    </svg>
  );
}

function Dojo({ game, dispatch, job, onClose }) {
  const steps = (BEHAV.steps || [1, 5, 10]).slice(0, 3);
  const [armed, setArmed] = useState({ amount: steps[0] || 1, reason: "Quick +" + (steps[0] || 1), metric: null });
  const [mode, setMode] = useState("points");        /* "points" | "attendance" */
  const [bursts, setBursts] = useState({});          /* name -> {k, amt} for animations */
  const [hot, setHot] = useState(null);              /* random-picker spotlight */
  const [spinning, setSpinning] = useState(false);
  const [extra, setExtra] = useState("");
  const jobTaps = useRef([]);

  const all = Object.keys(game.s);
  const present = all.filter((n) => game.present[n]);
  const last = game.log.length ? game.log[game.log.length - 1] : null;

  const fire = (names, amount, reason, metric) => {
    /* amount 0 with a metric is a RECORDED lane (the mastery gate): it logs
       who was tapped without paying points — a judgement, not a reward. */
    if (!names.length || (amount === 0 && !metric)) return;
    dispatch({ type: "grant", names: names, amount: amount, metric: metric || null, reason: reason });
    (amount >= 0 ? sndPlus : sndMinus)();
    if (amount === 0) return;
    setBursts((b) => {
      const nb = Object.assign({}, b);
      names.forEach((n) => { nb[n] = { k: ((b[n] && b[n].k) || 0) + 1, amt: amount }; });
      return nb;
    });
  };

  /* finishing hands the tap count back to the lesson screen (SWYK rows) */
  const finish = () => {
    if (job) {
      if (job.done) job.done(jobTaps.current.length);
      jobTaps.current = [];
    }
    onClose();
  };

  const tap = (n) => {
    if (mode === "attendance") { dispatch({ type: "presence", name: n }); sndTick(); return; }
    if (!game.present[n]) return;
    if (spinning) return;
    if (hot) setHot(null);
    if (job) {
      fire([n], job.amount, job.text || "Lesson award", job.metric);
      jobTaps.current.push(n);
      if (job.single) {
        if (job.slot) dispatch({ type: "sijill", slot: job.slot, name: n });
        setTimeout(finish, 650);
      }
      return;
    }
    fire([n], armed.amount, armed.reason, armed.metric);
  };

  const everyone = () => {
    if (mode === "attendance" || !present.length) return;
    if (job) { fire(present, job.amount, job.text || "Lesson award", job.metric);
               jobTaps.current = jobTaps.current.concat(present); return; }
    fire(present, armed.amount, armed.reason, armed.metric);
  };

  const spin = () => {
    if (spinning || present.length < 2 || mode === "attendance") return;
    setSpinning(true); setHot(null);
    const order = present.slice();
    const target = order[Math.floor(Math.random() * order.length)];
    let i = 0, hops = 12 + Math.floor(Math.random() * 6), delay = 70;
    const step = () => {
      if (i < hops) { setHot(order[i % order.length]); sndTick(); i++; delay *= 1.15; setTimeout(step, delay); }
      else { setHot(target); sndLand(); setSpinning(false); }
    };
    step();
  };

  const addName = () => {
    parseNames(extra).forEach((n) => dispatch({ type: "addStudent", name: n }));
    setExtra("");
  };

  /* the dojo owns its own keys so closing always settles a pending award */
  useEffect(() => {
    const fn = (e) => {
      const tg = ((e.target && e.target.tagName) || "").toLowerCase();
      if (tg === "input" || tg === "textarea" || tg === "select") return;
      const k = (e.key || "").toLowerCase();
      if (e.key === "Escape" || k === "p" || k === "n") { e.preventDefault(); finish(); }
      if (k === "u" && game.log.length) { e.preventDefault(); dispatch({ type: "undo" }); sndTick(); }
    };
    addEventListener("keydown", fn);
    return () => removeEventListener("keydown", fn);
  }, [job, game.log.length]);

  const chip = (label, icon, amount, metric, kind, key) => (
    <button key={key} className={"dj-chip " + kind +
        (armed.reason === label && armed.amount === amount ? " on" : "")}
      onClick={() => { setArmed({ amount: amount, reason: label, metric: metric || null }); sndTick(); }}>
      <Icon name={icon} /><span>{label}</span><em>{amount > 0 ? "+" + amount : amount}</em>
    </button>
  );

  return (
    <div className="dojo">
      <div className="dj-top">
        <div className="dj-title">
          <b>{game.section}</b>
          <span>{present.length} of {all.length} here · <em className="dj-star">★ {game.classXp}</em></span>
        </div>
        {job ? (
          <div className="dj-job">
            <Icon name="fa-bullseye" />
            <span>{job.text}</span>
            <em>{job.amount === 0 ? "record only — tap students"
              : job.amount > 0 ? "+" + job.amount + " each — tap students"
              : job.amount + " each — tap students"}</em>
          </div>
        ) : (
          <div className="dj-tools">
            <button className="btn btn-ghost btn-sm" onClick={spin} disabled={spinning}>
              <Icon name="fa-dice" /> Random
            </button>
            <button className="btn btn-ghost btn-sm" onClick={everyone}>
              <Icon name="fa-users" /> Everyone {armed.amount > 0 ? "+" + armed.amount : armed.amount}
            </button>
            <button className={"btn btn-sm " + (mode === "attendance" ? "btn-gold" : "btn-ghost")}
              onClick={() => { setMode(mode === "attendance" ? "points" : "attendance"); setHot(null); }}>
              <Icon name="fa-user-check" /> Attendance
            </button>
          </div>
        )}
        <div className="dj-tools">
          <button className="btn btn-ghost btn-sm" disabled={!last} style={{ opacity: last ? 1 : .4 }}
            onClick={() => { dispatch({ type: "undo" }); sndTick(); }}>
            <Icon name="fa-rotate-left" /> Undo
          </button>
          <button className="btn btn-gold btn-sm" onClick={finish}>
            <Icon name={job ? "fa-check" : "fa-xmark"} /> {job ? "Done" : "Close"}
          </button>
        </div>
      </div>

      {!job && mode === "points" && (
        <div className="dj-reasons">
          {steps.map((v) => chip("Quick +" + v, "fa-bolt", v, null, "good", "q" + v))}
          {(BEHAV.positive || []).map((b, i) => chip(b.label, b.icon || "fa-star", b.xp, b.metric, "good", "p" + i))}
          <span className="dj-sep" />
          {(BEHAV.needsWork || []).map((b, i) => chip(b.label, b.icon || "fa-circle-minus", b.xp, null, "bad", "n" + i))}
        </div>
      )}
      {!job && mode === "attendance" && (
        <div className="dj-reasons dj-att">
          <span className="dj-att-note"><Icon name="fa-hand-pointer" /> Tap a student to flip here / absent.</span>
          <input value={extra} placeholder="Someone missing? Type a name"
            onChange={(e) => setExtra(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") addName(); }} />
          <button className="btn btn-ghost btn-sm" onClick={addName}><Icon name="fa-plus" /> Add</button>
        </div>
      )}

      <div className="dj-grid">
        {all.map((n) => {
          const st = game.s[n] || BLANK;
          const b = bursts[n];
          const away = !game.present[n];
          return (
            <button key={n} onClick={() => tap(n)}
              className={"dj-card" + (away ? " away" : "") + (hot === n ? " hot" : "")}>
              {b && <span key={"burst" + b.k} className={"dj-burst" + (b.amt < 0 ? " neg" : "")}>
                {b.amt > 0 ? "+" + b.amt : b.amt}</span>}
              <span key={"pop" + ((b && b.k) || 0)}
                className={"dj-body" + (b ? (b.amt < 0 ? " shake" : " pop") : "")}>
                <Avatar name={n} />
                <span className={"dj-bubble" + (st.xp < 0 ? " neg" : "")}>{st.xp}</span>
              </span>
              <span className="dj-name">{n}</span>
              {away && <span className="dj-away-tag">absent</span>}
            </button>
          );
        })}
      </div>

      <div className="dj-foot">
        <span className="dj-last">
          {last
            ? <span><em className={last.amount < 0 ? "neg" : "pos"}>
                {last.amount > 0 ? "+" + last.amount : last.amount}</em>{" "}
                {last.names.length === 1 ? last.names[0] : last.names.length + " students"} · {last.reason}</span>
            : <span>Arm a reason above, then tap students — every tap lands instantly.</span>}
        </span>
        <span className="dj-exports">
          <a onClick={() => exportSheet(game, "csv")}><Icon name="fa-file-csv" /> class sheet</a>
          <a onClick={() => exportSheet(game, "log")}><Icon name="fa-list-check" /> points log</a>
          <a onClick={() => folioExport(game.section)} title="Download the class folio stamps as JSON (this computer only)"><Icon name="fa-file-export" /> folio export</a>
          <a onClick={() => folioImportFile((r) => {
            if (r && r.error) { window.alert(r.error); return; }
            window.DAF_FOLIO = folioFor(game.section);
            const n = r.className === game.section ? "" : " (saved under " + r.className + ")";
            window.alert("Folio backup merged: " + r.added + " new, " + r.refreshed + " updated, " +
              r.unchanged + " already here" + (r.rejected ? ", " + r.rejected + " ignored" : "") + "." + n +
              (r.className === game.section ? "\nOpen the folio again to see the restored stamps." : ""));
          })} title="Merge a folio backup from another computer into this one (adds stamps, never removes)"><Icon name="fa-file-arrow-up" /> folio import</a>
          <a onClick={() => {
            if (window.confirm("Clear the folio stamps for " + game.section + " on this computer?")) {
              folioReset(game.section);
              window.DAF_FOLIO = folioFor(game.section);
            }
          }} title="Remove this class's folio stamps from this computer"><Icon name="fa-eraser" /> reset folio</a>
        </span>
        <span className="dj-note">
          Folio state lives only on this computer — export before switching machines and import the backup on the other one; reset clears it. It stores class lesson stamps only, never student names.
        </span>
      </div>
    </div>
  );
}

/* ---- the tracking sheet -------------------------------------------------- */
function exportSheet(game, kind) {
  const stamp = new Date().toISOString().slice(0, 10);
  const mins = Math.max(1, Math.round((Date.now() - game.t0) / 60000));
  const rows = Object.keys(game.s).map((n) => {
    const st = game.s[n];
    return {
      date: stamp, section: game.section, student: n,
      lesson: LESSON.code, title: LESSON.title, standard: (LESSON.unit.split("·").pop() || "").trim(),
      present: game.present[n] ? 1 : 0,
      xp: st.xp, points_given: st.plus || 0, points_taken: st.minus || 0,
      estimates: st.estimates, commits: st.commits,
      correct: st.correct, hard_taken: st.hard, hard_correct: st.hardOk,
      sijill: st.sijill, minutes: mins
    };
  });
  const toCsv = (list) => {
    const cols = Object.keys(list[0] || {});
    return [cols.join(",")].concat(list.map((r) =>
      cols.map((c) => ('"' + String(r[c]).replace(/"/g, '""') + '"')).join(","))).join("\n");
  };
  let blob, name;
  if (kind === "json") {
    blob = new Blob([JSON.stringify({ lesson: LESSON.code, section: game.section,
      date: stamp, minutes: mins, rows: rows, log: game.log }, null, 1)], { type: "application/json" });
    name = "daf-" + game.section + "-" + LESSON.code + "-" + stamp + ".json";
  } else if (kind === "log") {
    const list = game.log.length ? game.log.map((e) => ({
      date: stamp, section: game.section, lesson: LESSON.code,
      time: new Date(e.at).toTimeString().slice(0, 5),
      amount: e.amount, reason: e.reason, students: e.names.join(" | "), count: e.names.length
    })) : [{ date: stamp, section: game.section, lesson: LESSON.code, time: "", amount: 0,
             reason: "no points recorded", students: "", count: 0 }];
    blob = new Blob(["\ufeff" + toCsv(list)], { type: "text/csv;charset=utf-8" });
    name = "daf-" + game.section + "-" + LESSON.code + "-points-log-" + stamp + ".csv";
  } else {
    blob = new Blob(["\ufeff" + toCsv(rows)], { type: "text/csv;charset=utf-8" });
    name = "daf-" + game.section + "-" + LESSON.code + "-" + stamp + ".csv";
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function App() {
  const url = (() => { try { return new URL(location.href); } catch (e) { return null; } })();
  const init = (() => {
    const s = parseInt((url && url.searchParams.get("slide")) || "0", 10);
    return isNaN(s) ? 0 : Math.max(0, Math.min(SEQ.metas.length - 1, s));
  })();

  const [i, setI] = useState(init);
  const [replay, setReplay] = useState(0);
  const [overview, setOverview] = useState(false);
  const [rail, setRail] = useState(false);
  const [mathList, setMathList] = useState(false);
  const [activityOpen, setActivityOpen] = useState(false);

  window.__DAF_OPEN_ACTIVITY = () => setActivityOpen(true);

  const [game, dispatch] = useReducer(gameReducer, null, freshGame);
  const [dojo, setDojo] = useState(false);
  const [dojoJob, setDojoJob] = useState(null);

  /* award(amount, metric, text, mode, done)
     mode "class" — everyone present, no interruption, just the flash
     mode "pick"  — opens the dojo armed with this reason; every tap lands     */
  const award = (amount, metric, text, mode, done) => {
    if (mode === "pick") { setDojoJob({ amount: amount, metric: metric, text: text, done: done }); setDojo(true); return; }
    const names = Object.keys(game.s).filter((n) => game.present[n]);
    if (!names.length) return;
    dispatch({ type: "grant", names: names, amount: amount, metric: metric, reason: text,
               text: "+" + amount + " \u00b7 whole class \u00b7 " + text });
    setTimeout(() => dispatch({ type: "clearFlash" }), 1700);
  };

  const sijill = (slot, col) => {
    setDojoJob({ amount: XP.sijill, metric: "sijill", slot: slot, single: true,
                 text: "Whose method was this? It goes into the Sijill for the year." });
    setDojo(true);
  };
  SIJILL.fn = sijill;
  SIJILL.named = game.sijillNames || {};

  const meta = SEQ.metas[i];
  /* which lesson case the engine is currently rendering — GateLanes uses it
     to know whether this check is the stage-6 gate or a mid-build check */
  window.__DAF_ACTIVE_CASE = typeof SEQ.visuals[i] === "number" ? SEQ.visuals[i] : null;
  useEffect(() => {
    const ph = PHASES[meta.phase];
    document.documentElement.style.setProperty("--c", ph.c);
    document.documentElement.style.setProperty("--c-2", ph.c2);
  }, [i]);

  /* Durable story state (PR 02): the class's folio cache is class-level only
     (lesson stamps, no student data), lives on this computer and refreshes
     when a class is picked. Missing or cleared storage degrades silently to
     position-based folio pips. */
  useEffect(() => {
    window.DAF_CURRENT_CLASS = (game && game.section) || null;
    window.DAF_FOLIO = folioFor(window.DAF_CURRENT_CLASS);
  }, [game && game.section]);

  useEffect(() => setReplay((r) => r + 1), [i]);

  /* keyboard — plain LTR: right advances, left goes back */
  useEffect(() => {
    const go = (d) => setI((x) => Math.max(0, Math.min(SEQ.metas.length - 1, x + d)));
    const fn = (e) => {
      const k = e.key;
      if (k === "Escape") { setOverview(false); setMathList(false); setRail(false); setActivityOpen(false); return; }
      /* never hijack a form control: a student adjusting a slider with the
         arrow keys must move the slider, not the lesson. */
      var tag = ((e.target && e.target.tagName) || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select" ||
          (e.target && e.target.isContentEditable)) return;
      if (dojo) return; /* the dojo owns its own keys, including Esc, P, N */
      if (k.toLowerCase() === "p" || k.toLowerCase() === "n") { setDojo(true); return; }
      if (overview || mathList || activityOpen) return;
      if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "ArrowDown") { e.preventDefault(); go(1); }
      else if (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp") { e.preventDefault(); go(-1); }
      else if (k === "Home") setI(0);
      else if (k === "End") setI(SEQ.metas.length - 1);
      else if (k.toLowerCase() === "r") setReplay((r) => r + 1);
      else if (k.toLowerCase() === "o") setOverview(true);
      else if (k.toLowerCase() === "t") setRail((v) => !v);
      else if (k.toLowerCase() === "m") setMathList(true);
      else if (k.toLowerCase() === "a") setActivityOpen((v) => !v);
    };
    addEventListener("keydown", fn);
    return () => removeEventListener("keydown", fn);
  }, [overview, mathList, dojo, activityOpen]);

  useEffect(() => {
    const mh = (e) => {
      if (e && e.data && e.data.type === "set-slide" && typeof e.data.step === "number") {
        setI(Math.max(0, Math.min(SEQ.metas.length - 1, e.data.step)));
      }
    };
    addEventListener("message", mh);
    return () => removeEventListener("message", mh);
  }, []);

  if (!game.section) return <SectionGate
    onStart={(n, list) => dispatch({ type: "roster", section: n, names: list })} />;

  return (
    <div className="app">
      <Boundary><Ambient /></Boundary>
      <Header game={game} onDojo={() => setDojo(true)}
        onOverview={() => setOverview(true)}
        onRail={() => setRail((v) => !v)}
        onMath={() => setMathList(true)}
        onActivity={() => setActivityOpen(true)} />
      <div className="progress" style={{ width: ((i + 1) / SEQ.metas.length) * 100 + "%" }} />

      {game.flash && !dojo && <div className="flash">{game.flash}</div>}

      <div className="stage-wrap" key={i + "-" + replay}>
        <Frame meta={meta} stage={SEQ.stages[i]} quest={i === 0 && typeof STORY !== "undefined" ? STORY.lesson : null}>
          {typeof SEQ.visuals[i] === "string"
            ? <DeckScreens k={SEQ.visuals[i]} award={award} game={game} />
            : <LESSON.Visual i={SEQ.visuals[i]} award={award} game={game} />}
          {SEQ.stages[i] === 7 && <EvidenceWall game={game} award={award} />}
        </Frame>
      </div>

      <div className="dots">
        {SEQ.metas.map((m, n) => (
          <span key={n} onClick={() => setI(n)}
            className={"dot" + (n === i ? " active" : "")}
            title={"Stage " + SEQ.stages[n] + " · " + PHASES[m.phase].label}
            style={n === i ? { background: PHASES[m.phase].c } : undefined} />
        ))}
      </div>

      <div className="nav">
        <button title="Replay (R)" onClick={() => setReplay((r) => r + 1)}><Icon name="fa-rotate-right" /></button>
        <button disabled={i === 0} onClick={() => setI(i - 1)}><Icon name="fa-chevron-left" /></button>
        <span className="counter">{String(i + 1).padStart(2, "0")} / {SEQ.metas.length}</span>
        <button disabled={i === SEQ.metas.length - 1} onClick={() => setI(i + 1)}><Icon name="fa-chevron-right" /></button>
      </div>

      <footer className="footer">
        <span>Dar Al Fikr Schools · {LESSON.code}</span>
        <span className="pull">{meta.pull}</span>
        <span className="mono">{String(i + 1).padStart(2, "0")} / {SEQ.metas.length}</span>
      </footer>

      {overview && <Overview current={i} onSelect={setI} onClose={() => setOverview(false)} />}
      {mathList && <MathInventory onClose={() => setMathList(false)} />}
      {rail && <TeacherRail meta={meta} onClose={() => setRail(false)} />}
      {activityOpen && <ActivityModal onClose={() => setActivityOpen(false)} />}
      {dojo && <Dojo game={game} dispatch={dispatch} job={dojoJob}
        onClose={() => { setDojo(false); setDojoJob(null); }} />}
    </div>
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
} catch (e) {
  document.body.innerHTML =
    '<div style="padding:48px;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0B1F24;color:#EAF4F2;font-family:system-ui">' +
    '<h1 style="color:#C9A227;margin-bottom:14px">Dar Al Fikr Schools</h1>' +
    '<p style="max-width:560px;line-height:1.7;color:#a9c9c4">This interactive lesson is built with React and GSAP. ' +
    'In an offline sandboxed preview the CDN scripts cannot load.<br/><br/>' +
    '<b style="color:#C9A227">Download the file and open it directly in a browser.</b></p></div>';
}
    </script>
  </body>
</html>
