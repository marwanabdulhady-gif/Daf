
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit 1 Station Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #e0f7fa, #e8f5e9);
      margin: 0;
      padding: 20px;
      color: #004d40;
    }
    h1 { text-align: center; color: #2e7d32; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin: 15px auto;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
      max-width: 700px;
    }
    .progress {
      text-align: center;
      font-size: 1.5em;
      margin-top: 20px;
    }
    button {
      display: block;
      margin: 10px auto;
      padding: 8px 16px;
      background-color: #43a047;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background-color: #2e7d32; }
  </style>
</head>
<body>
  <h1>🧩 Unit 1 Station Task Cards</h1>

  <div class="card">🌱 Station 1: Write the number 345,678 in word and expanded form. <button onclick="markComplete()">Complete</button></div>
  <div class="card">🌱 Station 2: Compare 456,789 and 465,789 using >, <, or =. <button onclick="markComplete()">Complete</button></div>
  <div class="card">🌱 Station 3: Round 789,432 to the nearest thousand. <button onclick="markComplete()">Complete</button></div>
  <div class="card">🌱 Station 4: Create your own 6-digit number and represent it in 3 forms. <button onclick="markComplete()">Complete</button></div>

  <div class="progress" id="progress">Completed: 0 / 4</div>

  <script>
    let completed = 0;
    const total = 4;
    const progressDiv = document.getElementById("progress");
    function markComplete(){
      if(completed < total){
        completed++;
        if(progressDiv){
          progressDiv.innerText = "Completed: " + completed + " / " + total;
        }
      }
    }
  </script>
</body>
</html>
