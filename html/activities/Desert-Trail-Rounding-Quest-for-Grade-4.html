<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desert Trail Rounding Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
        @keyframes camelWalk {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        .sparkle {
            animation: sparkle 1.5s infinite;
        }
        .camel-walk {
            animation: camelWalk 0.8s ease-in-out infinite;
        }
        .gradient-desert {
            background: linear-gradient(135deg, #f4a261 0%, #e76f51 50%, #264653 100%);
        }
        .signpost {
            transition: all 0.3s ease;
        }
        .signpost:hover {
            transform: scale(1.05);
        }
        .correct-answer {
            background: linear-gradient(45deg, #2a9d8f, #43aa8b);
            animation: pulse 0.5s ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="gradient-desert min-h-screen font-sans">
    <div class="container mx-auto px-4 py-6">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-white mb-2">🏜️ Desert Trail Rounding Quest 🏜️</h1>
            <p class="text-orange-100 text-lg">Guide your camel to the nearest signpost!</p>
        </div>

        <!-- Progress Tracker -->
        <div class="bg-white/20 backdrop-blur-sm rounded-xl p-4 mb-6 text-center">
            <div class="flex justify-center items-center space-x-8 text-2xl">
                <span id="progress-camel" class="camel-walk">🐫</span>
                <span class="text-white">→</span>
                <span id="progress-tent" class="opacity-50">⛺</span>
                <span class="text-white">→</span>
                <span id="progress-trophy" class="opacity-50">🏆</span>
            </div>
            <div class="mt-2">
                <div class="bg-white/30 rounded-full h-3 w-full max-w-md mx-auto">
                    <div id="progress-bar" class="bg-gradient-to-r from-orange-400 to-orange-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <p class="text-white mt-2">Quest <span id="current-quest">1</span> of 10</p>
            </div>
        </div>

        <!-- Game Area -->
        <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-6 mb-6">
            <!-- Question -->
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-white mb-4">Round this number:</h2>
                <div class="bg-white/20 rounded-xl p-6 inline-block">
                    <span id="question-number" class="text-4xl font-bold text-orange-200">347</span>
                </div>
                <p class="text-orange-100 mt-2">to the nearest <span id="round-to" class="font-bold text-yellow-300">10</span></p>
            </div>

            <!-- Desert Trail with Signposts -->
            <div class="relative bg-gradient-to-b from-orange-300/30 to-orange-500/30 rounded-xl p-8 min-h-64">
                <!-- Trail Path -->
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-full h-2 bg-orange-800/50 rounded-full"></div>
                </div>

                <!-- Signposts -->
                <div class="relative flex justify-between items-center h-full">
                    <div id="signpost-1" class="signpost cursor-pointer text-center" onclick="selectAnswer(0)">
                        <div class="bg-orange-700 text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg">
                            <span id="option-1">340</span>
                        </div>
                        <div class="text-4xl">📍</div>
                    </div>
                    
                    <div id="signpost-2" class="signpost cursor-pointer text-center" onclick="selectAnswer(1)">
                        <div class="bg-orange-700 text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg">
                            <span id="option-2">350</span>
                        </div>
                        <div class="text-4xl">📍</div>
                    </div>
                    
                    <div id="signpost-3" class="signpost cursor-pointer text-center" onclick="selectAnswer(2)">
                        <div class="bg-orange-700 text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg">
                            <span id="option-3">400</span>
                        </div>
                        <div class="text-4xl">📍</div>
                    </div>
                </div>

                <!-- Camel -->
                <div id="camel" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-4xl camel-walk transition-all duration-1000">
                    🐫
                </div>
            </div>
        </div>

        <!-- Feedback Area -->
        <div id="feedback" class="bg-white/20 backdrop-blur-sm rounded-xl p-6 text-center hidden">
            <div id="feedback-content"></div>
            <button id="next-button" onclick="nextQuestion()" class="bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3 px-6 rounded-lg mt-4 transition-all duration-300 transform hover:scale-105">
                Continue Journey →
            </button>
        </div>

        <!-- Completion Celebration -->
        <div id="completion" class="bg-gradient-to-r from-blue-900/80 to-purple-900/80 backdrop-blur-sm rounded-2xl p-8 text-center hidden">
            <div class="mb-6">
                <div class="text-6xl mb-4">🏆</div>
                <h2 class="text-3xl font-bold text-yellow-300 mb-2">Quest Complete!</h2>
                <p class="text-white text-lg">You've mastered the Desert Trail Rounding Quest!</p>
            </div>
            <div class="flex justify-center space-x-2 mb-6">
                <span class="sparkle text-2xl">✨</span>
                <span class="sparkle text-2xl" style="animation-delay: 0.3s">⭐</span>
                <span class="sparkle text-2xl" style="animation-delay: 0.6s">✨</span>
                <span class="sparkle text-2xl" style="animation-delay: 0.9s">⭐</span>
                <span class="sparkle text-2xl" style="animation-delay: 1.2s">✨</span>
            </div>
            <button onclick="restartQuest()" class="bg-gradient-to-r from-orange-500 to-orange-600 hover:from-orange-600 hover:to-orange-700 text-white font-bold py-3 px-8 rounded-lg transition-all duration-300 transform hover:scale-105">
                Start New Quest 🐫
            </button>
        </div>
    </div>

    <script>
        let currentQuestion = 0;
        let score = 0;
        let questions = [];

        // Generate questions for rounding to 10, 100, and 1000
        function generateQuestions() {
            questions = [];
            
            // Rounding to nearest 10 (3 questions)
            for (let i = 0; i < 3; i++) {
                const num = Math.floor(Math.random() * 900) + 100; // 100-999
                const correct = Math.round(num / 10) * 10;
                const wrong1 = correct + 10;
                const wrong2 = correct - 10;
                questions.push({
                    number: num,
                    roundTo: 10,
                    correct: correct,
                    options: shuffleArray([correct, wrong1, wrong2])
                });
            }
            
            // Rounding to nearest 100 (4 questions)
            for (let i = 0; i < 4; i++) {
                const num = Math.floor(Math.random() * 9000) + 1000; // 1000-9999
                const correct = Math.round(num / 100) * 100;
                const wrong1 = correct + 100;
                const wrong2 = correct - 100;
                questions.push({
                    number: num,
                    roundTo: 100,
                    correct: correct,
                    options: shuffleArray([correct, wrong1, wrong2])
                });
            }
            
            // Rounding to nearest 1000 (3 questions)
            for (let i = 0; i < 3; i++) {
                const num = Math.floor(Math.random() * 90000) + 10000; // 10000-99999
                const correct = Math.round(num / 1000) * 1000;
                const wrong1 = correct + 1000;
                const wrong2 = correct - 1000;
                questions.push({
                    number: num,
                    roundTo: 1000,
                    correct: correct,
                    options: shuffleArray([correct, wrong1, wrong2])
                });
            }
            
            questions = shuffleArray(questions);
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function displayQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('question-number').textContent = question.number.toLocaleString();
            document.getElementById('round-to').textContent = question.roundTo.toLocaleString();
            document.getElementById('option-1').textContent = question.options[0].toLocaleString();
            document.getElementById('option-2').textContent = question.options[1].toLocaleString();
            document.getElementById('option-3').textContent = question.options[2].toLocaleString();
            document.getElementById('current-quest').textContent = currentQuestion + 1;
            
            // Reset signpost styles
            for (let i = 1; i <= 3; i++) {
                const signpost = document.getElementById(`signpost-${i}`);
                signpost.className = 'signpost cursor-pointer text-center';
                signpost.children[0].className = 'bg-orange-700 text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg';
            }
            
            // Hide feedback
            document.getElementById('feedback').classList.add('hidden');
            
            // Update progress bar
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            
            // Update progress tracker
            if (currentQuestion >= 3) {
                document.getElementById('progress-tent').classList.remove('opacity-50');
            }
            if (currentQuestion >= 7) {
                document.getElementById('progress-trophy').classList.remove('opacity-50');
            }
        }

        function selectAnswer(optionIndex) {
            const question = questions[currentQuestion];
            const selectedAnswer = question.options[optionIndex];
            const isCorrect = selectedAnswer === question.correct;
            
            // Update signpost appearance
            const selectedSignpost = document.getElementById(`signpost-${optionIndex + 1}`);
            if (isCorrect) {
                selectedSignpost.children[0].className = 'correct-answer text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg';
                score++;
            } else {
                selectedSignpost.children[0].className = 'bg-red-600 text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg';
                // Highlight correct answer
                for (let i = 0; i < 3; i++) {
                    if (question.options[i] === question.correct) {
                        document.getElementById(`signpost-${i + 1}`).children[0].className = 'correct-answer text-white px-4 py-2 rounded-lg font-bold text-lg mb-2 shadow-lg';
                        break;
                    }
                }
            }
            
            // Move camel to selected signpost
            const camel = document.getElementById('camel');
            const positions = ['25%', '50%', '75%'];
            camel.style.left = positions[optionIndex];
            
            // Show feedback
            showFeedback(isCorrect, question);
        }

        function showFeedback(isCorrect, question) {
            const feedback = document.getElementById('feedback');
            const content = document.getElementById('feedback-content');
            
            if (isCorrect) {
                content.innerHTML = `
                    <div class="text-green-300 text-2xl mb-2">🎉 Excellent!</div>
                    <p class="text-white">${question.number.toLocaleString()} rounds to ${question.correct.toLocaleString()} when rounding to the nearest ${question.roundTo.toLocaleString()}.</p>
                `;
            } else {
                content.innerHTML = `
                    <div class="text-orange-300 text-2xl mb-2">🤔 Not quite!</div>
                    <p class="text-white">${question.number.toLocaleString()} rounds to ${question.correct.toLocaleString()} when rounding to the nearest ${question.roundTo.toLocaleString()}.</p>
                    <p class="text-orange-200 text-sm mt-2">Remember: Look at the digit to the right of the place you're rounding to!</p>
                `;
            }
            
            feedback.classList.remove('hidden');
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion >= questions.length) {
                showCompletion();
            } else {
                displayQuestion();
            }
        }

        function showCompletion() {
            document.getElementById('completion').classList.remove('hidden');
            document.querySelector('.container > div:nth-child(3)').classList.add('hidden'); // Hide game area
            
            // Update progress to 100%
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('progress-trophy').classList.remove('opacity-50');
        }

        function restartQuest() {
            currentQuestion = 0;
            score = 0;
            generateQuestions();
            document.getElementById('completion').classList.add('hidden');
            document.querySelector('.container > div:nth-child(3)').classList.remove('hidden');
            
            // Reset progress tracker
            document.getElementById('progress-tent').classList.add('opacity-50');
            document.getElementById('progress-trophy').classList.add('opacity-50');
            
            // Reset camel position
            document.getElementById('camel').style.left = '50%';
            
            displayQuestion();
        }

        // Initialize the game
        generateQuestions();
        displayQuestion();
    </script>

</html>
