<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Builder Studio 🧱✖️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cobalt: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        },
                        coral: {
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        .slide-in { animation: slideIn 0.6s ease-out; }
        .fade-in { animation: fadeIn 0.8s ease-out; }
        .bounce { animation: bounce 1s ease-out; }
        .hidden-step { opacity: 0; transform: translateY(10px); transition: all 0.5s ease-out; }
        .show-step { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="bg-gradient-to-br from-cobalt-50 to-blue-100 min-h-screen font-sans">
    <!-- Header -->
    <header class="bg-white shadow-lg border-b-4 border-cobalt-500">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="text-4xl">🧱✖️</div>
                    <div>
                        <h1 class="text-2xl font-bold text-cobalt-700">Product Builder Studio</h1>
                        <p class="text-cobalt-600">Master multiplication strategies step by step!</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="progress-badge" class="bg-coral-500 text-white px-4 py-2 rounded-full font-bold flex items-center space-x-2">
                        <span id="progress-icon">🧱</span>
                        <span id="progress-text">Beginner Builder</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-6 py-8">
        <!-- Strategy Selector -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold text-cobalt-700 mb-4 flex items-center">
                <span class="mr-2">🏗️</span>
                Choose Your Building Strategy
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <button onclick="setStrategy('multiply10')" class="strategy-btn bg-cobalt-100 hover:bg-cobalt-200 p-4 rounded-lg border-2 border-transparent hover:border-cobalt-500 transition-all">
                    <div class="text-2xl mb-2">🔟</div>
                    <div class="font-semibold text-cobalt-700">× by 10/100</div>
                </button>
                <button onclick="setStrategy('distributive')" class="strategy-btn bg-cobalt-100 hover:bg-cobalt-200 p-4 rounded-lg border-2 border-transparent hover:border-cobalt-500 transition-all">
                    <div class="text-2xl mb-2">📦</div>
                    <div class="font-semibold text-cobalt-700">Distributive</div>
                </button>
                <button onclick="setStrategy('2digit1digit')" class="strategy-btn bg-cobalt-100 hover:bg-cobalt-200 p-4 rounded-lg border-2 border-transparent hover:border-cobalt-500 transition-all">
                    <div class="text-2xl mb-2">🧮</div>
                    <div class="font-semibold text-cobalt-700">2-digit × 1-digit</div>
                </button>
                <button onclick="setStrategy('2digit2digit')" class="strategy-btn bg-cobalt-100 hover:bg-cobalt-200 p-4 rounded-lg border-2 border-transparent hover:border-cobalt-500 transition-all">
                    <div class="text-2xl mb-2">🏰</div>
                    <div class="font-semibold text-cobalt-700">2-digit × 2-digit</div>
                </button>
            </div>
        </div>

        <!-- Problem Input -->
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h3 class="text-lg font-bold text-cobalt-700 mb-4">Build Your Problem</h3>
            <div class="flex items-center space-x-4 mb-4">
                <input type="number" id="num1" placeholder="First number" class="border-2 border-cobalt-300 rounded-lg px-4 py-2 text-lg font-bold text-center w-24 focus:border-cobalt-500 focus:outline-none">
                <span class="text-2xl font-bold text-coral-500">×</span>
                <input type="number" id="num2" placeholder="Second number" class="border-2 border-cobalt-300 rounded-lg px-4 py-2 text-lg font-bold text-center w-24 focus:border-cobalt-500 focus:outline-none">
                <button onclick="solveProblem()" class="bg-coral-500 hover:bg-coral-600 text-white px-6 py-2 rounded-lg font-bold transition-colors">
                    Build Solution! 🧱
                </button>
            </div>
        </div>

        <!-- Solution Display -->
        <div id="solution-container" class="hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Area Model -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-lg font-bold text-cobalt-700 mb-4 flex items-center">
                        <span class="mr-2">📐</span>
                        Area Model
                    </h3>
                    <div id="area-model" class="space-y-4"></div>
                </div>

                <!-- Partial Products -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-lg font-bold text-cobalt-700 mb-4 flex items-center">
                        <span class="mr-2">🔢</span>
                        Partial Products
                    </h3>
                    <div id="partial-products" class="space-y-3"></div>
                </div>

                <!-- Standard Algorithm -->
                <div class="bg-white rounded-xl shadow-lg p-6">
                    <h3 class="text-lg font-bold text-cobalt-700 mb-4 flex items-center">
                        <span class="mr-2">📝</span>
                        Standard Algorithm
                    </h3>
                    <div id="standard-algorithm" class="space-y-2"></div>
                </div>
            </div>

            <!-- Final Answer -->
            <div class="bg-gradient-to-r from-coral-500 to-coral-600 rounded-xl shadow-lg p-6 mt-6 text-center">
                <div class="text-white">
                    <h3 class="text-xl font-bold mb-2">🏆 Final Product Built!</h3>
                    <div id="final-answer" class="text-3xl font-bold"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStrategy = 'distributive';
        let stepDelay = 800;
        let completedProblems = 0;

        function setStrategy(strategy) {
            currentStrategy = strategy;
            document.querySelectorAll('.strategy-btn').forEach(btn => {
                btn.classList.remove('bg-cobalt-500', 'text-white');
                btn.classList.add('bg-cobalt-100', 'text-cobalt-700');
            });
            event.target.closest('.strategy-btn').classList.remove('bg-cobalt-100', 'text-cobalt-700');
            event.target.closest('.strategy-btn').classList.add('bg-cobalt-500', 'text-white');
        }

        function solveProblem() {
            const num1 = parseInt(document.getElementById('num1').value);
            const num2 = parseInt(document.getElementById('num2').value);
            
            if (!num1 || !num2) {
                alert('Please enter both numbers to build your solution! 🧱');
                return;
            }

            document.getElementById('solution-container').classList.remove('hidden');
            document.getElementById('solution-container').classList.add('slide-in');

            // Clear previous solutions
            document.getElementById('area-model').innerHTML = '';
            document.getElementById('partial-products').innerHTML = '';
            document.getElementById('standard-algorithm').innerHTML = '';

            // Generate solutions based on strategy
            setTimeout(() => showAreaModel(num1, num2), 200);
            setTimeout(() => showPartialProducts(num1, num2), 600);
            setTimeout(() => showStandardAlgorithm(num1, num2), 1000);
            setTimeout(() => showFinalAnswer(num1 * num2), 1400);

            // Update progress
            completedProblems++;
            updateProgress();
        }

        function showAreaModel(num1, num2) {
            const container = document.getElementById('area-model');
            
            if (currentStrategy === 'multiply10') {
                showMultiply10AreaModel(container, num1, num2);
            } else if (currentStrategy === 'distributive') {
                showDistributiveAreaModel(container, num1, num2);
            } else {
                showStandardAreaModel(container, num1, num2);
            }
        }

        function showDistributiveAreaModel(container, num1, num2) {
            const tens1 = Math.floor(num1 / 10) * 10;
            const ones1 = num1 % 10;
            const tens2 = Math.floor(num2 / 10) * 10;
            const ones2 = num2 % 10;

            let html = `
                <div class="text-center mb-4">
                    <div class="text-lg font-semibold text-cobalt-600">Breaking down: ${num1} × ${num2}</div>
                    <div class="text-sm text-gray-600">(${tens1} + ${ones1}) × (${tens2} + ${ones2})</div>
                </div>
                <div class="grid grid-cols-2 gap-2 border-2 border-cobalt-300 p-2 rounded-lg">
            `;

            const sections = [
                { val: tens1 * tens2, label: `${tens1} × ${tens2}`, color: 'bg-cobalt-200' },
                { val: tens1 * ones2, label: `${tens1} × ${ones2}`, color: 'bg-coral-200' },
                { val: ones1 * tens2, label: `${ones1} × ${tens2}`, color: 'bg-coral-200' },
                { val: ones1 * ones2, label: `${ones1} × ${ones2}`, color: 'bg-cobalt-200' }
            ];

            sections.forEach((section, index) => {
                html += `
                    <div class="hidden-step ${section.color} p-3 rounded border text-center" id="area-${index}">
                        <div class="font-bold text-sm">${section.label}</div>
                        <div class="text-lg font-bold text-cobalt-700">${section.val}</div>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;

            // Animate sections
            sections.forEach((_, index) => {
                setTimeout(() => {
                    document.getElementById(`area-${index}`).classList.add('show-step');
                }, index * 300);
            });
        }

        function showMultiply10AreaModel(container, num1, num2) {
            let html = `
                <div class="text-center mb-4">
                    <div class="text-lg font-semibold text-cobalt-600">${num1} × ${num2}</div>
                </div>
            `;

            if (num2 === 10) {
                html += `
                    <div class="space-y-3">
                        <div class="hidden-step bg-cobalt-100 p-3 rounded" id="step-1">
                            <div class="text-sm text-cobalt-600">When multiplying by 10:</div>
                            <div class="font-bold">Add one zero to ${num1}</div>
                        </div>
                        <div class="hidden-step bg-coral-100 p-3 rounded text-center" id="step-2">
                            <div class="text-2xl font-bold text-coral-600">${num1}0</div>
                        </div>
                    </div>
                `;
            } else if (num2 === 100) {
                html += `
                    <div class="space-y-3">
                        <div class="hidden-step bg-cobalt-100 p-3 rounded" id="step-1">
                            <div class="text-sm text-cobalt-600">When multiplying by 100:</div>
                            <div class="font-bold">Add two zeros to ${num1}</div>
                        </div>
                        <div class="hidden-step bg-coral-100 p-3 rounded text-center" id="step-2">
                            <div class="text-2xl font-bold text-coral-600">${num1}00</div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            setTimeout(() => document.getElementById('step-1').classList.add('show-step'), 200);
            setTimeout(() => document.getElementById('step-2').classList.add('show-step'), 600);
        }

        function showStandardAreaModel(container, num1, num2) {
            const tens1 = Math.floor(num1 / 10);
            const ones1 = num1 % 10;
            const tens2 = Math.floor(num2 / 10);
            const ones2 = num2 % 10;

            let html = `
                <div class="text-center mb-4">
                    <div class="text-lg font-semibold text-cobalt-600">${num1} × ${num2}</div>
                </div>
                <div class="border-2 border-cobalt-300 rounded-lg overflow-hidden">
                    <table class="w-full">
                        <tr>
                            <td class="border border-gray-300 p-2 bg-gray-100"></td>
                            <td class="border border-gray-300 p-2 bg-cobalt-100 text-center font-bold">${tens2 > 0 ? tens2 + '0' : ''}</td>
                            <td class="border border-gray-300 p-2 bg-cobalt-100 text-center font-bold">${ones2}</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 p-2 bg-coral-100 text-center font-bold">${tens1 > 0 ? tens1 + '0' : ''}</td>
                            <td class="border border-gray-300 p-2 bg-yellow-100 text-center hidden-step" id="cell-1">${tens1 * tens2 * 100}</td>
                            <td class="border border-gray-300 p-2 bg-yellow-100 text-center hidden-step" id="cell-2">${tens1 * ones2 * 10}</td>
                        </tr>
                        <tr>
                            <td class="border border-gray-300 p-2 bg-coral-100 text-center font-bold">${ones1}</td>
                            <td class="border border-gray-300 p-2 bg-yellow-100 text-center hidden-step" id="cell-3">${ones1 * tens2 * 10}</td>
                            <td class="border border-gray-300 p-2 bg-yellow-100 text-center hidden-step" id="cell-4">${ones1 * ones2}</td>
                        </tr>
                    </table>
                </div>
            `;

            container.innerHTML = html;

            // Animate cells
            for (let i = 1; i <= 4; i++) {
                setTimeout(() => {
                    const cell = document.getElementById(`cell-${i}`);
                    if (cell) cell.classList.add('show-step');
                }, i * 300);
            }
        }

        function showPartialProducts(num1, num2) {
            const container = document.getElementById('partial-products');
            
            if (currentStrategy === 'multiply10') {
                showMultiply10Partial(container, num1, num2);
            } else {
                showStandardPartial(container, num1, num2);
            }
        }

        function showMultiply10Partial(container, num1, num2) {
            let html = `
                <div class="text-center mb-4">
                    <div class="text-lg font-semibold">${num1} × ${num2}</div>
                </div>
            `;

            if (num2 === 10) {
                html += `
                    <div class="space-y-2">
                        <div class="hidden-step bg-cobalt-50 p-2 rounded border-l-4 border-cobalt-500" id="partial-1">
                            <span class="text-cobalt-600">Pattern:</span> ${num1} × 10 = ${num1}0
                        </div>
                    </div>
                `;
            } else if (num2 === 100) {
                html += `
                    <div class="space-y-2">
                        <div class="hidden-step bg-cobalt-50 p-2 rounded border-l-4 border-cobalt-500" id="partial-1">
                            <span class="text-cobalt-600">Pattern:</span> ${num1} × 100 = ${num1}00
                        </div>
                    </div>
                `;
            } else {
                showStandardPartial(container, num1, num2);
                return;
            }

            container.innerHTML = html;
            setTimeout(() => document.getElementById('partial-1').classList.add('show-step'), 200);
        }

        function showStandardPartial(container, num1, num2) {
            const tens1 = Math.floor(num1 / 10) * 10;
            const ones1 = num1 % 10;
            const tens2 = Math.floor(num2 / 10) * 10;
            const ones2 = num2 % 10;

            let html = `
                <div class="text-center mb-4">
                    <div class="text-lg font-semibold">${num1} × ${num2}</div>
                </div>
                <div class="space-y-2">
            `;

            const products = [];
            if (tens1 > 0 && tens2 > 0) products.push({ expr: `${tens1} × ${tens2}`, val: tens1 * tens2 });
            if (tens1 > 0 && ones2 > 0) products.push({ expr: `${tens1} × ${ones2}`, val: tens1 * ones2 });
            if (ones1 > 0 && tens2 > 0) products.push({ expr: `${ones1} × ${tens2}`, val: ones1 * tens2 });
            if (ones1 > 0 && ones2 > 0) products.push({ expr: `${ones1} × ${ones2}`, val: ones1 * ones2 });

            products.forEach((product, index) => {
                html += `
                    <div class="hidden-step bg-coral-50 p-2 rounded border-l-4 border-coral-500 flex justify-between" id="partial-${index}">
                        <span>${product.expr}</span>
                        <span class="font-bold">${product.val}</span>
                    </div>
                `;
            });

            html += `
                <div class="hidden-step border-t-2 border-cobalt-300 pt-2 mt-3" id="partial-sum">
                    <div class="bg-cobalt-100 p-2 rounded flex justify-between font-bold">
                        <span>Total:</span>
                        <span>${products.reduce((sum, p) => sum + p.val, 0)}</span>
                    </div>
                </div>
            </div>`;

            container.innerHTML = html;

            // Animate steps
            products.forEach((_, index) => {
                setTimeout(() => {
                    document.getElementById(`partial-${index}`).classList.add('show-step');
                }, index * 300);
            });
            setTimeout(() => {
                document.getElementById('partial-sum').classList.add('show-step');
            }, products.length * 300);
        }

        function showStandardAlgorithm(num1, num2) {
            const container = document.getElementById('standard-algorithm');
            
            let html = `
                <div class="bg-gray-50 p-4 rounded-lg font-mono text-lg">
                    <div class="text-center mb-3">
                        <div class="text-right pr-4">
                            <div>${num1.toString().padStart(4)}</div>
                            <div class="border-b-2 border-black">× ${num2.toString().padStart(2)}</div>
                        </div>
                    </div>
            `;

            if (num2 < 10) {
                html += `
                    <div class="hidden-step text-right pr-4" id="alg-1">
                        <div class="text-coral-600 font-bold">${(num1 * num2).toString().padStart(4)}</div>
                    </div>
                `;
            } else {
                const ones = num2 % 10;
                const tens = Math.floor(num2 / 10);
                
                html += `
                    <div class="space-y-1 text-right pr-4">
                        <div class="hidden-step text-coral-600" id="alg-1">${(num1 * ones).toString().padStart(4)}</div>
                        <div class="hidden-step text-coral-600" id="alg-2">+ ${(num1 * tens * 10).toString().padStart(3)}</div>
                        <div class="hidden-step border-t border-black text-cobalt-700 font-bold" id="alg-3">${(num1 * num2).toString().padStart(4)}</div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;

            // Animate algorithm steps
            const steps = container.querySelectorAll('.hidden-step');
            steps.forEach((step, index) => {
                setTimeout(() => {
                    step.classList.add('show-step');
                }, index * 400);
            });
        }

        function showFinalAnswer(answer) {
            const container = document.getElementById('final-answer');
            container.textContent = answer;
            container.classList.add('bounce');
        }

        function updateProgress() {
            const badge = document.getElementById('progress-badge');
            const icon = document.getElementById('progress-icon');
            const text = document.getElementById('progress-text');

            if (completedProblems >= 10) {
                icon.textContent = '🏰';
                text.textContent = 'Master Builder';
                badge.classList.remove('bg-coral-500');
                badge.classList.add('bg-gradient-to-r', 'from-yellow-400', 'to-yellow-600');
            } else if (completedProblems >= 5) {
                icon.textContent = '🏗️';
                text.textContent = 'Skilled Builder';
                badge.classList.remove('bg-coral-500');
                badge.classList.add('bg-cobalt-600');
            }
        }

        // Set default strategy
        document.addEventListener('DOMContentLoaded', function() {
            setStrategy('distributive');
        });
    </script>
