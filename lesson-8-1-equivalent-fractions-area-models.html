<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />

    <title>Dar Al Fikr · Grade 4 · Lesson 8-1 — Equivalent Fractions: Area Models</title>
    <link

      rel="stylesheet"
    />
    <link

      rel="stylesheet"

    />

    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- GUARDRAIL 13 · Babel 8's preset-react defaults to the AUTOMATIC jsx runtime,
         which emits `import {jsx} from "react/jsx-runtime"` and blanks the whole deck
         with "Cannot use import statement outside a module". Register a classic-runtime
         preset and reference it from data-presets. -->
    <script>
      if (window.Babel && Babel.availablePresets && Babel.availablePresets["react"]) {
        Babel.registerPreset("daf-react", {
          presets: [[Babel.availablePresets["react"], { runtime: "classic" }]]
        });
      }
    </script>

    <style>
      :root {
        --daf-teal: #12857c;
        --daf-teal-2: #1aa79b;
        --daf-deep: #0a5f58;
        --daf-gold: #c9a227;
        --daf-gold-2: #e3c05a;
        --daf-ink: #10242b;
        --daf-ink-2: #47616a;
        --daf-mint: #e8f6f4;
        --daf-paper: #f7fbfa;
        --daf-line: #cde7e3;
        --daf-grad: linear-gradient(135deg, var(--daf-teal), var(--daf-teal-2));
        --daf-gold-grad: linear-gradient(135deg, var(--daf-gold), var(--daf-gold-2));

        --c: #6042a6;
        --c-2: #8b6fd4;
        --c-grad: linear-gradient(90deg, var(--c), var(--c-2));

        --m-blue: #2d70b3;
        --m-red: #c74440;
        --m-green: #388c46;
        --m-purple: #6042a6;
        --m-orange: #fa7e19;

        --ok: #388c46;
        --warn: #e0a526;
        --stop: #c74440;

        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      * { box-sizing: border-box; }

      html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }

      body {
        font-family: "Satoshi", system-ui, sans-serif;
        background: linear-gradient(135deg, #f7fbfa 0%, #e8f6f4 55%, #f2faf8 100%);
        color: var(--daf-ink);
      }

      h1, h2, h3 { font-family: "Cabinet Grotesk", "Satoshi", sans-serif; }

      .mono { font-family: "JetBrains Mono", monospace; }
      .hand { font-family: "Lemonada", cursive; }

      .app {
        width: 100vw; height: 100vh; position: relative; overflow: hidden;
        background: linear-gradient(135deg, #f7fbfa 0%, #e8f6f4 55%, #f2faf8 100%);
      }

      .ambient { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

      /* ---------------- header ---------------- */
      .header {
        position: absolute; inset-inline: 0; top: 0; height: 72px; z-index: 50;
        display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr);
        align-items: center; gap: 14px; padding: 6px 20px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border-bottom: 3px solid var(--daf-gold);
        box-shadow: 0 10px 30px rgba(10, 95, 88, 0.07);
      }
      .brand { display: flex; align-items: center; gap: 11px; }
      .brand-star { width: 42px; height: 42px; color: var(--daf-teal); flex-shrink: 0; }
      .brand-txt b { display: block; font-size: 15px; color: var(--daf-deep); letter-spacing: 0.02em; line-height: 1.1; }
      .brand-txt span { font-size: 9px; letter-spacing: 0.14em; color: var(--daf-ink-2); font-weight: 800; }
      .head-center { text-align: center; min-width: 0; padding: 0 6px; }
      .head-center b { display: block; color: var(--c); font-size: clamp(12px, 1.08vw, 15px); letter-spacing: 0.06em; transition: color .5s var(--ease); }
      .head-center span { font-size: 9.5px; letter-spacing: 0.13em; color: var(--daf-ink-2); font-weight: 800; }
      .header-right { display: flex; justify-content: flex-end; align-items: center; gap: 9px; min-width: 0; overflow: hidden; }

      /* ---------------- stage ---------------- */
      .stage-wrap { position: absolute; inset-inline: 0; top: 72px; bottom: 36px; z-index: 3; }

      .screen {
        width: 100%; height: 100%; position: relative; display: grid;
        grid-template-columns: minmax(320px, 36%) 1fr;
        overflow: hidden;
        background: linear-gradient(145deg, #ffffff 0%, #fbfefd 60%, #eef8f6 100%);
        animation: screenIn 0.66s var(--ease) both;
      }
      .screen.full { grid-template-columns: 1fr; }
      .screen:before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background-image:
          linear-gradient(color-mix(in srgb, var(--c) 4%, transparent) 1px, transparent 1px),
          linear-gradient(90deg, color-mix(in srgb, var(--c) 4%, transparent) 1px, transparent 1px);
        background-size: 46px 46px;
        mask-image: linear-gradient(to bottom, #000, transparent 94%);
        -webkit-mask-image: linear-gradient(to bottom, #000, transparent 94%);
      }
      @keyframes screenIn {
        from { opacity: 0; transform: scale(1.014); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: none; }
      }

      .copy {
        position: relative; z-index: 5;
        padding: 34px 22px 46px 44px;
        display: flex; flex-direction: column; justify-content: center;
      }

      .visual {
        position: relative; z-index: 4; min-width: 0;
        display: flex; align-items: stretch; justify-content: center;
        padding: 20px 40px 42px 14px;
      }
      .visual > .glass-panel {
        display: flex; flex-direction: column; justify-content: center;
        max-height: 100%; overflow-y: auto;
      }
      .visual > .glass-panel::-webkit-scrollbar { width: 6px; }
      .visual > .glass-panel::-webkit-scrollbar-thumb { background: rgba(18,133,124,.22); border-radius: 999px; }

      .copy-star {
        position: absolute; width: 300px; height: 300px;
        inset-inline-start: -70px; bottom: -60px;
        color: var(--c); opacity: 0.05; pointer-events: none;
      }

      .phase-tag {
        display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
        font-size: 10.5px; font-weight: 900; letter-spacing: 0.16em;
        text-transform: uppercase; color: #fff; background: var(--c-grad);
        padding: 6px 13px; border-radius: 999px; margin-bottom: 15px;
        box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 30%, transparent);
      }

      h1 {
        font-size: clamp(27px, 2.9vw, 46px); line-height: 1.02;
        letter-spacing: -0.04em; margin: 0 0 15px; font-weight: 900; color: var(--daf-ink);
      }
      h1 em {
        font-style: normal;
        background: var(--c-grad);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .lead { font-size: clamp(13.5px, 1.1vw, 17px); line-height: 1.55; color: var(--daf-ink-2); max-width: 560px; margin: 0; }

      .goal {
        margin-top: 18px; padding-inline-start: 13px;
        border-inline-start: 3px solid var(--daf-gold);
        font-size: 11.5px; color: var(--daf-ink-2); line-height: 1.5; max-width: 480px;
      }
      .goal b { color: var(--daf-deep); }

      .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 18px; }
      .chip {
        padding: 7px 13px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
        background: #fff; border: 1px solid var(--daf-line); color: var(--daf-deep);
      }

      /* ---------------- footer + progress ---------------- */
      .footer {
        position: absolute; inset-inline: 0; bottom: 0; height: 36px; z-index: 60;
        background: linear-gradient(90deg, var(--daf-deep), var(--daf-teal));
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 26px; font-size: 10.5px; font-weight: 700; color: #fff; letter-spacing: 0.05em;
      }
      .pull { opacity: 0.92; font-weight: 600; }

      .progress {
        position: absolute; inset-inline-start: 0; top: 69px; height: 3px; z-index: 70;
        background: var(--c-grad); transition: width 0.6s var(--ease);
      }

      /* ---------------- nav ---------------- */
      .nav { position: absolute; inset-inline-end: 18px; bottom: 48px; z-index: 80; display: flex; align-items: center; gap: 7px; }
      .nav button {
        width: 42px; height: 42px; border: 1px solid var(--daf-line); border-radius: 50%;
        background: #fff; color: var(--daf-deep); cursor: pointer; font-size: 15px;
        box-shadow: 0 8px 24px rgba(10, 95, 88, 0.12); transition: all 0.25s var(--ease);
      }
      .nav button:hover:not(:disabled) { transform: scale(1.09); background: var(--c); color: #fff; border-color: var(--c); }
      .nav button:disabled { opacity: 0.28; cursor: not-allowed; }
      .counter {
        padding: 9px 15px; border-radius: 999px; background: #fff; border: 1px solid var(--daf-line);
        font: 700 11px "JetBrains Mono", monospace; color: var(--daf-deep);
      }

      .dots {
        position: absolute; inset-inline-start: 13px; top: 50%; transform: translateY(-50%);
        z-index: 70; display: flex; flex-direction: column; gap: 5px;
      }
      .dot { width: 4px; height: 8px; border-radius: 3px; background: color-mix(in srgb, var(--daf-teal) 25%, transparent); transition: 0.35s; cursor: pointer; }
      .dot.active { height: 22px; background: var(--c); box-shadow: 0 0 12px var(--c); }

      /* ---------------- panels ---------------- */
      .glass-panel {
        background: rgba(255, 255, 255, 0.84);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
        border-radius: 18px; padding: 22px;
        box-shadow: 0 20px 45px rgba(10, 95, 88, 0.08), 0 1px 2px rgba(255, 255, 255, 0.9) inset;
        width: 100%;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--daf-line); border-radius: 14px; padding: 16px;
        transition: all 0.3s var(--ease); cursor: pointer;
      }
      .glass-card:hover, .glass-card.active {
        border-color: var(--c); transform: translateY(-3px);
        box-shadow: 0 16px 36px color-mix(in srgb, var(--c) 18%, transparent);
      }
      .glass-card.chosen { border-color: var(--c); border-width: 2px; background: #fff; }

      .btn { border: none; cursor: pointer; font-weight: 800; border-radius: 10px; transition: all 0.25s var(--ease); font-size: 12px; padding: 10px 18px; font-family: inherit; }
      .btn-primary { background: var(--c-grad); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--c) 32%, transparent); }
      .btn-primary:hover { transform: translateY(-2px); }
      .btn-gold { background: var(--daf-gold-grad); color: #10242b; box-shadow: 0 6px 18px rgba(201, 162, 39, 0.3); }
      .btn-gold:hover { transform: translateY(-2px); }
      .btn-ghost { background: #fff; color: var(--daf-deep); border: 1px solid var(--daf-line); }
      .btn-ghost:hover { border-color: var(--c); transform: translateY(-2px); }
      .btn-sm { padding: 6px 12px; font-size: 10.5px; }

      /* ---------------- math ---------------- */
      .daf-math { font-size: 1em; }
      math { font-family: "Cambria Math", "STIX Two Math", "Latin Modern Math", serif; }
      .math-inline { display: inline-block; vertical-align: middle; }
      .math-block { display: block; text-align: center; margin: 8px 0; }
      .math-xl math { font-size: 34px; }
      .math-lg math { font-size: 24px; }
      .math-md math { font-size: 18px; }
      .daf-math-error { color: var(--stop); font-size: 12px; }


      /* ---------------- board mode: gates, attribution, ledger ---------------- */
      .gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;
        background:linear-gradient(135deg,#0A5F58,#12857C);padding:24px;overflow:auto}
      .gate-card{background:#fff;border-radius:22px;padding:34px 38px;max-width:520px;text-align:center;
        box-shadow:0 30px 70px rgba(0,0,0,.28)}
      .gate-card.wide{max-width:860px}
      .gate-card h2{margin:0 0 6px;color:var(--daf-deep);font-size:23px}
      .gate-card p{margin:0 0 18px;color:var(--daf-ink-2);font-size:13.5px}
      .gate-sections{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
      .gate-sections .btn{min-width:120px;font-size:17px;padding:14px 22px}
      .gate-note{margin-top:16px;font-size:11px;color:var(--daf-ink-2)}
      .name-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;
        max-height:46vh;overflow:auto;padding:2px}
      .name-chip{border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);
        border-radius:10px;padding:10px 8px;font:700 12.5px inherit;cursor:pointer;
        transition:all .16s var(--ease);text-align:center}
      .name-chip.on{border-color:var(--daf-teal);color:var(--daf-deep);background:var(--daf-mint)}
      .name-chip.pick{border-color:var(--daf-gold);background:#fffbe9;color:#7a5f00;
        box-shadow:0 0 0 3px rgba(201,162,39,.18)}
      .name-chip:hover{transform:translateY(-1px)}
      .qp-sub{font-size:11.5px;color:var(--daf-ink-2);display:block;margin-top:3px}
      .qp-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}

      /* ---- gate: saved classes vs pasted list ---- */
      .gate-tabs{display:flex;gap:8px;justify-content:center;margin:4px 0 18px}
      .gate-tab{border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);
        border-radius:999px;padding:8px 18px;font:800 12px inherit;cursor:pointer;transition:all .16s var(--ease)}
      .gate-tab.on{background:var(--daf-teal);border-color:var(--daf-teal);color:#fff}
      .gate-sections .btn em{font-style:normal;font-size:11px;opacity:.75;margin-inline-start:8px}
      .saved-class{position:relative;display:inline-flex}
      .saved-x{position:absolute;top:-7px;inset-inline-end:-7px;width:20px;height:20px;border-radius:50%;
        border:1.5px solid var(--daf-line);background:#fff;color:var(--daf-ink-2);font-size:9px;cursor:pointer}
      .saved-x:hover{border-color:var(--stop);color:var(--stop)}
      .paste-wrap{text-align:left}
      .paste-name{width:100%;border:1.5px solid var(--daf-line);border-radius:10px;padding:11px 14px;
        font:800 14px inherit;color:var(--daf-deep);margin-bottom:9px}
      .paste-area{width:100%;height:190px;border:1.5px solid var(--daf-line);border-radius:12px;
        padding:12px 14px;font:500 13px inherit;line-height:1.6;color:var(--daf-ink);resize:vertical}
      .paste-name:focus,.paste-area:focus{outline:none;border-color:var(--daf-teal);
        box-shadow:0 0 0 3px rgba(18,133,124,.14)}
      .paste-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;
        margin-top:8px;flex-wrap:wrap}
      .paste-count{font-size:12px;color:var(--daf-ink-2)}
      .paste-count b{color:var(--daf-teal);font-size:14px}
      .paste-remember{font-size:11.5px;color:var(--daf-ink-2);display:flex;align-items:center;gap:6px;cursor:pointer}
      .add-row{display:flex;gap:8px;margin-top:12px}
      .add-row input{flex:1;border:1.5px solid var(--daf-line);border-radius:10px;padding:9px 12px;
        font:600 12.5px inherit;color:var(--daf-ink)}
      .add-row input:focus{outline:none;border-color:var(--daf-teal)}

      /* ---- the dojo (P) — full-screen class board, ClassDojo pace ---- */
      .dojo{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;
        background:radial-gradient(1100px 600px at 70% -10%,#12333B 0%,var(--daf-board,#0B1F24) 60%);
        color:#EAF4F2;padding:18px 22px 12px;animation:dj-in .22s var(--ease)}
      @keyframes dj-in{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
      .dj-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
      .dj-title b{font-size:19px;letter-spacing:.02em}
      .dj-title span{display:block;font-size:11.5px;color:#9fc4bd}
      .dj-star{font-style:normal;color:var(--daf-gold);font-weight:800}
      .dj-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .dj-top .dj-tools:last-child{margin-inline-start:auto}
      .dojo .btn-ghost{border-color:#2c5058;color:#cfe8e3;background:rgba(255,255,255,.04)}
      .dojo .btn-ghost:hover{border-color:var(--daf-gold);color:#fff}
      .dj-job{display:flex;align-items:center;gap:10px;background:rgba(201,162,39,.14);
        border:1.5px solid var(--daf-gold);border-radius:12px;padding:8px 14px;flex:1;min-width:220px}
      .dj-job span{font-weight:800;font-size:13.5px}
      .dj-job em{font-style:normal;font:800 12px "JetBrains Mono",monospace;color:var(--daf-gold);white-space:nowrap}
      .dj-job i{color:var(--daf-gold)}
      .dj-reasons{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:10px}
      .dj-sep{width:1.5px;height:22px;background:#2c5058;margin:0 4px}
      .dj-chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;cursor:pointer;
        border:1.5px solid #2c5058;background:rgba(255,255,255,.05);color:#d9ece8;
        padding:6px 12px;font:inherit;font-size:12px;font-weight:700;transition:all .13s var(--ease)}
      .dj-chip em{font-style:normal;font:800 11.5px "JetBrains Mono",monospace}
      .dj-chip.good i,.dj-chip.good em{color:#7ED08C}
      .dj-chip.bad i,.dj-chip.bad em{color:#F2938F}
      .dj-chip:hover{transform:translateY(-1px);border-color:#9fc4bd}
      .dj-chip.good.on{background:#388C46;border-color:#7ED08C;color:#fff}
      .dj-chip.bad.on{background:#C74440;border-color:#F2938F;color:#fff}
      .dj-chip.on i,.dj-chip.on em{color:#fff}
      .dj-att{background:rgba(201,162,39,.1);border:1px dashed var(--daf-gold);border-radius:12px;padding:8px 12px}
      .dj-att-note{font-size:12.5px;font-weight:700;color:var(--daf-gold);display:inline-flex;gap:8px;align-items:center}
      .dj-att input{flex:1;min-width:200px;border:1.5px solid #2c5058;background:rgba(0,0,0,.25);
        border-radius:9px;padding:7px 11px;font:600 12.5px inherit;color:#fff}
      .dj-att input:focus{outline:none;border-color:var(--daf-gold)}
      .dj-grid{flex:1;overflow:auto;display:grid;gap:10px;align-content:start;padding:4px 2px;
        grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
      .dj-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
        border:1.5px solid #24464e;border-radius:16px;background:rgba(255,255,255,.045);
        padding:12px 6px 10px;cursor:pointer;font:inherit;color:#EAF4F2;
        transition:all .13s var(--ease)}
      .dj-card:hover{border-color:#9fc4bd;background:rgba(255,255,255,.09);transform:translateY(-2px)}
      .dj-card.away{opacity:.32;filter:grayscale(.7)}
      .dj-card.hot{border-color:var(--daf-gold);background:rgba(201,162,39,.16);
        box-shadow:0 0 0 3px rgba(201,162,39,.28),0 10px 26px rgba(0,0,0,.35);transform:translateY(-3px) scale(1.04)}
      .dj-body{position:relative;display:block;width:58px}
      .dj-av{width:58px;height:58px;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
      .dj-body.pop{animation:dj-pop .5s var(--ease)}
      .dj-body.shake{animation:dj-shake .45s var(--ease)}
      @keyframes dj-pop{0%{transform:scale(1)}35%{transform:scale(1.22) rotate(-3deg)}70%{transform:scale(.96)}100%{transform:scale(1)}}
      @keyframes dj-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}45%{transform:translateX(5px) rotate(2deg)}70%{transform:translateX(-3px)}}
      .dj-bubble{position:absolute;top:-7px;inset-inline-end:-13px;min-width:24px;height:24px;
        display:grid;place-items:center;padding:0 5px;border-radius:999px;background:var(--daf-gold);
        color:#10242B;font:800 11.5px "JetBrains Mono",monospace;box-shadow:0 3px 8px rgba(0,0,0,.4)}
      .dj-bubble.neg{background:#C74440;color:#fff}
      .dj-name{font-size:11.5px;font-weight:700;max-width:100%;white-space:nowrap;
        overflow:hidden;text-overflow:ellipsis;padding:0 4px}
      .dj-away-tag{font-size:9px;letter-spacing:.14em;color:#F2938F;font-weight:800}
      .dj-burst{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:3;pointer-events:none;
        font:900 17px "JetBrains Mono",monospace;color:#7ED08C;text-shadow:0 2px 8px rgba(0,0,0,.5);
        animation:dj-float 1s var(--ease) forwards}
      .dj-burst.neg{color:#F2938F}
      @keyframes dj-float{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}

  <body>
    <div id="root"></div>
    <script>
/* =============================================================================
   DAF-OMML  ·  Office Math Markup Language → MathML runtime renderer
   -----------------------------------------------------------------------------
   Every fraction, radical, exponent and math symbol in a Dar Al Fikr math deck
   is AUTHORED IN OMML (the same markup Word/PowerPoint stores in document.xml).
   This module is the only thing allowed to turn that OMML into pixels.

   Why: one source of truth. The exact same <m:oMath> string that renders in the
   HTML slide can be pasted into a .docx worksheet, a .pptx, or an exported PDF
   and it stays a real, editable equation — never an image, never LaTeX.

   Public API
     DAFMath.toMathML(ommlString, opts) -> MathML string
     DAFMath.render(el, ommlString, opts)
     DAFMath.hydrate(root)      // renders every [data-omml] node in the DOM

   ENGLISH EDITION: western digits only, no RTL handling anywhere.
   opts: { display:'block'|'inline' }
   ============================================================================= */
(function (global) {
  "use strict";

  var M_NS = "http://schemas.openxmlformats.org/officeDocument/2006/math";

  /* ---------- helpers ----------------------------------------------------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function localName(node) {
    return node.localName || String(node.nodeName).replace(/^.*:/, "");
  }

  /* children of `node` whose local name is in `names` (array or single) */
  function kids(node, names) {
    var want = names ? [].concat(names) : null;
    var out = [];
    var c = node.firstChild;
    while (c) {
      if (c.nodeType === 1 && (!want || want.indexOf(localName(c)) !== -1)) out.push(c);
      c = c.nextSibling;
    }
    return out;
  }

  function kid(node, name) {
    var k = kids(node, name);
    return k.length ? k[0] : null;
  }

  /* read m:val of a property child, e.g. mval(fPr,'type') */
  function mval(node, name) {
    if (!node) return null;
    var el = kid(node, name);
    if (!el) return null;
    return (
      el.getAttribute("m:val") ||
      el.getAttributeNS(M_NS, "val") ||
      el.getAttribute("val") ||
      ""
    );
  }

  function textOf(node) {
    var s = "";
    (function walk(n) {
      var c = n.firstChild;
      while (c) {
        if (c.nodeType === 3 || c.nodeType === 4) s += c.nodeValue;
        else if (c.nodeType === 1) walk(c);
        c = c.nextSibling;
      }
    })(node);
    return s;
  }

  function wrap(parts) {
    if (parts.length === 1) return parts[0];
    return "<mrow>" + parts.join("") + "</mrow>";
  }

  /* ---------- run text → <mn> / <mi> / <mo> ------------------------------- */
  var OPERATORS = "+\u2212-\u00b1\u2213\u00d7\u00f7*/=\u2260<>\u2264\u2265\u2248\u221d\u2192\u21d2\u21d4\u2234\u2235\u222a\u2229\u2208\u2209\u2282\u2283\u2286\u2287\u00ac\u2227\u2228|,;:!%\u00b0\u2032\u2033\u22c5\u2218\u2245\u2261\u223c";
  var FENCES = "()[]{}\u2308\u2309\u230a\u230b\u2016";

  /* normalise the ASCII characters authors type into true math glyphs */
  var GLYPH = { "-": "\u2212", "*": "\u22c5", "<=": "\u2264", ">=": "\u2265", "!=": "\u2260", "~=": "\u2248" };


  /* MathML collapses leading/trailing whitespace inside <mtext>, which silently
     glues a normal-text run to the maths beside it ("4,382rounds to4,000").
     Preserve the author's edge spaces as non-breaking spaces. */
  function keepEdgeSpaces(s) {
    return String(s)
      .replace(/^[ \t]+/, function (m) { return new Array(m.length + 1).join("\u00a0"); })
      .replace(/[ \t]+$/, function (m) { return new Array(m.length + 1).join("\u00a0"); });
  }

  function tokenizeRunText(t, opts) {
    var out = [];
    var i = 0;
    while (i < t.length) {
      var ch = t.charAt(i);

      /* whitespace */
      if (/\s/.test(ch)) {
        var ws = "";
        while (i < t.length && /\s/.test(t.charAt(i))) { ws += t.charAt(i); i++; }
        out.push('<mspace width="0.28em"/>');
        continue;
      }

      /* number (supports decimal point and thousands comma inside digits) */
      if (/[0-9]/.test(ch)) {
        var num = "";
        while (i < t.length && /[0-9]/.test(t.charAt(i))) { num += t.charAt(i); i++; }
        if (t.charAt(i) === "." && /[0-9]/.test(t.charAt(i + 1) || "")) {
          num += ".";
          i++;
          while (i < t.length && /[0-9]/.test(t.charAt(i))) { num += t.charAt(i); i++; }
        }
        out.push("<mn>" + esc(num) + "</mn>");
        continue;
      }

      /* two-char operators */
      var two = t.substr(i, 2);
      if (GLYPH[two]) { out.push("<mo>" + esc(GLYPH[two]) + "</mo>"); i += 2; continue; }

      /* fences get stretchy=false so they don't grow oddly in a plain run */
      if (FENCES.indexOf(ch) !== -1) {
        out.push('<mo stretchy="false">' + esc(ch) + "</mo>");
        i++;
        continue;
      }

      if (OPERATORS.indexOf(ch) !== -1) {
        out.push("<mo>" + esc(GLYPH[ch] || ch) + "</mo>");
        i++;
        continue;
      }

      /* identifier: latin/greek/arabic letters. Multi-letter latin runs stay as
         one <mi> only when they are a known function name, else split so that
         "xy" renders as x·y in italic like Word does. */
      if (/[A-Za-z\u0370-\u03ff]/.test(ch)) {
        var word = "";
        while (i < t.length && /[A-Za-z\u0370-\u03ff]/.test(t.charAt(i))) {
          word += t.charAt(i);
          i++;
        }
        if (/^(sin|cos|tan|sec|csc|cot|log|ln|exp|lim|max|min|gcd|lcm|det|mod)$/i.test(word)) {
          out.push("<mi>" + esc(word) + "</mi>");
        } else {
          for (var j = 0; j < word.length; j++) out.push("<mi>" + esc(word.charAt(j)) + "</mi>");
        }
        continue;
      }

      out.push("<mo>" + esc(ch) + "</mo>");
      i++;
    }
    return out.join("");
  }


  /* ---------- element dispatch -------------------------------------------- */
  function convertNodes(nodes, opts) {
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var s = convert(nodes[i], opts);
      if (s) out.push(s);
    }
    return out.join("");
  }

  function convertChildren(node, opts) {
    return convertNodes(kids(node), opts);
  }

  /* argument slot (m:e, m:num, m:den ...) always becomes exactly one box */
  function slot(node, opts) {
    if (!node) return "<mrow/>";
    var inner = convertChildren(node, opts);
    if (!inner) return "<mrow/>";
    return "<mrow>" + inner + "</mrow>";
  }

  function convert(node, opts) {
    if (node.nodeType === 3) return "";
    if (node.nodeType !== 1) return "";
    var n = localName(node);

    switch (n) {
      /* ---- containers ---- */
      case "oMathPara":
      case "oMath":
        return convertChildren(node, opts);

      /* ---- property blocks are metadata, never rendered ---- */
      case "fPr": case "radPr": case "sSupPr": case "sSubPr": case "sSubSupPr":
      case "naryPr": case "dPr": case "funcPr": case "mPr": case "barPr":
      case "accPr": case "groupChrPr": case "limLowPr": case "limUppPr":
      case "eqArrPr": case "boxPr": case "borderBoxPr": case "phantPr":
      case "sPrePr": case "mcPr": case "mprPr": case "argPr": case "ctrlPr":
      case "rPr":
        return "";

      /* ---- run ---- */
      case "r": {
        var rPr = kid(node, "rPr");
        var isNormal = rPr && kid(rPr, "nor");
        var txt = kids(node, "t").map(textOf).join("");
        if (!txt) txt = textOf(node);
        if (!txt) return "";
        if (isNormal) return "<mtext>" + esc(keepEdgeSpaces(txt)) + "</mtext>";
        return tokenizeRunText(txt, opts);
      }
      case "t":
        return tokenizeRunText(textOf(node), opts);

      /* ---- fraction ---- */
      case "f": {
        var type = mval(kid(node, "fPr"), "type") || "bar";
        var num = slot(kid(node, "num"), opts);
        var den = slot(kid(node, "den"), opts);
        if (type === "lin") return "<mrow>" + num + "<mo>/</mo>" + den + "</mrow>";
        if (type === "skw")
          return '<mfrac bevelled="true">' + num + den + "</mfrac>";
        if (type === "noBar")
          return '<mfrac linethickness="0">' + num + den + "</mfrac>";
        return "<mfrac>" + num + den + "</mfrac>";
      }

      /* ---- radical ---- */
      case "rad": {
        var radPr = kid(node, "radPr");
        var degHide = mval(radPr, "degHide");
        var deg = kid(node, "deg");
        var body = slot(kid(node, "e"), opts);
        var hidden = degHide === "1" || degHide === "on" || degHide === "true" ||
          !deg || !convertChildren(deg, opts);
        if (hidden) return "<msqrt>" + body + "</msqrt>";
        return "<mroot>" + body + slot(deg, opts) + "</mroot>";
      }

      /* ---- scripts ---- */
      case "sSup":
        return "<msup>" + slot(kid(node, "e"), opts) + slot(kid(node, "sup"), opts) + "</msup>";
      case "sSub":
        return "<msub>" + slot(kid(node, "e"), opts) + slot(kid(node, "sub"), opts) + "</msub>";
      case "sSubSup":
        return "<msubsup>" + slot(kid(node, "e"), opts) + slot(kid(node, "sub"), opts) +
          slot(kid(node, "sup"), opts) + "</msubsup>";
      case "sPre":
        return "<mmultiscripts>" + slot(kid(node, "e"), opts) + "<mprescripts/>" +
          slot(kid(node, "sub"), opts) + slot(kid(node, "sup"), opts) + "</mmultiscripts>";

      /* ---- n-ary (sum, integral, product) ---- */
      case "nary": {
        var np = kid(node, "naryPr");
        var chr = mval(np, "chr") || "\u222b";
        var limLoc = mval(np, "limLoc") || "subSup";
        var subHide = mval(np, "subHide") === "1";
        var supHide = mval(np, "supHide") === "1";
        var sub = subHide ? null : kid(node, "sub");
        var sup = supHide ? null : kid(node, "sup");
        var op = '<mo largeop="true">' + esc(chr) + "</mo>";
        var scripted;
        if (!sub && !sup) scripted = op;
        else if (limLoc === "undOvr") {
          if (sub && sup) scripted = "<munderover>" + op + slot(sub, opts) + slot(sup, opts) + "</munderover>";
          else if (sub) scripted = "<munder>" + op + slot(sub, opts) + "</munder>";
          else scripted = "<mover>" + op + slot(sup, opts) + "</mover>";
        } else {
          if (sub && sup) scripted = "<msubsup>" + op + slot(sub, opts) + slot(sup, opts) + "</msubsup>";
          else if (sub) scripted = "<msub>" + op + slot(sub, opts) + "</msub>";
          else scripted = "<msup>" + op + slot(sup, opts) + "</msup>";
        }
        return "<mrow>" + scripted + slot(kid(node, "e"), opts) + "</mrow>";
      }

      /* ---- delimiter ---- */
      case "d": {
        var dPr = kid(node, "dPr");
        var beg = mval(dPr, "begChr");
        var end = mval(dPr, "endChr");
        var sep = mval(dPr, "sepChr");
        if (beg === null) beg = "(";
        if (end === null) end = ")";
        if (sep === null) sep = "|";
        var es = kids(node, "e");
        var parts = [];
        if (beg !== "") parts.push('<mo fence="true" stretchy="true">' + esc(beg) + "</mo>");
        for (var q = 0; q < es.length; q++) {
          if (q > 0 && sep !== "") parts.push('<mo separator="true">' + esc(sep) + "</mo>");
          parts.push(slot(es[q], opts));
        }
        if (end !== "") parts.push('<mo fence="true" stretchy="true">' + esc(end) + "</mo>");
        return "<mrow>" + parts.join("") + "</mrow>";
      }

      /* ---- function apply ---- */
      case "func":
        return "<mrow>" + slot(kid(node, "fName"), opts) +
          '<mo>\u2061</mo>' + slot(kid(node, "e"), opts) + "</mrow>";

      /* ---- limits ---- */
      case "limLow":
        return "<munder>" + slot(kid(node, "e"), opts) + slot(kid(node, "lim"), opts) + "</munder>";
      case "limUpp":
        return "<mover>" + slot(kid(node, "e"), opts) + slot(kid(node, "lim"), opts) + "</mover>";

      /* ---- bar / accent / grouping char ---- */
      case "bar": {
        var pos = mval(kid(node, "barPr"), "pos") || "bot";
        var b = slot(kid(node, "e"), opts);
        return pos === "top"
          ? "<mover>" + b + '<mo stretchy="true">\u00af</mo></mover>'
          : "<munder>" + b + '<mo stretchy="true">\u005f</mo></munder>';
      }
      case "acc": {
        var accChr = mval(kid(node, "accPr"), "chr") || "\u0302";
        return "<mover>" + slot(kid(node, "e"), opts) + "<mo>" + esc(accChr) + "</mo></mover>";
      }
      case "groupChr": {
        var gp = kid(node, "groupChrPr");
        var gchr = mval(gp, "chr") || "\u23df";
        var vertJc = mval(gp, "vertJc") || "bot";
        var g = slot(kid(node, "e"), opts);
        return vertJc === "top"
          ? "<mover>" + g + '<mo stretchy="true">' + esc(gchr) + "</mo></mover>"
          : "<munder>" + g + '<mo stretchy="true">' + esc(gchr) + "</mo></munder>";
      }

      /* ---- matrix ---- */
      case "m": {
        var rows = kids(node, "mr").map(function (r) {
          return "<mtr>" + kids(r, "e").map(function (c) {
            return "<mtd>" + convertChildren(c, opts) + "</mtd>";
          }).join("") + "</mtr>";
        }).join("");
        return "<mtable>" + rows + "</mtable>";
      }

      /* ---- equation array ---- */
      case "eqArr": {

        ctx.beginPath();

        ctx.globalAlpha = 0.85;
        ctx.fill();
        ctx.restore();

        { size: 13, col: "#EAF4F2", font: "marker" });

  /* =====================================================================
     FACTOR RECTANGLES  ·  every factor pair of n, drawn as an array
     ===================================================================== */
  function factorRects(ctx, o) {
    var n = o.n, pairs = o.pairs, active = o.active;
    var x = o.x, y = o.y, w = o.w, h = o.h;
    var cell = o.cell || 9, gap = 1.5;
    var slot = w / pairs.length;
    for (var i = 0; i < pairs.length; i++) {
      var p = pairs[i];
      var on = active == null || i <= active;
      var live = i === active;
      var aw = p[1] * (cell + gap), ah = p[0] * (cell + gap);
      var cx = x + slot * i + slot / 2 - aw / 2;
      var cy = y + h / 2 - ah / 2;
      ctx.save();
      ctx.globalAlpha = on ? 1 : 0.13;
      for (var r = 0; r < p[0]; r++) {
        for (var c = 0; c < p[1]; c++) {
          rr(ctx, cx + c * (cell + gap), cy + r * (cell + gap), cell, cell, 2);
          ctx.fillStyle = live ? "#C9A227" : "#2D70B3";
          ctx.globalAlpha = on ? (live ? 0.85 : 0.7) : 0.13;
          ctx.fill();
        }
      }
      ctx.restore();
      txt(ctx, p[0] + " \u00d7 " + p[1], x + slot * i + slot / 2, y + h + 20,
        { size: 13, col: on ? (live ? "#C9A227" : "#EAF4F2") : "rgba(234,244,242,.25)", font: "marker" });
    }
  }

  /* =====================================================================
     NUMBER GRID  ·  1..n laid out in rows, with highlighted sets
     sets: [{ nums:[], col }]  — later sets draw over earlier ones
     ===================================================================== */
  function numberGrid(ctx, o) {
    var n = o.n || 100, cols = o.cols || 10;
    var x = o.x, y = o.y, w = o.w;
    var sets = o.sets || [];
    var cw = w / cols, ch = o.ch || cw * 0.72;
    for (var k = 1; k <= n; k++) {
      var r = Math.floor((k - 1) / cols), c = (k - 1) % cols;
      var cx = x + c * cw, cy = y + r * ch;
      var fill = null, ring = null;
      for (var s = 0; s < sets.length; s++) {
        if (sets[s].nums.indexOf(k) !== -1) {
          if (sets[s].ring) ring = sets[s].col; else fill = sets[s].col;
        }
      }
      ctx.save();
      rr(ctx, cx + 1, cy + 1, cw - 2, ch - 2, 3);
      ctx.fillStyle = fill || "rgba(234,244,242,.05)";
      ctx.globalAlpha = fill ? 0.75 : 1;
      ctx.fill();
      if (ring) {
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ring; ctx.lineWidth = 1.8; ctx.stroke();
      }
      ctx.restore();
      txt(ctx, String(k), cx + cw / 2, cy + ch / 2,
        { size: Math.min(11, ch * 0.42), col: fill ? "#0B1F24" : "rgba(234,244,242,.6)",
          font: "mono", weight: 700 });
    }
  }


  /* =====================================================================
     FRACTION BAR  ·  a whole cut into `den` parts, `num` of them shaded.
     `split` cuts every part into that many pieces — the equivalence move.
     ===================================================================== */
  function fracBar(ctx, o) {
    var x = o.x, y = o.y, w = o.w, h = o.h || 52;
    var den = o.den, num = o.num;
    var split = o.split || 1;
    var prog = o.prog == null ? 1 : o.prog;
    var col = o.col || "#2D70B3";
    var pw = w / den;

    /* shaded region first, so the grid sits on top */
    var shadeW = (num / den) * w * Math.min(1, prog * 1.2);
    ctx.save();
    rr(ctx, x, y, w, h, 7);
    ctx.fillStyle = "rgba(234,244,242,.06)";
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    rr(ctx, x, y, w, h, 7);
    ctx.clip();
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.72;
    ctx.fillRect(x, y, shadeW, h);
    ctx.restore();
    ctx.restore();

    /* the original cuts */
    for (var i = 1; i < den; i++) {
      ctx.save();
      ctx.strokeStyle = "rgba(234,244,242,.75)";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x + i * pw, y + 2);
      ctx.lineTo(x + i * pw, y + h - 2);
      ctx.stroke();
      ctx.restore();

    /* the extra cuts from splitting */
    if (split > 1) {
      var sp = at(prog, 0.35, 1);
      for (var j = 0; j < den; j++) {
        for (var k = 1; k < split; k++) {
          ctx.save();
          ctx.globalAlpha = sp;
          ctx.strokeStyle = "#C9A227";
          ctx.lineWidth = 1.2;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(x + j * pw + (k * pw) / split, y + 4);
          ctx.lineTo(x + j * pw + (k * pw) / split, y + h - 4);
          ctx.stroke();
          ctx.restore();
        }
      }
    }
    ctx.save();
    rr(ctx, x, y, w, h, 7);
    ctx.strokeStyle = "rgba(234,244,242,.85)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

    if (o.label !== false) {
      txt(ctx, (num * split) + " / " + (den * split), x + w / 2, y + h + 22,
        { size: 15, col: split > 1 ? "#C9A227" : "#EAF4F2", font: "marker" });
    }
    return { shadeW: shadeW, pw: pw };
  }

  /* =====================================================================
     FRACTION NUMBER LINE  ·  0..whole, cut into `den`, points marked
     marks: [{ n, den, label, col }]
     ===================================================================== */
  function fracLine(ctx, o) {
    var x = o.x, y = o.y, w = o.w;
    var den = o.den, whole = o.whole || 1;
    var prog = o.prog == null ? 1 : o.prog;
    marker(ctx, [[x, y], [x + w, y]], prog, "rgba(234,244,242,.8)", 2.2);
    if (prog < 0.3) return function (n, d) { return x + (n / d / whole) * w; };

    var px = function (n, d) { return x + (n / d / whole) * w; };
    var total = den * whole;
    for (var i = 0; i <= total; i++) {
      var big = i % den === 0;
      var tx = px(i, den);
      ctx.save();
      ctx.strokeStyle = big ? "rgba(234,244,242,.85)" : "rgba(234,244,242,.4)";
      ctx.lineWidth = big ? 2.2 : 1.3;
      ctx.beginPath();
      ctx.moveTo(tx, y - (big ? 12 : 7));
      ctx.lineTo(tx, y + (big ? 12 : 7));
      ctx.stroke();
      ctx.restore();
      if (big && o.bigLabels !== false) txt(ctx, String(i / den), tx, y + 30, { size: 13, col: "#EAF4F2", font: "marker" });
      else if (o.labelAll) txt(ctx, i + "/" + den, tx, y + 26,
        { size: 9.5, col: "rgba(234,244,242,.5)", font: "mono", weight: 600 });
    }

    (o.marks || []).forEach(function (m, k) {
      var a = at(prog, 0.5 + k * 0.12, 0.5 + k * 0.12 + 0.4);
      if (a <= 0) return;
      var mx = px(m.n, m.den);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(mx, y, 7, 0, Math.PI * 2);
      ctx.fillStyle = m.col || "#C9A227";
      ctx.fill();
      ctx.restore();
      txt(ctx, m.label || (m.n + "/" + m.den), mx, y - 26 - (m.up ? 22 : 0),
        { size: 14, col: m.col || "#C9A227", font: "marker", alpha: a });
    });

  }


  /* =====================================================================
     MIXED BAR  ·  several wholes side by side, each cut into `den`.
     `num` is the TOTAL number of pieces shaded across all the wholes.
     ===================================================================== */
  function mixedBar(ctx, o) {
    var wholes = o.wholes, den = o.den, num = o.num;
    var x = o.x, y = o.y, w = o.w, h = o.h || 46;
    var gap = o.gap == null ? 10 : o.gap;
    var prog = o.prog == null ? 1 : o.prog;
    var ww = (w - gap * (wholes - 1)) / wholes;
    var left = num;
    for (var k = 0; k < wholes; k++) {
      var gx = x + k * (ww + gap);
      var fill = Math.max(0, Math.min(den, left));
      left -= fill;
      var a = at(prog, k / wholes, k / wholes + 0.6);
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = a;
      rr(ctx, gx, y, ww, h, 6);
      ctx.fillStyle = "rgba(234,244,242,.06)";
      ctx.fill();
      ctx.save();
      ctx.beginPath(); rr(ctx, gx, y, ww, h, 6); ctx.clip();
      ctx.fillStyle = o.col || "#2D70B3";
      ctx.globalAlpha = a * 0.72;
      ctx.fillRect(gx, y, (fill / den) * ww, h);
      ctx.restore();
      for (var i = 1; i < den; i++) {
        ctx.strokeStyle = "rgba(234,244,242,.6)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(gx + (i * ww) / den, y + 2);
        ctx.lineTo(gx + (i * ww) / den, y + h - 2);
        ctx.stroke();
      }
      rr(ctx, gx, y, ww, h, 6);
      ctx.strokeStyle = "rgba(234,244,242,.85)";
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();

  /* =====================================================================
     CLOCK  ·  an analogue face. `h` and `m` are the time; `prog` sweeps the
     minute hand in from 12 so the hands are drawn, never printed.
     ===================================================================== */
  function clock(ctx, o) {
    var cx = o.cx, cy = o.cy, r = o.r || 62;
    var prog = o.prog == null ? 1 : o.prog;
    var col = o.col || "#EAF4F2";
    var hh = o.h % 12, mm = o.m;

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(234,244,242,.05)";
    ctx.fill();
    ctx.strokeStyle = col;
    ctx.globalAlpha = Math.min(1, prog * 3);
    ctx.lineWidth = 2.4;
    ctx.stroke();
    ctx.restore();

    /* minute ticks then the twelve numerals */
    for (var t = 0; t < 60; t++) {
      var a0 = (t / 60) * Math.PI * 2 - Math.PI / 2;
      var big = t % 5 === 0;
      ctx.save();
      ctx.globalAlpha = Math.min(1, prog * 3) * (big ? 0.85 : 0.35);
      ctx.strokeStyle = col;
      ctx.lineWidth = big ? 2 : 1;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * (r - (big ? 11 : 6)), cy + Math.sin(a0) * (r - (big ? 11 : 6)));
      ctx.lineTo(cx + Math.cos(a0) * (r - 2), cy + Math.sin(a0) * (r - 2));
      ctx.stroke();
      ctx.restore();
    }
    if (o.numerals !== false) {
      for (var n = 1; n <= 12; n++) {
        var an = (n / 12) * Math.PI * 2 - Math.PI / 2;
        txt(ctx, String(n), cx + Math.cos(an) * (r - 22), cy + Math.sin(an) * (r - 22),
          { size: Math.max(9, r * 0.19), col: "rgba(234,244,242,.7)", font: "mono", weight: 700,
            alpha: at(prog, 0.1, 0.4) });
      }
    }

    /* the hands: minute sweeps first, hour follows it round */
    var sweep = at(prog, 0.35, 1);
    var mAng = (mm / 60) * sweep * Math.PI * 2 - Math.PI / 2;
    var hAng = ((hh + (mm / 60) * sweep) / 12) * Math.PI * 2 - Math.PI / 2;
    if (sweep > 0) {
      marker(ctx, [[cx, cy], [cx + Math.cos(hAng) * r * 0.52, cy + Math.sin(hAng) * r * 0.52]],
        1, o.hourCol || "#C9A227", 4.4);
      marker(ctx, [[cx, cy], [cx + Math.cos(mAng) * r * 0.78, cy + Math.sin(mAng) * r * 0.78]],
        1, o.minCol || "#2D70B3", 2.8);
    }
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = "#C9A227";
    ctx.globalAlpha = Math.min(1, prog * 3);
    ctx.fill();
    ctx.restore();

    if (o.label) {
      txt(ctx, o.label, cx, cy + r + 20,
        { size: 14, col: o.labelCol || "#C9A227", font: "marker", alpha: at(prog, 0.6, 1) });
    }
    if (o.caption) {
      txt(ctx, o.caption, cx, cy + r + 38,
        { size: 11, col: "rgba(234,244,242,.6)", font: "marker", alpha: at(prog, 0.7, 1) });
    }
    return { cx: cx, cy: cy, r: r };
  }

  /* =====================================================================
     TIME LINE  ·  an open number line for elapsed time.
     stops: [{ label, mins }] in order; hops are drawn between them with the
     number of minutes written over the arc.
     ===================================================================== */
  function timeLine(ctx, o) {
    var x = o.x, y = o.y, w = o.w;
    var stops = o.stops || [];
    var prog = o.prog == null ? 1 : o.prog;
    var lo = stops[0].mins, hi = stops[stops.length - 1].mins;
    var span = Math.max(1, hi - lo);
    var px = function (m) { return x + ((m - lo) / span) * w; };

    marker(ctx, [[x, y], [x + w, y]], Math.min(1, prog * 2.2), "rgba(234,244,242,.8)", 2.2);

    for (var i = 0; i < stops.length; i++) {
      var a = at(prog, 0.15 + (i / stops.length) * 0.5, 0.45 + (i / stops.length) * 0.5);
      if (a <= 0) continue;
      var tx = px(stops[i].mins);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.strokeStyle = stops[i].col || "#EAF4F2";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(tx, y - 10); ctx.lineTo(tx, y + 10);
      ctx.stroke();
      ctx.restore();
      txt(ctx, stops[i].label, tx, y + 28,
        { size: 12.5, col: stops[i].col || "#EAF4F2", font: "marker", alpha: a });
      if (stops[i].sub) {
        txt(ctx, stops[i].sub, tx, y + 45,
          { size: 10, col: "rgba(234,244,242,.55)", font: "mono", weight: 600, alpha: a });
      }
    }

    /* the hops */
    for (var k = 0; k + 1 < stops.length; k++) {
      var ha = at(prog, 0.4 + (k / stops.length) * 0.5, 0.7 + (k / stops.length) * 0.5);
      if (ha <= 0 || stops[k + 1].ghost) continue;
      var x1 = px(stops[k].mins), x2 = px(stops[k + 1].mins);
      var pts = [];
      for (var s = 0; s <= 18; s++) {
        var t = s / 18;

      }
      marker(ctx, pts, ha, stops[k + 1].hopCol || "#388C46", 2.2);
      var gap = stops[k + 1].mins - stops[k].mins;
      txt(ctx, (stops[k + 1].hopLabel || (gap + " min")), (x1 + x2) / 2, y - (o.hop || 32) - 12,
        { size: 12.5, col: stops[k + 1].hopCol || "#388C46", font: "marker", alpha: ha });
    }

    if (o.total) {
      var ta = at(prog, 0.86, 1);
      marker(ctx, [[x, y + 62], [x, y + 70], [x + w, y + 70], [x + w, y + 62]], ta, "rgba(201,162,39,.75)", 1.8);
      txt(ctx, o.total, x + w / 2, y + 86, { size: 15, col: "#C9A227", font: "marker", alpha: ta });
    }
    return px;
  }

  /* =====================================================================
     LINE PLOT  ·  a horizontal scale in fractional units with marks stacked
     above each tick.  counts is an object keyed by the numerator over `den`.
     e.g. { 0:2, 1:0, 2:3, 4:1 } on den 4 means 0, 2/4 and 1 whole.
     ===================================================================== */
  function linePlot(ctx, o) {
    var x = o.x, y = o.y, w = o.w;
    var den = o.den, max = o.max;            /* max is in units of 1/den */
    var prog = o.prog == null ? 1 : o.prog;
    var counts = o.counts || {};
    var col = o.col || "#2D70B3";
    var step = w / max;
    var px = function (n) { return x + (n / max) * w; };

    marker(ctx, [[x - 14, y], [x + w + 14, y]], Math.min(1, prog * 2.4), "rgba(234,244,242,.8)", 2.2);
    if (prog < 0.18) return px;

    /* ticks and fraction labels */
    for (var i = 0; i <= max; i++) {
      var big = i % den === 0;
      var tx = px(i);
      ctx.save();
      ctx.strokeStyle = big ? "rgba(234,244,242,.85)" : "rgba(234,244,242,.45)";
      ctx.lineWidth = big ? 2.2 : 1.3;
      ctx.beginPath();
      ctx.moveTo(tx, y - (big ? 9 : 5));
      ctx.lineTo(tx, y + (big ? 9 : 5));
      ctx.stroke();
      ctx.restore();
      var lab = o.labels ? o.labels[i]
        : (big ? String(i / den) : (o.labelAll === false ? null : (i % den) + "/" + den));
      if (lab) {
        txt(ctx, lab, tx, y + (big ? 26 : 23),
          { size: big ? 13 : 10, col: big ? "#EAF4F2" : "rgba(234,244,242,.6)",
            font: big ? "marker" : "mono", weight: 600 });
      }
    }
    if (o.axisLabel) {
      txt(ctx, o.axisLabel, x + w / 2, y + 48,
        { size: 12, col: "#C9A227", font: "marker", alpha: at(prog, 0.6, 1) });
    }

    /* the stacked marks — drawn as crosses, one per data point */
    var gapY = o.gapY || 17;
    var r = o.r || 5.4;
    var keys = Object.keys(counts);
    var total = 0;
    for (var q = 0; q < keys.length; q++) total += counts[keys[q]];
    var drawn = 0;
    for (var k = 0; k < keys.length; k++) {
      var n = +keys[k], c = counts[keys[k]];
      var cx = px(n);
      for (var m = 0; m < c; m++) {
        var a = at(prog, 0.25 + (drawn / Math.max(1, total)) * 0.6,
                         0.45 + (drawn / Math.max(1, total)) * 0.6);
        drawn++;
        if (a <= 0) continue;
        var cy = y - 16 - m * gapY;
        var hot = o.highlight != null && o.highlight === n;
        var c2 = hot ? (o.highlightCol || "#C9A227") : col;
        marker(ctx, [[cx - r, cy - r], [cx + r, cy + r]], a, c2, 2.2);
        marker(ctx, [[cx + r, cy - r], [cx - r, cy + r]], a, c2, 2.2);
      }
      if (c > 0 && o.showCounts) {
        txt(ctx, String(c), cx, y - 22 - c * gapY,
          { size: 11, col: "rgba(234,244,242,.6)", font: "mono", weight: 700,
            alpha: at(prog, 0.8, 1) });
      }
    }
    if (o.title) {
      txt(ctx, o.title, x + w / 2, o.titleY == null ? 20 : o.titleY,
        { size: 13, col: "#C9A227", font: "marker", alpha: Math.min(1, prog * 3) });
    }
    return px;
  }

  /* =====================================================================
     DECIMAL GRID  ·  a unit square cut into 10 strips or 100 small squares,
     with `shaded` hundredths filled.  The workhorse for Topic 12.
     ===================================================================== */
  function decGrid(ctx, o) {
    var x = o.x, y = o.y, s = o.s || 120;
    var tenths = o.tenths === true;          /* 10 strips instead of 100 cells */
    var shaded = o.shaded || 0;              /* always in hundredths */
    var prog = o.prog == null ? 1 : o.prog;
    var col = o.col || "#2D70B3";
    var n = tenths ? 10 : 100;
    var per = tenths ? 10 : 1;               /* hundredths per cell */
    var cells = Math.round(shaded / per);
    var cols = tenths ? 10 : 10;
    var rows = tenths ? 1 : 10;
    var cw = s / cols, ch = s / rows;

    ctx.save();
    rr(ctx, x, y, s, s, 6);
    ctx.fillStyle = "rgba(234,244,242,.05)";
    ctx.fill();
    ctx.restore();

    var shown = Math.round(cells * Math.min(1, prog * 1.15));
    for (var i = 0; i < shown; i++) {
      /* fill column by column so a full column IS one tenth-strip,
         matching the orientation of the tenths grid exactly */
      var c = tenths ? i : Math.floor(i / 10);
      var r2 = tenths ? 0 : i % 10;
      ctx.save();
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * cw + 0.5, y + r2 * ch + 0.5, cw - 1, ch - 1);
      ctx.restore();
    }
    /* grid lines: thin for hundredths, thick every tenth */
    for (var g = 1; g < cols; g++) {
      ctx.save();
      ctx.strokeStyle = "rgba(234,244,242,.55)";
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x + g * cw, y); ctx.lineTo(x + g * cw, y + s); ctx.stroke();
      ctx.restore();
    }
    if (!tenths) {
      for (var h = 1; h < rows; h++) {
        ctx.save();
        ctx.strokeStyle = "rgba(234,244,242,.35)";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y + h * ch); ctx.lineTo(x + s, y + h * ch); ctx.stroke();
        ctx.restore();
      }
    }
    ctx.save();
    rr(ctx, x, y, s, s, 6);
    ctx.strokeStyle = "rgba(234,244,242,.85)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();

                [ox + ey[0] + ex[0], oy + ey[1] + ex[1] + s], [ox + ey[0], oy + ey[1] + s]],
            shade(base, 0.62));
          /* right face (along the length) */
          face([[ox + ex[0], oy + ex[1]], [ox + ex[0] + ey[0], oy + ex[1] + ey[1]],
                [ox + ex[0] + ey[0], oy + ex[1] + ey[1] + s], [ox + ex[0], oy + ex[1] + s]],
            shade(base, 0.86));

      txt(ctx, o.lLabel == null ? String(L) : o.lLabel,
        x + (L / 2) * ex[0] + 30, y + (L / 2) * ex[1] - 24,

        { size: 13, col: "#C9A227", font: "marker", alpha: la });

        x + L * ex[0] + W * ey[0] + 26, y + L * ex[1] + W * ey[1] + (s * H) / 2,

        { size: 15, col: "#34D399", font: "marker", alpha: at(prog, 0.75, 1) });
    }
    return { shown: Math.min(shown, total), total: total };

/* --- THE ONLY WAY MATH IS ALLOWED ON SCREEN: OMML in, MathML out ---------

function MathEl({ omml, display, size, alt, style }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    window.DAFMath.render(ref.current, omml, {
      display: display === "block" ? "block" : "inline"
    });
    /* MathML never wraps, so a long sentence set as math would silently run off
       the panel. Shrink it until it fits, once layout has settled. */
    const host = ref.current;
    const id = requestAnimationFrame(() => {
      const m = host.querySelector("math");
      if (!m) return;
      m.style.fontSize = "";
      const avail = host.getBoundingClientRect().width;
      if (!avail) return;
      let px = parseFloat(window.getComputedStyle(m).fontSize) || 24;
      let guard = 0;
      /* a block-level <math> is stretched to the container, so overflow shows up
         as scrollWidth, not as a wider bounding box */
      while (m.scrollWidth > avail - 2 && px > 13 && guard++ < 24) {
        px -= 1.5;
        m.style.fontSize = px + "px";
      }
    });
    return () => cancelAnimationFrame(id);
  }, [omml, display]);
  return (
    <span
      ref={ref}
      role="math"
      aria-label={alt || undefined}
      className={(display === "block" ? "math-block " : "math-inline ") + "math-" + (size || "md")}
      style={style}
    />
  );

/* --- canvas host: fit + phase-gated loop, cleaned up on unmount ---------- */
function Sketch({ draw, height, style }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv || !cv.getContext) return;
    let st;
    try { st = D.fit(cv); } catch (e) { return; }
    const stop = D.loop((frame) => {
      if (!st.W || !st.H) return;
      st.ctx.clearRect(0, 0, st.W, st.H);
      draw(st.ctx, st.W, st.H, frame);
    });
    return () => { stop(); if (st.destroy) st.destroy(); };
  }, [draw]);
  return (
    <canvas
      ref={ref}
      style={Object.assign({ width: "100%", height: (height || 300) + "px", display: "block" }, style || {})}
    />
  );
}

function XPBar({ xp, max }) {

/* ===========================================================================
   THE XP ECONOMY
   Every value here is published to the students. Nothing is earned by clicking:

const XP = {

  commit:       5,    /* the class commits on the sort . once per lesson  */

  hardCorrect:  25,   /* harder question, right ........ on top of the 15 */

const BADGES = [

function badgeTier(b, stats) {

/* what a running XP total is currently worth, from roster.json */
function xpWorth(xp) {
  const R = (window.DAF_ROSTER || {});
  const tiers = R.markTiers || [];
  let marks = 0;
  for (let i = 0; i < tiers.length; i++) if (xp >= tiers[i].xp) marks = tiers[i].marks;
  const privs = (R.privileges || []).filter((p) => xp >= p.xp);
  const next = (R.privileges || []).find((p) => xp < p.xp);
  return { marks: marks, unlocked: privs, next: next };
}

/* ===========================================================================
   GAME STORE  ·  board mode — one deck on the projector, the whole class in it
   =========================================================================== */
const BLANK = { xp: 0, estimates: 0, commits: 0, correct: 0, hard: 0, hardOk: 0, sijill: 0,
                plus: 0, minus: 0 };

function freshGame() {
  return { section: null, confirmed: false, present: {}, s: {},
           classXp: 0, flash: null, t0: Date.now(), sijillNames: {}, log: [] };
}

/* Paste a class list in any shape a teacher already has it: one per line, comma
   separated, tab separated from a spreadsheet, or a numbered list. */
function parseNames(text) {
  const out = [], seen = {};
  String(text || "")
    .split(/[\n\r,;\t]+/)
    .forEach((raw) => {
      const n = raw.replace(/^\s*\d+\s*[.)\-:]\s*/, "").replace(/^[\-\u2022*]\s*/, "")
                   .replace(/\s+/g, " ").trim();
      if (!n) return;
      const k = n.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1;
      out.push(n);
    });
  return out;
}

function gameReducer(g, a) {
  switch (a.type) {
    case "section": {
      const names = ((window.DAF_ROSTER || {}).sections || {})[a.section] || [];
      const present = {}, s = {};
      names.forEach((n) => { present[n] = true; s[n] = Object.assign({}, BLANK); });
      return Object.assign({}, g, { section: a.section, present: present, s: s,
                                    confirmed: true, t0: Date.now() });
    }
    /* a class typed or pasted in at the gate — same shape, no roster.json entry.
       The lesson starts at once; attendance is a toggle inside the dojo screen. */
    case "roster": {
      const present = {}, s = {};
      (a.names || []).forEach((n) => { present[n] = true; s[n] = Object.assign({}, BLANK); });
      return Object.assign({}, g, { section: a.section || "Class", present: present, s: s,
                                    confirmed: true, t0: Date.now() });
    }
    case "presence": {
      const present = Object.assign({}, g.present);
      present[a.name] = !present[a.name];
      return Object.assign({}, g, { present: present });
    }
    case "confirm": return Object.assign({}, g, { confirmed: true, t0: Date.now() });
    case "addStudent": {
      const n = String(a.name || "").trim();
      if (!n || g.s[n]) return g;
      const s = Object.assign({}, g.s); s[n] = Object.assign({}, BLANK);
      const present = Object.assign({}, g.present); present[n] = true;
      return Object.assign({}, g, { s: s, present: present });
    }
    case "grant": {
      const s = Object.assign({}, g.s);
      let added = 0;
      const names = (a.names || []).filter((n) => s[n] || g.present[n]);
      names.forEach((n) => {
        const cur = Object.assign({}, s[n] || BLANK);
        cur.xp += a.amount;
        if (a.amount >= 0) cur.plus = (cur.plus || 0) + a.amount;
        else cur.minus = (cur.minus || 0) - a.amount;
        /* a metric only ever counts up: taking points back does not un-count
           an estimate that was actually locked */
        if (a.metric && a.amount > 0) cur[a.metric] = (cur[a.metric] || 0) + 1;
        s[n] = cur;
        added += a.amount;
      });
      if (!names.length) return g;
      const entry = { id: (g.log.length ? g.log[g.log.length - 1].id : 0) + 1,
                      at: Date.now(), names: names, amount: a.amount,
                      metric: a.metric || "", reason: a.reason || a.text || "" };
      return Object.assign({}, g, {
        s: s, classXp: g.classXp + added, flash: a.text || null,
        log: g.log.concat([entry])
      });
    }
    /* ClassDojo-style undo — the last thing you tapped comes straight back off */
    case "undo": {
      if (!g.log.length) return g;
      const last = g.log[g.log.length - 1];
      const s = Object.assign({}, g.s);
      last.names.forEach((n) => {
        const cur = Object.assign({}, s[n] || BLANK);
        cur.xp -= last.amount;
        if (last.amount >= 0) cur.plus = Math.max(0, (cur.plus || 0) - last.amount);
        else cur.minus = Math.max(0, (cur.minus || 0) + last.amount);
        if (last.metric && last.amount > 0) cur[last.metric] = Math.max(0, (cur[last.metric] || 0) - 1);
        s[n] = cur;
      });
      return Object.assign({}, g, {
        s: s, classXp: g.classXp - last.amount * last.names.length,
        log: g.log.slice(0, -1),
        flash: "Undone \u00b7 " + (last.reason || (last.amount + " XP"))
      });
    }
    case "sijill": {
      const sn = Object.assign({}, g.sijillNames);
      sn[a.slot] = a.name;
      return Object.assign({}, g, { sijillNames: sn });
    }
    case "clearFlash": return Object.assign({}, g, { flash: null });
    case "load": return Object.assign({}, g, a.state);
    case "reset": return freshGame();
    default: return g;
  }
}

/* ---- Warm-Up · Which one doesn't belong --------------------------------- */

/* ---- Monitor · card sort ------------------------------------------------- */
/* items: [{id, omml?|text?, target}]   targets: [{id, label, draw?, h?}]      */
function CardSort({ items, targets, award, columns, commitLabel }) {
  const [sel, setSel] = useState(null);
  const [pairs, setPairs] = useState({});
  const [committed, setCommitted] = useState(false);
  const place = (tid) => {
    if (!sel || committed) return;
    setPairs((p) => Object.assign({}, p, { [sel]: tid }));
    setSel(null);
  };
  const allPlaced = Object.keys(pairs).length === items.length;
  return (
    <div className="glass-panel" style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
      <div style={{ display: "flex", gap: "9px", justifyContent: "center", flexWrap: "wrap" }}>
        {items.map((it) => {
          const placed = pairs[it.id];
          return (
            <div key={it.id} onClick={() => !committed && !placed && setSel(it.id)}
              className={"glass-card" + (sel === it.id ? " chosen" : "")}
              style={{ padding: "9px 16px", opacity: placed ? 0.32 : 1 }}>
              {it.omml ? <MathEl omml={it.omml} size="lg" />
                       : <span className="mono" style={{ fontSize: "16px", fontWeight: 700 }}>{it.text}</span>}
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(" + (columns || targets.length) + ", 1fr)", gap: "9px" }}>
        {targets.map((t) => {
          const owner = Object.keys(pairs).find((k) => pairs[k] === t.id);
          const item = items.find((i) => i.id === owner);
          const right = item && item.target === t.id;
          return (
            <div key={t.id} onClick={() => place(t.id)} className="glass-card"
              style={{
                minHeight: "132px", display: "flex", flexDirection: "column", alignItems: "center",
                justifyContent: "center", gap: "6px", textAlign: "center",
                borderColor: committed && owner ? (right ? "var(--ok)" : "var(--warn)") : undefined,
                borderWidth: committed && owner ? "2px" : "1px"
              }}>
              {t.draw && <Sketch draw={t.draw} height={t.h || 74} />}
              {t.omml && <MathEl omml={t.omml} size="xl" />}
              <div style={{ fontSize: "10.5px", color: "var(--daf-ink-2)", fontWeight: 700, lineHeight: 1.35 }}>{t.label}</div>
              {owner && (item.omml
                ? <MathEl omml={item.omml} size="md" />
                : <span className="mono" style={{ fontSize: "13px", fontWeight: 700, color: "var(--c)" }}>{item.text}</span>)}
              {committed && owner && (
                <div style={{ fontSize: "10.5px", fontWeight: 900, color: right ? "var(--ok)" : "var(--warn)" }}>
                  {right ? "matched" : "not yet — check the place value"}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ textAlign: "center" }}>
        <button className="btn btn-primary" disabled={!allPlaced || committed}
          style={{ opacity: !allPlaced || committed ? 0.45 : 1 }}
          onClick={() => { setCommitted(true); award(XP.commit, "commits", "the class committed", "class"); }}>
          <Icon name="fa-check-double" /> {commitLabel || "The class is ready — check"}
        </button>
        {!committed && (
          <div style={{ fontSize: "10.5px", color: "var(--daf-ink-2)", marginTop: "7px" }}>
            No grading until the class commits.
          </div>
        )}
      </div>
    </div>
  );
}

function ShowWhatYouKnow({ prompt, draw, height, omml, options, right, support, award, hard }) {
  const [revealed, setRevealed] = useState(false);
  const [pick, setPick] = useState(null);
  const [given, setGiven] = useState({});
  const mark = (k) => (n) => setGiven((g) => Object.assign({}, g, { [k]: n }));
  const rightText = (options.find((o) => o.v === right) || {}).text || "";

  /* ---- lessons that do not yet carry a hard lane keep the original screen ---- */
  if (!hard) {
    const chosenRight = pick !== null && pick === right;
    return (
      <div className="glass-panel" style={{ display: "flex", flexDirection: "column", gap: "13px", textAlign: "center" }}>
        <div style={{ fontSize: "12.5px", fontWeight: 800, color: "var(--daf-ink-2)", lineHeight: 1.5 }}>{prompt}</div>
        {draw && <Sketch draw={draw} height={height || 96} />}
        {omml && <MathEl omml={omml} size="xl" display="block" />}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(" + options.length + ", 1fr)", gap: "9px" }}>
          {options.map((o) => {
            const chosen = pick === o.v, isRight = o.v === right;
            return (
              <div key={o.v} className={"glass-card" + (chosen ? " chosen" : "")}
                onClick={() => { if (pick === null) setPick(o.v); }}
                style={{
                  padding: "15px 8px", fontWeight: 900, fontSize: "18px",
                  fontFamily: "'JetBrains Mono', monospace", minHeight: "62px",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  borderColor: pick !== null && chosen ? (isRight ? "var(--ok)" : "var(--warn)") : undefined,
                  borderWidth: pick !== null && chosen ? "2px" : "1px",
                  color: pick !== null && chosen ? (isRight ? "var(--ok)" : "var(--warn)") : "var(--daf-ink)"
                }}>
                {o.omml ? <MathEl omml={o.omml} size="lg" /> : o.text}
              </div>
            );
          })}
        </div>
        {pick !== null && (
          <div className="gsap-auto">
            {chosenRight
              ? <div style={{ color: "var(--ok)", fontWeight: 900, fontSize: "13px" }}>{support.yes}</div>
              : <div>
                  <div style={{ color: "var(--warn)", fontWeight: 900, fontSize: "13px", marginBottom: "7px" }}>{support.notYet}</div>
                  {support.draw && <Sketch draw={support.draw} height={support.h || 84} />}
                  {support.hint && <div style={{ fontSize: "11.5px", color: "var(--daf-ink-2)", marginTop: "6px" }}>{support.hint}</div>}
                </div>}
            <div style={{ marginTop: "10px" }}>
              <AwardRow label="Correct, first time" sub="tap the students who got it right"
                amount={XP.swykStandard} count={given.std} col="var(--ok)"
                onPick={() => award(XP.swykStandard, "correct", "Who got it right, first time?", "pick", mark("std"))} />
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ---- the two doors ------------------------------------------------------- */
  return (
    <div className="glass-panel" style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
      <div className="lane-head">
        <b>Choose one. Write your answer. Do not call it out.</b>
        <span>Taking the harder question earns XP whether or not you get it right.</span>
      </div>

      <div className="lane-grid">
        <QuestionPanel tone="var(--m-blue)" tag="STANDARD" prompt={prompt} omml={omml}
          draw={draw} height={height} revealed={revealed}
          answer={rightText} hint={support && support.hint} />
        <QuestionPanel tone="var(--daf-gold)" tag="HARDER" prompt={hard.prompt} omml={hard.omml}
          draw={hard.draw} height={hard.height} revealed={revealed}
          answer={hard.answer} hint={hard.hint} />
      </div>

      {!revealed ? (
        <button className="btn btn-primary" style={{ alignSelf: "center", minWidth: "260px" }}
          onClick={() => setRevealed(true)}>
          <Icon name="fa-eye" /> Reveal both answers
        </button>
      ) : (
        <div className="award-stack gsap-auto">
          <AwardRow label="Took the harder question" sub="tap everyone who chose it — right or wrong"
            amount={XP.hardAttempt} count={given.hard} col="var(--daf-gold)"
            onPick={() => award(XP.hardAttempt, "hard", "Who took the harder question?", "pick", mark("hard"))} />
          <AwardRow label="Harder question, correct" sub="of those, who got it right"
            amount={XP.hardCorrect} count={given.hardOk} col="var(--ok)"
            onPick={() => award(XP.hardCorrect, "hardOk", "Who got the harder one right?", "pick", mark("hardOk"))} />
          <AwardRow label="Standard question, correct" sub="first attempt only"
            amount={XP.swykStandard} count={given.std} col="var(--m-blue)"
            onPick={() => award(XP.swykStandard, "correct", "Who got it right, first time?", "pick", mark("std"))} />
        </div>
      )}
    </div>
  );
}

/* ===========================================================================
   Grade 4 · Topic 8 · LESSON 8-1 · Equivalent Fractions: Area Models
   Standard 4.NF.A.1   I can ... show that two fractions are equivalent by
   cutting the same whole into more pieces.
   =========================================================================== */

const M = {
  half: om(mfrac(1, 2)),
  twoFourths: om(mfrac(2, 4)),
  fourEighths: om(mfrac(4, 8)),
  chain: om(mfrac(1, 2), mt("="), mfrac(2, 4), mt("="), mfrac(4, 8)),
  sameShade: om(mnor("more pieces \u00b7 smaller pieces \u00b7 same amount")),
  thirds: om(mfrac(2, 3), mt("="), mfrac(4, 6)),
  rule: om(mnor("cutting every piece in two does not change how much is shaded")),
  swyk: om(mfrac(3, 4)),
  swykAnswer: om(mfrac(3, 4), mt("="), mfrac(6, 8))
};

const makeSplit = (split) => (ctx, W, H, frame) => {
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  D.fracBar(ctx, { x: 60, y: 76, w: W - 120, h: 62, den: 2, num: 1, split: split, prog: 1 });
  D.txt(ctx, "the shaded part never moved", W / 2, 38,
    { size: 14, col: "#EAF4F2", font: "marker" });
  const names = { 1: "one half", 2: "two quarters", 4: "four eighths" };
  D.txt(ctx, names[split] + " \u2014 the same amount", W / 2, H - 16,
    { size: 14.5, col: split > 1 ? "#34D399" : "#C9A227", font: "marker" });
};

const makeStack = (n) => (ctx, W, H, frame) => {
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  const rows = [[2, 1], [4, 2], [8, 4]];
  rows.forEach(function (r, k) {
    if (k >= n) return;
    D.fracBar(ctx, { x: 56, y: 38 + k * 62, w: W - 112, h: 34,
      den: r[0], num: r[1], prog: 1, col: "#2D70B3" });
  });
  if (n >= 3) {
    ctx.save();
    ctx.strokeStyle = "rgba(201,162,39,.7)"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(56 + (W - 112) / 2, 32);
    ctx.lineTo(56 + (W - 112) / 2, 38 + 2 * 62 + 38);
    ctx.stroke();
    ctx.restore();
    D.txt(ctx, "the edge lines up every time", W / 2, H - 10,
      { size: 13.5, col: "#34D399", font: "marker" });
  } else {
    D.txt(ctx, "add the next bar", W / 2, H - 10, { size: 13, col: "#C9A227", font: "marker" });
  }
};

const drawCake = (ctx, W, H, frame) => {
  const CYCLE = 620, f = frame % CYCLE;
  const p1 = D.at(f, 0, 120), p2 = D.at(f, 120, 300), p3 = D.at(f, 320, 450);
  D.rr(ctx, 0, 0, W, H, 14);
  ctx.fillStyle = "#0B1F24"; ctx.fill();
  D.txt(ctx, "one tray of kunafa", W / 2, 22, { size: 12.5, col: "#C9A227", font: "marker", alpha: p1 });

function Ambient() {
  const ref = useRef();
  useEffect(() => {
    const c = ref.current;
    if (!c || !c.getContext) return;
    const x = c.getContext("2d");
    if (!x) return;
    let w, h, id;
    const ps = Array.from({ length: 46 }, () => ({
      x: Math.random(), y: Math.random(), r: Math.random() * 1.9 + 0.6,
      vx: (Math.random() - 0.5) * 0.00016, vy: (Math.random() - 0.5) * 0.00016,
      g: Math.random() > 0.55
    }));
    function size() {
      if (!c) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = c.width = window.innerWidth * dpr;
      h = c.height = window.innerHeight * dpr;
    }
    function draw() {
      if (!x || !w || !h) return;
      try {
        x.clearRect(0, 0, w, h);
        for (const p of ps) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0) p.x = 1; if (p.x > 1) p.x = 0;
          if (p.y < 0) p.y = 1; if (p.y > 1) p.y = 0;
          x.beginPath();
          x.arc(p.x * w, p.y * h, p.r * Math.min(window.devicePixelRatio || 1, 2), 0, Math.PI * 2);
          x.fillStyle = p.g ? "rgba(201,162,39,.22)" : "rgba(18,133,124,.20)";
          x.fill();
        }
        id = requestAnimationFrame(draw);
      } catch (e) {}
    }
    size(); draw();
    window.addEventListener("resize", size);
    return () => { if (id) cancelAnimationFrame(id); window.removeEventListener("resize", size); };
  }, []);
  return <canvas ref={ref} className="ambient" />;
}
